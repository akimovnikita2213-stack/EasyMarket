<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>EasyMarket</title>
</head>
<body style="margin:0;background:#0b0d12;color:#fff;font-family:Arial,sans-serif">
<div style="padding:20px;text-align:center;color:#9db1cc">Загрузка EasyMarket…</div>
<script>
(async()=>{
  try{
    const r=await fetch('./index34.html?build=49_'+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    let html=await r.text();
    const patch=`
<style id="em49-variants-style">
#em49Variants{margin:14px 0;padding:14px;background:#12151c;border:1px solid #292d38;border-radius:16px}
.em49row{display:grid;grid-template-columns:1fr 1fr 1fr 40px;gap:7px;margin-bottom:8px}
.em49row input{width:100%;min-width:0;padding:11px;border-radius:10px;border:1px solid #303542;background:#191c25;color:#fff;box-sizing:border-box}
.em49del,.em49add{border:0;border-radius:10px;background:#252934;color:#fff}.em49add{width:100%;height:44px;font-weight:800}
#sellerPublishProductBtn{width:100%!important;min-height:54px!important;height:54px!important;padding:14px 16px!important;border-radius:13px!important;font-size:16px!important;font-weight:800!important;box-sizing:border-box!important}
#sellerPublishProductBtn:disabled{background:#666b75!important;color:#fff!important;opacity:1!important;cursor:not-allowed!important}
</style>
<script>
(function(){
  let busy=false;
  function install(){
    const btn=document.getElementById('sellerPublishProductBtn');
    const photo=document.getElementById('sellerProductImage');
    if(!btn||!photo||document.getElementById('em49Variants'))return;
    const w=document.createElement('div');w.id='em49Variants';
    w.innerHTML='<b style="display:block;margin-bottom:10px">Варианты товара</b><div id="em49list"></div><button id="em49add" class="em49add" type="button">＋ Добавить вариант</button><div style="color:#8d93a2;font-size:12px;margin-top:7px">Количество • Цена ₽ • Остаток</div>';
    photo.parentNode.insertBefore(w,photo);
    const list=document.getElementById('em49list'),add=document.getElementById('em49add');
    function row(q='',p='',s='1'){
      const x=document.createElement('div');x.className='em49row';
      x.innerHTML='<input class="em49qty" type="number" min="1" step="1" placeholder="Количество" value="'+q+'"><input class="em49price" type="number" min="0" step="1" placeholder="Цена ₽" value="'+p+'"><input class="em49stock" type="number" min="0" step="1" placeholder="Остаток" value="'+s+'"><button class="em49del" type="button">×</button>';
      x.querySelector('button').onclick=()=>{if(list.children.length>1){x.remove();syncButton()}};list.appendChild(x);
      x.querySelectorAll('input').forEach(i=>{i.addEventListener('input',syncButton);i.addEventListener('change',syncButton)});
    }
    function syncButton(){
      const name=(document.getElementById('sellerProductName')?.value||'').trim();
      const file=photo.files?.[0];
      const rows=[...document.querySelectorAll('.em49row')];
      const valid=rows.length>0&&rows.every(x=>{const q=Number(x.querySelector('.em49qty').value),p=Number(x.querySelector('.em49price').value),s=Number(x.querySelector('.em49stock').value);return Number.isInteger(q)&&q>0&&Number.isFinite(p)&&p>=0&&Number.isInteger(s)&&s>0});
      const ok=!!name&&!!file&&valid&&!busy;
      btn.disabled=!ok;
      btn.style.setProperty('width','100%','important');btn.style.setProperty('min-height','54px','important');btn.style.setProperty('height','54px','important');btn.style.setProperty('padding','14px 16px','important');btn.style.setProperty('border-radius','13px','important');btn.style.setProperty('font-size','16px','important');btn.style.setProperty('font-weight','800','important');btn.style.setProperty('box-sizing','border-box','important');btn.style.setProperty('opacity','1','important');
      btn.style.setProperty('background',ok?'#6c63ff':'#666b75','important');
      btn.style.setProperty('color','#fff','important');
    }
    row(1,'','1');add.onclick=()=>{row();syncButton()};
    btn.type='button';
    btn.addEventListener('click',async function(e){
      e.preventDefault();e.stopImmediatePropagation();
      if(busy)return;
      busy=true;btn.disabled=true;btn.textContent='Публикуем…';btn.style.setProperty('background','#666b75','important');btn.style.setProperty('color','#fff','important');
      const rows=[...document.querySelectorAll('.em49row')];
      const options=rows.map(x=>({qty:Number(x.querySelector('.em49qty').value),price:Number(x.querySelector('.em49price').value),stock:Number(x.querySelector('.em49stock').value)}));
      if(!options.length||options.some(x=>!Number.isInteger(x.qty)||x.qty<=0||!Number.isFinite(x.price)||x.price<0||!Number.isInteger(x.stock)||x.stock<=0)){busy=false;btn.textContent='Опубликовать товар';syncButton();alert('Заполните варианты товара');return;}
      const name=document.getElementById('sellerProductName')?.value.trim();
      if(!name){busy=false;btn.textContent='Опубликовать товар';syncButton();alert('Введите название');return;}
      const me=typeof getMyUserRecord==='function'?await getMyUserRecord():null;
      if(!me?.is_seller){busy=false;btn.textContent='Опубликовать товар';syncButton();alert('Нет прав продавца');return;}
      const imageInput=document.getElementById('sellerProductImage');const file=imageInput?.files?.[0];
      if(!file){busy=false;btn.textContent='Опубликовать товар';syncButton();alert('Добавьте фото товара');return;}
      try{
        let imageUrl=null;
        if(typeof compressSellerImage==='function') imageUrl=await compressSellerImage(file,900,.72,550*1024);
        else imageUrl=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(file)});
        const description=document.getElementById('sellerProductDescription')?.value.trim()||'';
        const details=document.getElementById('sellerProductDetails')?.value.trim()||'';
        const icon=document.getElementById('sellerProductIcon')?.value.trim()||'📦';
        const category=document.getElementById('sellerProductCategory')?.value||'other';
        const first=options[0];
        const payload={name,description,details,price:first.price,icon,category,image_url:imageUrl,seller_id:Number(me.telegram_id),seller_username:me.username?String(me.username).replace(/^@/,''):null,stock:options.reduce((a,x)=>a+x.stock,0),price_options:options.map(x=>({qty:x.qty,price:x.price,stock:x.stock})),approval_status:'pending'};
        const {data,error}=await supabaseClient.from('products').insert(payload).select('*').single();
        if(error)throw error;
        if(typeof notifySellerProductStatus==='function'){try{await notifySellerProductStatus(data,'pending')}catch(x){console.error('seller notification',x)}}
        alert('Товар отправлен на проверку 🕐');
        ['sellerProductName','sellerProductDescription','sellerProductDetails','sellerProductPrice'].forEach(id=>{const el=document.getElementById(id);if(el)el.value=''});
        const stockEl=document.getElementById('sellerProductStock');if(stockEl)stockEl.value='1';
        document.getElementById('sellerProductImage').value='';
        const prev=document.getElementById('sellerProductImagePreview');if(prev)prev.innerHTML='';
        list.innerHTML='';row(1,'','1');
        if(typeof loadProducts==='function')await loadProducts();if(typeof loadSellerDashboard==='function')await loadSellerDashboard();
      }catch(err){console.error(err);alert('Ошибка: '+(err?.message||err));}
      finally{busy=false;btn.textContent='Опубликовать товар';syncButton()}
    },true);
    const nameEl=document.getElementById('sellerProductName');
    if(nameEl){nameEl.addEventListener('input',syncButton);nameEl.addEventListener('change',syncButton)}
    photo.addEventListener('change',syncButton);
    syncButton();
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install);else install();
  setTimeout(install,500);setTimeout(install,1500);
})();
<\/script>`;
    html=html.replace('</body>',patch+'</body>');
    document.open();document.write(html);document.close();
  }catch(e){document.body.innerHTML='<div style="padding:30px;color:#fff">Ошибка загрузки EasyMarket: '+String(e.message||e)+'</div>';}
})();
</script>
</body>
</html>
