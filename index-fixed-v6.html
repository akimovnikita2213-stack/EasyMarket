<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>EasyMarket</title>
<style>html,body{margin:0;min-height:100%;background:#0b0d12;color:#fff}iframe{display:block;width:100%;height:100vh;border:0}</style>
</head>
<body>
<iframe id="app" title="EasyMarket"></iframe>
<script>
(async function(){
  var frame=document.getElementById('app');
  try{
    var r=await fetch('./index.html?fixed=20260917v6',{cache:'no-store'});
    if(!r.ok)throw new Error('index.html HTTP '+r.status);
    var html=await r.text();
    var marker='const supabaseClient = window.supabase.createClient';
    if(html.indexOf(marker)!==-1){
      html=html.replace(marker,'const supabaseClient = window.supabase.createClient');
      var needle='const supabaseClient = window.supabase.createClient';
      var pos=html.indexOf(needle);
      var end=html.indexOf(';',pos);
      if(pos!==-1&&end!==-1){
        end=end+1;
        html=html.slice(0,end)+'\nwindow.supabaseClient = supabaseClient;\n'+html.slice(end);
      }
    }else{
      html=html.replace(/<head([^>]*)>/i,'<head$1><base href="'+location.origin+'/EasyMarket/">');
      if(html.indexOf('window.supabaseClient')===-1){
        html=html.replace('</head>','<script>window.addEventListener("load",function(){try{if(window.supabase&&!window.supabaseClient)window.supabaseClient=window.supabase.createClient("https://uhmgjcoyxehknkehfbbj.supabase.co","sb_publishable_7Bn4Azfm58BkIJS_6vSsUw_qbGS4wTH")}catch(e){console.error(e)}});</script></head>');
      }
    }
    if(html.indexOf('<base ')===-1){
      html=html.replace(/<head([^>]*)>/i,'<head$1><base href="'+location.origin+'/EasyMarket/">');
    }
    frame.srcdoc=html;
  }catch(e){
    document.body.innerHTML='<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:Arial,sans-serif;color:#fff"><div><b>Ошибка загрузки EasyMarket</b><br><br>'+String(e.message||e).replace(/[<>]/g,'')+'<br><br><button onclick="location.reload()" style="padding:12px 18px;border:0;border-radius:12px;background:#6c63ff;color:#fff;font-weight:700">Повторить</button></div></div>';
  }
})();
</script>
</body>
</html>
