<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EasyMarket</title>
<meta name="easymarket-version" content="index36-seller-direct-publish-2026-09-16">
<style>html,body{margin:0;background:#0b0d12;color:#fff;font-family:Arial,sans-serif}#em36-loader{min-height:100vh;display:flex;align-items:center;justify-content:center;color:#858b99;font-size:14px}</style>
</head>
<body><div id="em36-loader">Загружаем EasyMarket…</div>
<script>
(async()=>{
try{
 const r=await fetch(new URL('index34.html',location.href).href,{cache:'no-store'});
 if(!r.ok)throw new Error('Не удалось загрузить index34.html');
 const html=await r.text();
 const doc=new DOMParser().parseFromString(html,'text/html');
 const patch=doc.createElement('script');
 patch.textContent=`
(function(){
var em36Busy=false;
function toast(t){try{if(typeof showToast==='function')showToast(t);else if(window.tg?.showPopup)tg.showPopup({title:'EasyMarket',message:String(t).slice(0,180),buttons:[{id:'ok',type:'ok',text:'OK'}]});}catch(e){}}
function btn(){return document.getElementById('sellerPublishProductBtn')}
function addVariant(q,p){
 var box=document.getElementById('em36Variants');if(!box)return;
 var row=document.createElement('div');row.className='em36-v';row.style.cssText='display:grid;grid-template-columns:1fr 1fr 42px;gap:8px;margin-top:7px';
 var qx=document.createElement('input');qx.type='number';qx.min='1';qx.step='1';qx.placeholder='Количество';qx.value=q||'';qx.className='seller-input';qx.style.cssText+=';min-height:44px;font-size:15px';
 var px=document.createElement('input');px.type='number';px.min='0';px.step='0.01';px.placeholder='Цена за набор, ₽';px.value=p||'';px.className='seller-input';px.style.cssText+=';min-height:44px;font-size:15px';
 var x=document.createElement('button');x.type='button';x.textContent='×';x.className='seller-action danger';x.style.cssText+=';height:44px;padding:0';x.onclick=function(){row.remove()};
 row.append(qx,px,x);box.append(row);
}
function setupVariants(){
 var form=document.getElementById('sellerProductForm');if(!form||document.getElementById('em36Variants'))return;
 var anchor=document.getElementById('sellerProductImage');
 var h=document.createElement('div');h.innerHTML='<div style="font-size:14px;font-weight:900;margin-top:8px">Количество и цена</div><div style="font-size:11px;color:#9298aa;margin-top:3px">Например: 1 шт. — 100 ₽, 2 шт. — 200 ₽, 3 шт. — 300 ₽</div>';
 var box=document.createElement('div');box.id='em36Variants';
 var add=document.createElement('button');add.type='button';add.textContent='＋ Добавить вариант';add.className='seller-action secondary';add.style.cssText+=';width:100%;margin-top:8px';add.onclick=function(){addVariant('', '')};
 form.insertBefore(h,anchor);form.insertBefore(box,anchor);form.insertBefore(add,anchor);addVariant(1,document.getElementById('sellerProductPrice')?.value||'');
}
function variants(){
 var a=[].slice.call(document.querySelectorAll('#em36Variants .em36-v')).map(function(r){return{qty:Number(r.children[0].value),price:Number(r.children[1].value)}}).filter(function(x){return Number.isFinite(x.qty)&&x.qty>0&&Number.isFinite(x.price)&&x.price>=0});
 var seen={};a.sort(function(x,y){return x.qty-y.qty});return a.filter(function(x){if(seen[x.qty])return false;seen[x.qty]=1;return true});
}
function imageToData(file){return new Promise(function(resolve,reject){var fr=new FileReader();fr.onerror=function(){reject(new Error('Фото не читается'))};fr.onload=function(){var img=new Image();img.onerror=function(){reject(new Error('Фото не обрабатывается'))};img.onload=function(){var max=900,s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));c.getContext('2d').drawImage(img,0,0,c.width,c.height);var q=.72,d=c.toDataURL('image/jpeg',q);for(var i=0;i<5&&d.length*.75>550*1024;i++){q-=.08;d=c.toDataURL('image/jpeg',Math.max(.4,q))}resolve(d)}};img.src=fr.result};fr.readAsDataURL(file)})}
async function directPublish(e){
 if(e){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation()}
 if(em36Busy)return;em36Busy=true;
 var b=btn();if(b){b.dataset.em36Old=b.textContent||'Опубликовать товар';b.textContent='Публикуем…';b.disabled=true;b.style.setProperty('opacity','1','important');b.style.setProperty('background','#666b75','important');}
 try{
  var me=await getMyUserRecord();if(!me?.is_seller){toast('Нет прав продавца');return}
  var name=document.getElementById('sellerProductName')?.value.trim()||'';
  var description=document.getElementById('sellerProductDescription')?.value.trim()||'';
  var details=document.getElementById('sellerProductDetails')?.value.trim()||'';
  var cat=document.getElementById('sellerProductCategory')?.value||'other';
  var icon=document.getElementById('sellerProductIcon')?.value.trim()||'📦';
  var file=document.getElementById('sellerProductImage')?.files?.[0];
  var vs=variants();
  if(!name){toast('Введите название');return}
  if(!vs.length){toast('Добавьте хотя бы один вариант количества и цены');return}
  if(!file){toast('Добавьте фото товара');return}
  toast('Обрабатываем фото…');
  var imageUrl=await imageToData(file);
  var first=vs[0], maxQty=Math.max.apply(null,vs.map(function(x){return x.qty}));
  var variantText='Варианты количества и цены:\n'+vs.map(function(x){return x.qty+' шт. — '+x.price+' ₽'}).join('\n');
  var fullDetails=(details?details+'\n\n':'')+variantText;
  var payload={name:name,description:description,details:fullDetails,price:Math.round(first.price),icon:icon,category:cat,image_url:imageUrl,seller_id:Number(me.telegram_id),seller_username:me.username?String(me.username).replace(/^@/,''):null,stock:Math.floor(maxQty),approval_status:'pending'};
  var ins=await supabaseClient.from('products').insert(payload).select('*').single();
  if(ins.error){toast('Ошибка публикации: '+ins.error.message);console.error('EM36 INSERT',ins.error);return}
  toast('Товар отправлен на проверку 🕐');
  try{await notifySellerProductStatus(ins.data,'pending')}catch(x){console.error(x)}
  ['sellerProductName','sellerProductDescription','sellerProductDetails','sellerProductPrice'].forEach(function(id){var el=document.getElementById(id);if(el)el.value=''});
  var st=document.getElementById('sellerProductStock');if(st)st.value='1';
  var im=document.getElementById('sellerProductImage');if(im)im.value='';
  var pr=document.getElementById('sellerProductImagePreview');if(pr)pr.innerHTML='';
  var vb=document.getElementById('em36Variants');if(vb)vb.innerHTML='';addVariant(1,'');
  var form=document.getElementById('sellerProductForm');if(form)form.style.display='none';
  await loadProducts();await loadSellerDashboard();
 }catch(err){console.error('EM36 PUBLISH ERROR',err);toast('Не удалось выставить товар: '+(err?.message||'ошибка'))}
 finally{em36Busy=false;if(b){b.disabled=false;b.textContent=b.dataset.em36Old||'Опубликовать товар';b.style.removeProperty('background');}}
}
function arm(){
 setupVariants();var b=btn();if(!b)return;b.type='button';
 if(b.dataset.em36==='1')return;b.dataset.em36='1';
 b.addEventListener('click',directPublish,true);
}
arm();new MutationObserver(arm).observe(document.documentElement,{childList:true,subtree:true});setInterval(arm,500);
})();`;
 doc.body.appendChild(patch);
 document.open();document.write('<!DOCTYPE html>'+doc.documentElement.outerHTML);document.close();
}catch(e){document.body.innerHTML='<div style="padding:30px;text-align:center;color:#fff">Ошибка загрузки EasyMarket<br><small style="color:#888">'+String(e.message||e)+'</small></div>'}
})();
</script></body></html>
