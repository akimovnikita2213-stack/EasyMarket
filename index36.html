<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EasyMarket</title>
<meta name="easymarket-version" content="index36-fixed-variants-2026-09-16">
<style>html,body{margin:0;background:#0b0d12;color:#fff;font-family:Arial,sans-serif}#em36-loader{min-height:100vh;display:flex;align-items:center;justify-content:center;color:#858b99;font-size:14px}</style>
</head>
<body><div id="em36-loader">Загружаем EasyMarket…</div>
<script>
(async()=>{
try{
 const r=await fetch(new URL('index34.html',location.href).href,{cache:'no-store'});
 if(!r.ok)throw new Error('Не удалось загрузить index34.html');
 const html=await r.text();
 const doc=new DOMParser().parseFromString(html,'text/html');
 const patch=doc.createElement('script');
 patch.textContent=`
(function(){
var busy=false;
function toast(t){try{if(typeof showToast==='function')showToast(t);else if(window.Telegram?.WebApp?.showPopup)Telegram.WebApp.showPopup({title:'EasyMarket',message:String(t).slice(0,180),buttons:[{id:'ok',type:'ok',text:'OK'}]});}catch(e){}}
function btn(){return document.getElementById('sellerPublishProductBtn')}
function addVariant(q,p){
 var box=document.getElementById('em36Variants');if(!box)return;
 var row=document.createElement('div');row.className='em36-v';row.style.cssText='display:grid;grid-template-columns:1fr 1fr 42px;gap:8px;margin-top:8px';
 var qx=document.createElement('input');qx.type='number';qx.min='1';qx.step='1';qx.placeholder='Количество';qx.value=q||'';qx.className='seller-input';qx.style.cssText='width:100%;min-height:44px;font-size:15px;padding:10px;box-sizing:border-box';
 var px=document.createElement('input');px.type='number';px.min='0';px.step='0.01';px.placeholder='Цена, ₽';px.value=p||'';px.className='seller-input';px.style.cssText='width:100%;min-height:44px;font-size:15px;padding:10px;box-sizing:border-box';
 var x=document.createElement('button');x.type='button';x.textContent='×';x.style.cssText='height:44px;border:0;border-radius:10px;background:#b63c4b;color:#fff;font-size:22px';x.onclick=function(){row.remove()};
 row.append(qx,px,x);box.appendChild(row);
}
function setupVariants(){
 if(document.getElementById('em36Variants'))return true;
 var anchor=document.getElementById('sellerProductImage');
 if(!anchor)return false;
 var host=anchor.parentElement||anchor;
 var wrap=document.createElement('div');wrap.id='em36VariantWrap';wrap.style.cssText='margin:12px 0 14px;padding:12px;border:1px solid #292e3b;border-radius:14px;background:#11141b';
 wrap.innerHTML='<div style="font-size:15px;font-weight:800">Количество и цена</div><div style="font-size:12px;color:#9298aa;margin:4px 0 8px">Например: 1 шт. — 100 ₽, 2 шт. — 200 ₽, 3 шт. — 300 ₽</div><div id="em36Variants"></div>';
 var add=document.createElement('button');add.type='button';add.textContent='＋ Добавить вариант';add.style.cssText='width:100%;margin-top:10px;min-height:44px;border:0;border-radius:11px;background:#252934;color:#fff;font-weight:700;font-size:14px';add.onclick=function(){addVariant('', '')};
 wrap.appendChild(add);
 host.parentNode.insertBefore(wrap,host);
 addVariant(1,document.getElementById('sellerProductPrice')?.value||'');
 return true;
}
function getVariants(){
 return Array.from(document.querySelectorAll('#em36Variants .em36-v')).map(function(r){return{qty:Number(r.children[0].value),price:Number(r.children[1].value)}}).filter(function(v){return Number.isFinite(v.qty)&&v.qty>0&&Number.isFinite(v.price)&&v.price>=0}).sort(function(a,b){return a.qty-b.qty}).filter(function(v,i,a){return i===0||a[i-1].qty!==v.qty});
}
function imageToData(file){return new Promise(function(resolve,reject){var fr=new FileReader();fr.onerror=function(){reject(new Error('Фото не читается'))};fr.onload=function(){var img=new Image();img.onerror=function(){reject(new Error('Фото не обрабатывается'))};img.onload=function(){var max=900,s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.7))};img.src=fr.result};fr.readAsDataURL(file)})}
async function publish(e){
 if(e){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation()}
 if(busy)return false;busy=true;
 var b=btn();if(b){b.textContent='Публикуем…';b.disabled=true;b.style.cssText+=';opacity:1!important;pointer-events:auto!important;background:#6c63ff!important;color:#fff!important'}
 try{
  var me=await getMyUserRecord();
  if(!me||!me.is_seller){toast('Нет прав продавца');return false}
  var name=(document.getElementById('sellerProductName')?.value||'').trim();
  var description=(document.getElementById('sellerProductDescription')?.value||'').trim();
  var details=(document.getElementById('sellerProductDetails')?.value||'').trim();
  var file=document.getElementById('sellerProductImage')?.files?.[0];
  var vs=getVariants();
  if(!name){toast('Введите название');return false}
  if(!vs.length){toast('Добавьте вариант количества и цены');return false}
  if(!file){toast('Добавьте фото товара');return false}
  toast('Обрабатываем фото…');
  var imageUrl=await imageToData(file);
  var first=vs[0], maxQty=Math.max.apply(null,vs.map(function(v){return v.qty}));
  var text='Варианты количества и цены:\n'+vs.map(function(v){return v.qty+' шт. — '+v.price+' ₽'}).join('\n');
  var payload={name:name,description:description,details:(details?details+'\n\n':'')+text,price:Math.round(first.price),icon:document.getElementById('sellerProductIcon')?.value?.trim()||'📦',category:document.getElementById('sellerProductCategory')?.value||'other',image_url:imageUrl,seller_id:Number(me.telegram_id),seller_username:me.username?String(me.username).replace(/^@/,''):null,stock:Math.floor(maxQty),approval_status:'pending'};
  var ins=await supabaseClient.from('products').insert(payload).select('*').single();
  if(ins.error)throw ins.error;
  toast('Товар отправлен на проверку 🕐');
  try{await notifySellerProductStatus(ins.data,'pending')}catch(x){console.error(x)}
  ['sellerProductName','sellerProductDescription','sellerProductDetails','sellerProductPrice'].forEach(function(id){var el=document.getElementById(id);if(el)el.value=''});
  var im=document.getElementById('sellerProductImage');if(im)im.value='';
  var vb=document.getElementById('em36Variants');if(vb)vb.innerHTML='';addVariant(1,'');
  try{if(typeof loadProducts==='function')await loadProducts()}catch(x){console.error(x)}
  try{if(typeof loadSellerDashboard==='function')await loadSellerDashboard()}catch(x){console.error(x)}
 }catch(err){console.error('EM36',err);toast('Ошибка публикации: '+(err?.message||'неизвестная ошибка'))}
 finally{busy=false;if(b){b.disabled=false;b.textContent='Опубликовать товар';b.style.removeProperty('background');}}
 return false;
}
function arm(){
 setupVariants();
 var b=btn();if(!b)return;
 if(b.dataset.em36Armed==='1')return;
 b.dataset.em36Armed='1';b.type='button';
 b.addEventListener('click',publish,true);
}
new MutationObserver(arm).observe(document.documentElement,{childList:true,subtree:true});
arm();
})();`;
 doc.body.appendChild(patch);
 document.open();document.write('<!DOCTYPE html>'+doc.documentElement.outerHTML);document.close();
}catch(e){document.body.innerHTML='<div style="padding:30px;text-align:center;color:#fff">Ошибка загрузки EasyMarket<br><small style="color:#888">'+String(e.message||e)+'</small></div>'}
})();
</script></body></html>
