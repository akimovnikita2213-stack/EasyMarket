<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EasyMarket</title>
<meta name="easymarket-version" content="index35-seller-button-fix-2026-09-16">
<style>html,body{margin:0;background:#0b0d12;color:#fff;font-family:Arial,sans-serif}#em35-loader{min-height:100vh;display:flex;align-items:center;justify-content:center;color:#858b99;font-size:14px}</style>
</head>
<body>
<div id="em35-loader">Загружаем EasyMarket…</div>
<script>
(async()=>{
  try{
    const src=new URL('index34.html',location.href).href;
    const response=await fetch(src,{cache:'no-store'});
    if(!response.ok)throw new Error('Не удалось загрузить index34.html');
    const html=await response.text();
    const doc=new DOMParser().parseFromString(html,'text/html');

    const patch=doc.createElement('script');
    patch.textContent=`
(function(){
  // Работаем именно с кнопкой продавца по её реальному тексту/контексту,
  // а не полагаемся на конкретный id.
  const state={busy:false};

  function isSellerPublishButton(el){
    if(!el || el.tagName!=='BUTTON') return false;
    const text=(el.textContent||'').replace(/\\s+/g,' ').trim().toLowerCase();
    if(text.includes('опубликовать товар')) return true;
    if(el.id==='sellerPublishProductBtn') return true;
    const form=el.closest('form');
    if(form){
      const f=(form.textContent||'').toLowerCase();
      if(f.includes('название') && f.includes('цена') && f.includes('товар')) return true;
    }
    return false;
  }

  function getSellerButtons(){
    return Array.from(document.querySelectorAll('button')).filter(isSellerPublishButton);
  }

  function markWaiting(btn){
    if(!btn || btn.dataset.em35Waiting==='1') return;
    btn.dataset.em35Waiting='1';
    btn.dataset.em35OriginalText=btn.textContent||'Опубликовать товар';
    btn.disabled=true;
    btn.style.background='#666b75';
    btn.style.borderColor='#666b75';
    btn.style.color='#fff';
    btn.style.opacity='1';
    btn.style.cursor='wait';
    btn.style.pointerEvents='none';
    btn.textContent='Ожидайте…';
  }

  // Самое важное: capture-событие срабатывает раньше обычного onclick/submit,
  // поэтому кнопка визуально меняется МГНОВЕННО, даже если публикация потом долго ждёт Supabase/Telegram.
  function captureClick(event){
    const btn=event.target?.closest?.('button');
    if(!btn || !isSellerPublishButton(btn)) return;
    if(state.busy) return;
    state.busy=true;
    markWaiting(btn);
    setTimeout(()=>{state.busy=false;},15000);
  }

  function captureSubmit(event){
    const form=event.target;
    if(!form || form.tagName!=='FORM') return;
    const submitter=event.submitter;
    const btn=(submitter&&isSellerPublishButton(submitter))
      ? submitter
      : getSellerButtons().find(b=>b.closest('form')===form);
    if(!btn) return;
    if(state.busy) return;
    state.busy=true;
    markWaiting(btn);
    setTimeout(()=>{state.busy=false;},15000);
  }

  document.addEventListener('click',captureClick,true);
  document.addEventListener('submit',captureSubmit,true);

  function decorate(){
    getSellerButtons().forEach(btn=>{
      if(btn.dataset.em35Decorated==='1') return;
      btn.dataset.em35Decorated='1';
      btn.style.minHeight='54px';
      btn.style.width='100%';
      btn.style.fontSize='17px';
      btn.style.fontWeight='800';
      btn.style.borderRadius='13px';
    });
  }

  decorate();
  new MutationObserver(decorate).observe(document.documentElement,{childList:true,subtree:true});
  setInterval(decorate,500);
})();`;

    doc.body.appendChild(patch);
    document.open();
    document.write('<!DOCTYPE html>'+doc.documentElement.outerHTML);
    document.close();
  }catch(err){
    document.body.innerHTML='<div style="padding:30px;text-align:center;color:#fff">Ошибка загрузки EasyMarket<br><small style="color:#888">'+String(err.message||err)+'</small></div>';
  }
})();
</script>
</body>
</html>
