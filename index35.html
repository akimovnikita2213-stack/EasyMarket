<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EasyMarket</title>
<meta name="easymarket-version" content="index35-seller-form-hotfix-2026-09-16-3">
<style>
html,body{margin:0;background:#0b0d12;color:#fff;font-family:Arial,sans-serif}
#em35-loader{min-height:100vh;display:flex;align-items:center;justify-content:center;color:#858b99;font-size:14px}
</style>
</head>
<body>
<div id="em35-loader">Загружаем EasyMarket…</div>
<script>
(async()=>{
try{
 const src=new URL('index34.html',location.href).href;
 const r=await fetch(src,{cache:'no-store'});
 if(!r.ok)throw new Error('Не удалось загрузить index34.html');
 const html=await r.text();
 const doc=new DOMParser().parseFromString(html,'text/html');
 const patch=doc.createElement('script');
 patch.textContent=`
(function(){
  var busy=false;
  function sellerButton(){
    var b=document.getElementById('sellerPublishProductBtn');
    if(b)return b;
    var root=document.getElementById('sellerProductForm');
    if(root){
      var bs=root.querySelectorAll('button');
      for(var i=0;i<bs.length;i++){if(/опубликовать товар/i.test((bs[i].textContent||'').trim()))return bs[i];}
    }
    var all=document.querySelectorAll('button');
    for(var j=0;j<all.length;j++){if(/опубликовать товар/i.test((all[j].textContent||'').trim()))return all[j];}
    return null;
  }
  function paint(b,on){
    if(!b)return;
    if(on){
      if(!b.dataset.em35Text)b.dataset.em35Text=b.textContent||'Опубликовать товар';
      b.disabled=true;b.textContent='Ожидайте…';
      b.style.setProperty('background','#666b75','important');
      b.style.setProperty('color','#fff','important');
      b.style.setProperty('opacity','1','important');
      b.style.setProperty('pointer-events','none','important');
      b.style.setProperty('width','100%','important');
      b.style.setProperty('min-height','54px','important');
      b.style.setProperty('font-size','17px','important');
      b.style.setProperty('font-weight','800','important');
      b.style.setProperty('border-radius','14px','important');
    }else{
      b.disabled=false;b.textContent=b.dataset.em35Text||'Опубликовать товар';
      b.style.removeProperty('background');b.style.removeProperty('color');b.style.removeProperty('opacity');b.style.removeProperty('pointer-events');
    }
  }
  function ensureSellerFields(){
    var form=document.getElementById('sellerProductForm');
    if(!form)return;
    var price=document.getElementById('sellerProductPrice');
    var stock=document.getElementById('sellerProductStock');
    if(price){price.type='number';price.min='0';price.step='0.01';price.placeholder='Цена, ₽';price.style.cssText+=';width:100%;min-height:46px;font-size:16px;';}
    if(stock){stock.type='number';stock.min='1';stock.step='1';if(!stock.value||Number(stock.value)<1)stock.value='1';stock.placeholder='Количество';stock.style.cssText+=';width:100%;min-height:46px;font-size:16px;';}
    var row=price&&stock?price.parentElement:null;
    if(row){row.style.cssText+=';display:grid;grid-template-columns:1fr 1fr;gap:10px;';
      if(!row.querySelector('.em35-price-label')){var p=document.createElement('div');p.className='em35-price-label';p.style.cssText='font-size:12px;font-weight:800;color:#aeb3bf;margin-bottom:-5px';p.textContent='Цена за товар, ₽';price.parentElement.insertBefore(p,price);}
      if(!row.querySelector('.em35-stock-label')){var s=document.createElement('div');s.className='em35-stock-label';s.style.cssText='font-size:12px;font-weight:800;color:#aeb3bf;margin-bottom:-5px';s.textContent='Количество, шт.';stock.parentElement.insertBefore(s,stock);}
    }
  }
  function arm(){
    ensureSellerFields();
    var b=sellerButton();
    if(!b)return;
    b.type='button';
    b.style.setProperty('width','100%','important');
    b.style.setProperty('min-height','54px','important');
    b.style.setProperty('font-size','17px','important');
    b.style.setProperty('font-weight','800','important');
    if(b.dataset.em35Capture!=='1'){
      b.dataset.em35Capture='1';
      b.addEventListener('pointerdown',function(){if(!busy){busy=true;paint(b,true);}},true);
      b.addEventListener('touchstart',function(){if(!busy){busy=true;paint(b,true);}},true);
      b.addEventListener('click',async function(e){
        e.preventDefault();e.stopImmediatePropagation();
        if(!busy)busy=true;
        paint(b,true);
        var fn=window.saveSellerProduct;
        if(typeof fn!=='function'){paint(b,false);busy=false;return;}
        try{
          await fn(e);
        }catch(err){console.error(err);}
        setTimeout(function(){paint(b,false);busy=false;},350);
      },true);
    }
  }
  arm();
  new MutationObserver(arm).observe(document.documentElement,{childList:true,subtree:true});
  setInterval(arm,500);
})();`;
 doc.body.appendChild(patch);
 document.open();document.write('<!DOCTYPE html>'+doc.documentElement.outerHTML);document.close();
}catch(e){document.body.innerHTML='<div style="padding:30px;text-align:center;color:#fff">Ошибка загрузки EasyMarket<br><small style="color:#888">'+String(e.message||e)+'</small></div>';}
})();
</script>
</body>
</html>
