<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>EasyMarket</title><script src="https://telegram.org/js/telegram-web-app.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#0b0d12;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.logo{font-size:25px;font-weight:800}.logo span{color:#6c63ff}.search{width:100%;padding:14px;border-radius:14px;border:1px solid #292d38;background:#141720;color:#fff;font-size:16px;margin-bottom:14px}.cats{display:flex;gap:8px;overflow:auto;margin-bottom:18px}.cat{border:1px solid #292d38;background:#151821;color:#bbb;padding:9px 13px;border-radius:12px;white-space:nowrap}.cat.active{background:#6c63ff;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:#141720;border:1px solid #292d38;border-radius:16px;padding:12px}.pic{width:100%;aspect-ratio:1.2;object-fit:cover;border-radius:12px;background:#1b1e28}.icon{width:100%;aspect-ratio:1.2;border-radius:12px;background:#1b1e28;display:flex;align-items:center;justify-content:center;font-size:48px}.name{font-weight:800;font-size:16px;margin:10px 0 5px}.desc{color:#9298a7;font-size:13px;line-height:1.35;min-height:35px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}.price{font-weight:800}.buy{border:0;border-radius:10px;padding:9px 12px;background:#6c63ff;color:#fff;font-weight:700}.state{text-align:center;color:#9298a7;padding:50px 10px}.err{color:#ff7b89}.cart{position:fixed;right:16px;bottom:16px;border:0;border-radius:16px;background:#6c63ff;color:#fff;padding:14px 18px;font-weight:800;box-shadow:0 8px 30px #0008}@media(min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}</style></head><body><main class="wrap"><div class="head"><div class="logo">Easy<span>Market</span></div><div id="count"></div></div><input id="search" class="search" placeholder="Поиск товаров..."><div id="cats" class="cats"></div><div id="status" class="state">Загрузка товаров…</div><div id="grid" class="grid"></div></main><button id="cart" class="cart">🛒 Корзина <span id="cartCount">0</span></button><script>
(function(){
'use strict';
var URL='https://uhmgjcoyxehknkehfbbj.supabase.co';var KEY='sb_publishable_7Bn4Azfm58BkIJS_6vSsUw_qbGS4wTH';
var client=window.supabase.createClient(URL,KEY);window.supabaseClient=client;
var all=[],cat='Все',cart=[];var grid=document.getElementById('grid'),status=document.getElementById('status'),cats=document.getElementById('cats'),search=document.getElementById('search');
function esc(v){return String(v==null?'':v).replace(/[&<>\"']/g,function(x){return({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'})[x]})}
function drawCats(){var cs=['Все'];all.forEach(function(p){if(p.category&&!cs.includes(p.category))cs.push(p.category)});cats.innerHTML=cs.map(function(x){return '<button class="cat '+(x===cat?'active':'')+'" data-cat="'+esc(x)+'">'+esc(x)+'</button>'}).join('');cats.onclick=function(e){var b=e.target.closest('.cat');if(!b)return;cat=b.dataset.cat;drawCats();draw()}}
function draw(){var q=search.value.trim().toLowerCase();var list=all.filter(function(p){return(cat==='Все'||p.category===cat)&&(!q||((p.name||'')+' '+(p.description||'')).toLowerCase().includes(q))});document.getElementById('count').textContent=list.length+' товаров';if(!list.length){grid.innerHTML='';status.textContent='Товаров не найдено';status.style.display='block';return}status.style.display='none';grid.innerHTML=list.map(function(p){var image=p.image_url?'<img class="pic" src="'+esc(p.image_url)+'" loading="lazy">':'<div class="icon">'+esc(p.icon||'🛍️')+'</div>';return '<article class="card">'+image+'<div class="name">'+esc(p.name)+'</div><div class="desc">'+esc(p.description||'')+'</div><div class="row"><span class="price">'+esc(p.price)+' ⭐</span><button class="buy" data-id="'+p.id+'">В корзину</button></div></article>'}).join('')}
grid.onclick=function(e){var b=e.target.closest('.buy');if(!b)return;var p=all.find(function(x){return String(x.id)===String(b.dataset.id)});if(p){cart.push(p);document.getElementById('cartCount').textContent=cart.length;b.textContent='✓ Добавлено'}};
search.oninput=draw;
window.Telegram&&Telegram.WebApp&&Telegram.WebApp.ready();
var timeout=setTimeout(function(){status.className='state err';status.textContent='Не удалось загрузить товары. Нажми обновить страницу.'},10000);
client.from('products').select('id,name,description,price,icon,category,image_url,details,stock,approval_status').eq('approval_status','approved').order('created_at',{ascending:false}).then(function(res){clearTimeout(timeout);if(res.error)throw res.error;all=res.data||[];drawCats();draw()}).catch(function(e){clearTimeout(timeout);console.error(e);status.className='state err';status.textContent='Ошибка загрузки: '+(e.message||e)});
})();
</script></body></html>
