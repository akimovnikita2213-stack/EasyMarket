<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>EasyMarket</title>
</head>
<body style="margin:0;background:#0b0d12;color:#fff;font-family:Arial,sans-serif">
<div style="padding:20px;text-align:center;color:#9db1cc">Загрузка EasyMarket…</div>
<script>
(async()=>{
  try{
    const r=await fetch('./index48.html?base=48_50_'+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    let html=await r.text();
    const patch=`
<script>
(function(){
  function watchButton(){
    const btn=document.getElementById('sellerPublishProductBtn');
    if(!btn||btn.dataset.em50Installed==='1')return;
    btn.dataset.em50Installed='1';
    btn.addEventListener('click',function(){
      setTimeout(function(){
        if(btn.disabled){
          btn.textContent='Ожидайте…';
          btn.style.setProperty('background','#666b75','important');
          btn.style.setProperty('color','#fff','important');
          btn.style.setProperty('opacity','1','important');
        }
      },0);
    },true);
    const obs=new MutationObserver(function(){
      if(btn.disabled){
        btn.textContent='Ожидайте…';
        btn.style.setProperty('background','#666b75','important');
        btn.style.setProperty('color','#fff','important');
        btn.style.setProperty('opacity','1','important');
      }
    });
    obs.observe(btn,{attributes:true,childList:true,subtree:true,characterData:true});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',watchButton);else watchButton();
  setTimeout(watchButton,500);setTimeout(watchButton,1500);setTimeout(watchButton,3000);
})();
<\/script>`;
    html=html.replace('</body>',patch+'</body>');
    document.open();document.write(html);document.close();
  }catch(e){document.body.innerHTML='<div style="padding:30px;color:#fff">Ошибка загрузки EasyMarket: '+String(e.message||e)+'</div>';}
})();
</script>
</body>
</html>
