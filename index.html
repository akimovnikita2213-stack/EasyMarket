<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<style>
:root{--bg:#071225;--panel:#0b1b34;--panel2:#102544;--line:#234267;--text:#f7fbff;--muted:#9db1cc;--blue:#2563eb;--cyan:#0ea5e9;--danger:#ef4444;--ok:#22c55e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 10% 0,#123a72 0,transparent 32%),radial-gradient(circle at 95% 15%,#0c5272 0,transparent 28%),linear-gradient(145deg,#050b16,#091a33 55%,#07101f);color:var(--text);font-family:Arial,sans-serif}body{padding:14px 14px 86px}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}button:disabled{opacity:.55;cursor:not-allowed}.app{max-width:1100px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.logo{font-size:25px;font-weight:950;letter-spacing:-1.4px}.logo i{font-style:normal;color:#60a5fa}.actions{display:flex;gap:8px}.icon{position:relative;width:44px;height:44px;border-radius:13px;background:#0b203e;border:1px solid #25476e;color:#fff;font-size:20px}.badge{position:absolute;right:-4px;top:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:#2563eb;color:#fff;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center}.search{width:100%;padding:14px 16px;border:1px solid #234267;border-radius:14px;background:#08172d;color:#fff;outline:0;margin-bottom:12px}.cats{display:flex;gap:8px;overflow:auto;padding-bottom:4px;margin-bottom:18px}.cat{flex:0 0 auto;padding:10px 14px;border-radius:12px;background:#0b1d37;border:1px solid #244568;color:#b9c9df}.cat.active{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;border-color:#4da3ff}.title{font-size:21px;font-weight:900;margin-bottom:13px}.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{min-width:0;border:1px solid #214264;border-radius:16px;background:linear-gradient(145deg,#0d2442,#08172c);padding:11px;box-shadow:0 12px 30px #0004}.card:active{transform:scale(.99)}.pic{width:100%;aspect-ratio:1.15;object-fit:cover;border-radius:12px;background:#0b1c35;margin-bottom:10px}.emoji{width:100%;aspect-ratio:1.15;border-radius:12px;background:#0b1c35;display:flex;align-items:center;justify-content:center;font-size:48px;margin-bottom:10px}.name{font-weight:800;font-size:15px;line-height:1.25}.desc{color:var(--muted);font-size:12px;line-height:1.35;min-height:32px;margin:5px 0 8px}.seller{color:#7fb4e8;font-size:11px;margin-bottom:8px}.row{display:flex;align-items:center;justify-content:space-between;gap:7px}.price{font-weight:900;white-space:nowrap}.buy,.primary{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;border-radius:11px;padding:10px 11px;font-weight:900}.empty,.loading{text-align:center;color:var(--muted);padding:45px 15px;grid-column:1/-1}.overlay{position:fixed;inset:0;background:#000b;backdrop-filter:blur(8px);display:none;align-items:flex-end;justify-content:center;z-index:100}.overlay.open{display:flex}.sheet{width:min(620px,100%);max-height:92vh;overflow:auto;background:linear-gradient(145deg,#0e2443,#071426);border:1px solid #285078;border-radius:24px 24px 0 0;padding:17px}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.head h2{margin:0;font-size:21px}.close{width:38px;height:38px;border-radius:11px;background:#19304e;color:#fff;font-size:22px}.modal-img{width:100%;max-height:330px;object-fit:cover;border-radius:15px}.modal-title{font-size:23px;font-weight:900;margin:13px 0 5px}.modal-price{font-size:22px;font-weight:900}.label{color:#8ea7c5;font-size:12px;font-weight:800;margin:15px 0 6px}.text{white-space:pre-line;line-height:1.5;color:#d9e4f1}.options{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.opt{padding:9px 11px;border-radius:11px;background:#0b1d36;border:1px solid #284a6e;color:#fff;font-weight:800}.opt.active{background:linear-gradient(135deg,var(--blue),var(--cyan));border-color:#60a5fa}.cart-item{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #1e3a5a}.qty{display:flex;align-items:center;gap:7px;margin-top:7px}.qty button{width:29px;height:29px;border-radius:8px;background:#19304e;color:#fff}.total{display:flex;justify-content:space-between;font-size:19px;font-weight:900;padding:15px 0}.form{display:grid;gap:9px}.form input,.form textarea,.form select{width:100%;border:1px solid #284b70;border-radius:12px;background:#08172c;color:#fff;padding:12px;outline:0}.form textarea{min-height:80px;resize:vertical}.variants{display:grid;gap:8px}.variant{display:grid;grid-template-columns:1fr 1fr 1fr 40px;gap:7px}.variant input{min-width:0}.del{background:#2b1a24;color:#ff9ca7;border-radius:10px}.hint{font-size:11px;color:#8ea7c5;line-height:1.4}.full{width:100%}.publish{min-height:52px;font-size:16px}.nav{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);width:calc(100% - 14px);max-width:560px;display:flex;gap:4px;padding:5px;border:1px solid #234267;border-radius:17px;background:#071426f2;backdrop-filter:blur(12px);z-index:90}.nav button{flex:1;min-width:0;height:46px;border-radius:12px;background:transparent;color:#9db1cc;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:18px}.nav button span{font-size:8px;margin-top:2px}.nav button.active{background:#12345d;color:#fff}.admin-list{display:grid;gap:8px}.admin-row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px;border:1px solid #234267;border-radius:13px;background:#0b1d35}.admin-meta{color:#8ea7c5;font-size:11px;margin-top:4px}.buttons{display:flex;gap:6px;flex-wrap:wrap}.danger{background:#5a1d29;color:#ffb2bb;border-radius:10px;padding:9px 11px;font-weight:800}.secondary{background:#19304e;color:#fff;border-radius:10px;padding:9px 11px;font-weight:800}.toast{position:fixed;left:50%;bottom:75px;transform:translate(-50%,15px);opacity:0;pointer-events:none;background:#132943;border:1px solid #31577f;color:#fff;padding:11px 15px;border-radius:12px;z-index:5000;transition:.2s;max-width:90%;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}@media(min-width:700px){.products{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:420px){.variant{grid-template-columns:1fr 1fr 1fr 34px}.variant input{padding:9px 6px}.buy{padding:9px 7px;font-size:11px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="logo">Easy<span>Market</span></div><div class="actions"><button class="icon" id="profileBtn">👤</button><button class="icon" id="cartBtn">🛒<b class="badge" id="cartBadge">0</b></button></div></header>
<input class="search" id="search" placeholder="🔎 Поиск товаров...">
<div class="cats" id="cats"><button class="cat active" data-cat="all">Все</button><button class="cat" data-cat="services">🛠️ Услуги</button><button class="cat" data-cat="accounts">👤 Аккаунты</button><button class="cat" data-cat="codes">🔑 Коды</button><button class="cat" data-cat="donate">🎁 Донат</button><button class="cat" data-cat="other">📦 Прочее</button></div>
<div class="title">Товары</div><main class="products" id="products"><div class="loading">Загрузка товаров…</div></main>
</div>
<nav class="nav"><button class="active" data-nav="orders">🧾<span>Заказы</span></button><button id="sellerNav" data-nav="seller" style="display:none">🏪<span>Товары</span></button><button data-nav="chats">💬<span>Чаты</span></button><button data-nav="settings">⚙️<span>Настройки</span></button></nav>
<div class="overlay" id="productOverlay"><div class="sheet" id="productSheet"></div></div>
<div class="overlay" id="cartOverlay"><div class="sheet"><div class="head"><h2>🛒 Корзина</h2><button class="close" data-close="cartOverlay">×</button></div><div id="cartItems"></div><div class="total"><span>Итого</span><span id="cartTotal">0 ₽</span></div><button class="primary full" id="checkout">⚡ Оформить заказ</button></div></div>
<div class="overlay" id="ordersOverlay"><div class="sheet"><div class="head"><h2>🧾 Мои заказы</h2><button class="close" data-close="ordersOverlay">×</button></div><div class="buttons"><button class="secondary" data-order-filter="pending">⏳ В работе</button><button class="secondary" data-order-filter="done">✅ Получены</button></div><div id="ordersList" style="margin-top:12px"></div></div></div>
<div class="overlay" id="settingsOverlay"><div class="sheet"><div class="head"><h2>⚙️ Настройки</h2><button class="close" data-close="settingsOverlay">×</button></div><button class="secondary full" id="themeBtn">☀️ Светлая тема</button><button class="primary full" id="sellerEntry" style="display:none;margin-top:9px">🏪 Панель продавца</button><button class="secondary full" id="becomeSeller" style="margin-top:9px">🏪 Стать продавцом</button><button class="secondary full" id="adminEntry" style="margin-top:9px">🛡️ Админ-панель</button></div></div>
<div class="overlay" id="profileOverlay"><div class="sheet"><div class="head"><h2>👤 Профиль</h2><button class="close" data-close="profileOverlay">×</button></div><div id="profile"></div></div></div>
<div class="overlay" id="sellerOverlay"><div class="sheet"><div class="head"><h2>🏪 Панель продавца</h2><button class="close" data-close="sellerOverlay">×</button></div><div id="sellerStats"></div><div class="seller-card" style="margin:10px 0;padding:12px;border:1px solid #234267;border-radius:14px"><button class="secondary full" id="toggleAdd">＋ Добавить товар</button><div id="sellerForm" class="form" style="display:none;margin-top:10px"><input id="sName" placeholder="Название товара"><textarea id="sDesc" placeholder="Описание"></textarea><textarea id="sDetails" placeholder="Что получит покупатель"></textarea><div class="variants" id="variants"></div><button class="secondary full" id="addVariant">＋ Добавить вариант</button><div class="hint">Количество • Цена ₽ • Остаток. Можно добавить любое количество вариантов.</div><input id="sImage" type="file" accept="image/*"><div id="sPreview"></div><select id="sCat"><option value="other">📦 Прочее</option><option value="services">🛠️ Услуги</option><option value="accounts">👤 Аккаунты</option><option value="codes">🔑 Коды</option><option value="donate">🎁 Донат</option></select><button class="primary full publish" id="publish" disabled>Опубликовать товар</button></div></div><h3>📦 Мои товары</h3><div id="sellerProducts"></div><h3>🧾 Заказы</h3><div id="sellerOrders"></div></div></div>
<div class="overlay" id="adminOverlay"><div class="sheet"><div class="head"><h2>🛡️ Админ-панель</h2><button class="close" data-close="adminOverlay">×</button></div><div id="adminContent"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const URL='https://uhmgjcoyxehknkehfbbj.supabase.co';
const KEY='sb_publishable_7Bn4Azfm58BkIJS_6vSsUw_qbGS4wTH';
const db=window.supabase.createClient(URL,KEY);const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let products=[],cart=[],cat='all',selectedProduct=null,selectedQty=null,checkoutBusy=false,me=null,orderFilter='pending';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const toast=m=>{const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),3000)};
const open=id=>$('#'+id).classList.add('open'),close=id=>$('#'+id).classList.remove('open');
function user(){return tg?.initDataUnsafe?.user||null} function uid(){return user()?.id?String(user().id):''}
async function saveUser(){const u=user();if(!u?.id)return;await db.from('users').upsert({telegram_id:String(u.id),username:u.username||null,first_name:u.first_name||null,last_name:u.last_name||null},{onConflict:'telegram_id'})}
async function loadMe(){const id=uid();if(!id){me=null;return null}const r=await db.from('users').select('*').eq('telegram_id',id).maybeSingle();me=r.data||null;$('#sellerNav').style.display=me?.is_seller?'flex':'none';$('#sellerEntry').style.display=me?.is_seller?'block':'none';$('#becomeSeller').style.display=me?.is_seller?'none':'block';return me}
function options(p){let a=Array.isArray(p.price_options)?p.price_options:[];a=a.map(x=>({qty:Number(x.qty),price:Number(x.price),stock:Number(x.stock??p.stock??0)})).filter(x=>x.qty>0&&x.price>=0);return a.length?a:[{qty:1,price:Number(p.price||0),stock:Number(p.stock??999999)}]}
function clean(s){return String(s||'').replace(/<!--EM_PRICES:.*?-->/g,'').trim()}
async function loadProducts(){const box=$('#products');box.innerHTML='<div class="loading">Загрузка товаров…</div>';const r=await db.from('products').select('*').order('id',{ascending:false});if(r.error){box.innerHTML='<div class="empty">Ошибка загрузки товаров<br><small>'+esc(r.error.message)+'</small></div>';return}products=(r.data||[]).filter(p=>!p.seller_id||String(p.approval_status||'approved')==='approved');render()}
function render(){const q=$('#search').value.trim().toLowerCase();const list=products.filter(p=>(cat==='all'||p.category===cat)&&(!q||(p.name+' '+(p.description||'')).toLowerCase().includes(q)));const box=$('#products');if(!list.length){box.innerHTML='<div class="empty">Товары не найдены 📦</div>';return}box.innerHTML=list.map(p=>`<article class="card" data-product="${p.id}">${p.image_url?`<img class="pic" src="${esc(p.image_url)}">`:`<div class="emoji">${esc(p.icon||'📦')}</div>`}<div class="name">${esc(p.name)}</div><div class="desc">${esc(clean(p.description))}</div>${p.seller_id?`<div class="seller">🏪 @${esc(p.seller_username||'Продавец')}</div>`:''}<div class="row"><span class="price">${Number(p.price||0)} ₽</span><button class="buy" data-buy="${p.id}" type="button">⚡ Оформить</button></div></article>`).join('')}
function showProduct(id,qty){const p=products.find(x=>Number(x.id)===Number(id));if(!p)return toast('Товар не найден');selectedProduct=p;const os=options(p);selectedQty=qty&&os.some(x=>x.qty===Number(qty))?Number(qty):os[0].qty;const o=os.find(x=>x.qty===selectedQty)||os[0];$('#productSheet').innerHTML=`<div class="head"><h2>${esc(p.name)}</h2><button class="close" data-close="productOverlay">×</button></div>${p.image_url?`<img class="modal-img" src="${esc(p.image_url)}">`:`<div class="emoji">${esc(p.icon||'📦')}</div>`}<div class="modal-price" id="modalPrice">${o.price} ₽</div><div class="label">Количество</div><div class="options">${os.map(x=>`<button class="opt ${x.qty===selectedQty?'active':''}" data-option="${x.qty}" type="button">${x.qty} шт.<br><small>${x.price} ₽ · остаток ${x.stock}</small></button>`).join('')}</div>${p.description?`<div class="label">Описание</div><div class="text">${esc(clean(p.description))}</div>`:''}${p.details?`<div class="label">Детали</div><div class="text">${esc(clean(p.details))}</div>`:''}<button class="primary full" data-modal-buy="1" type="button" style="margin-top:15px">⚡ Оформить</button>`;open('productOverlay')}
function add(id,qty){const p=products.find(x=>Number(x.id)===Number(id));if(!p)return toast('Товар не найден');const o=options(p).find(x=>x.qty===Number(qty))||options(p)[0];if(Number(o.stock)<=0)return toast('Этого варианта нет в наличии');if(cart.some(x=>Number(x.id)===Number(id))){toast('Товар уже в корзине 🛒');return}cart.push({...p,quantity:o.qty,price:o.price,stock:o.stock});saveCart();renderCart();toast('Товар добавлен 🛒');return true}
function saveCart(){localStorage.setItem('easymarket_cart',JSON.stringify(cart))}function loadCart(){try{cart=JSON.parse(localStorage.getItem('easymarket_cart')||'[]');if(!Array.isArray(cart))cart=[]}catch{cart=[]}}
function renderCart(){const n=cart.length;$('#cartBadge').textContent=n;const box=$('#cartItems');if(!n){box.innerHTML='<div class="empty" style="padding:30px">Корзина пустая 🛒</div>';$('#cartTotal').textContent='0 ₽';$('#checkout').disabled=true;return}let total=0;box.innerHTML=cart.map((x,i)=>{total+=Number(x.price||0);return `<div class="cart-item"><div><b>${esc(x.name)}</b><div style="color:#9db1cc;font-size:12px">${Number(x.price)} ₽ · ${Number(x.quantity)} шт.</div><div class="qty"><button data-minus="${i}" type="button">−</button><b>${Number(x.quantity)}</b><button data-plus="${i}" type="button">+</button></div></div><button class="danger" data-remove="${i}" type="button">✕</button></div>`}).join('');$('#cartTotal').textContent=total+' ₽';$('#checkout').disabled=false}
function changeQty(i,d){const x=cart[i];if(!x)return;const os=options(x),pos=os.findIndex(o=>o.qty===Number(x.quantity)),next=os[pos+d];if(!next)return;if(Number(next.stock)<=0)return toast('Нет остатка');x.quantity=next.qty;x.price=next.price;saveCart();renderCart()}
async function checkout(){if(checkoutBusy)return;if(!cart.length)return toast('Корзина пустая');const u=user();if(!u?.id)return toast('Откройте магазин через Telegram');checkoutBusy=true;const b=$('#checkout');b.disabled=true;b.textContent='Оформляем…';try{await saveUser();const total=cart.reduce((s,x)=>s+Number(x.price||0),0);const sellers=[...new Set(cart.map(x=>x.seller_id).filter(Boolean).map(String))];const r=await db.from('orders').insert({telegram_id:String(u.id),telegram_username:u.username||null,total,status:'pending',seller_id:sellers.length===1?sellers[0]:null,seller_status:'pending',buyer_received:false}).select().single();if(r.error)throw r.error;const items=cart.map(x=>({order_id:r.data.id,product_id:x.id,product_name:x.name,price:Number(x.price),quantity:Number(x.quantity),seller_id:x.seller_id?String(x.seller_id):null}));const ir=await db.from('order_items').insert(items);if(ir.error)throw ir.error;try{await db.functions.invoke('notify-order',{body:{record:{...r.data,items},items,status_text:'В ожидании'}})}catch(e){console.warn(e)};cart=[];saveCart();renderCart();close('cartOverlay');toast('Заказ №'+r.data.id+' создан ✅');if(tg?.showAlert)tg.showAlert('Заказ №'+r.data.id+' оформлен! Ожидайте продавца.');}catch(e){console.error(e);toast('Ошибка оформления: '+(e.message||e))}finally{checkoutBusy=false;b.disabled=!cart.length;b.textContent='⚡ Оформить заказ'}}
async function loadOrders(){const box=$('#ordersList');box.innerHTML='<div class="loading">Загрузка…</div>';const id=uid();if(!id){box.innerHTML='<div class="empty">Откройте магазин через Telegram.</div>';return}const r=await db.from('orders').select('*').eq('telegram_id',id).order('id',{ascending:false});if(r.error){box.innerHTML='<div class="empty">'+esc(r.error.message)+'</div>';return}const list=(r.data||[]).filter(o=>orderFilter==='done'?Boolean(o.buyer_received):!Boolean(o.buyer_received));if(!list.length){box.innerHTML='<div class="empty">Заказов нет.</div>';return}const ids=list.map(o=>o.id),ir=await db.from('order_items').select('order_id,product_name,quantity').in('order_id',ids);const by={};(ir.data||[]).forEach(x=>(by[x.order_id]??=[]).push(x));box.innerHTML=list.map(o=>`<div class="admin-row"><div><b>Заказ #${o.id}</b><div class="admin-meta">${(by[o.id]||[]).map(x=>esc(x.product_name)+' × '+x.quantity).join('<br>')}<br>${Number(o.total||0)} ₽</div></div><span>${o.buyer_received?'✅ Получен':o.seller_status==='completed'?'📥 Готов':'⏳ В работе'}</span></div>`).join('')}
async function sellerPanel(){const m=await loadMe();if(!m?.is_seller)return toast('Нет прав продавца');open('sellerOverlay');await loadSellerProducts();await loadSellerOrders()}
async function loadSellerProducts(){const box=$('#sellerProducts');const r=await db.from('products').select('*').eq('seller_id',Number(uid())).order('id',{ascending:false});const list=r.data||[];box.innerHTML=list.length?list.map(p=>`<div class="admin-row"><div><b>${esc(p.name)}</b><div class="admin-meta">${Number(p.price||0)} ₽ · ${Number(p.stock??0)} шт. · ${esc(p.approval_status||'approved')}</div></div><button class="danger" data-sdel="${p.id}" type="button">🗑</button></div>`).join(''):'<div class="empty">Товаров нет.</div>'}
async function loadSellerOrders(){const box=$('#sellerOrders');const r=await db.from('order_items').select('order_id,product_name,quantity').eq('seller_id',uid());const ids=[...new Set((r.data||[]).map(x=>x.order_id))];if(!ids.length){box.innerHTML='<div class="empty">Заказов нет.</div>';return}const or=await db.from('orders').select('*').in('id',ids).order('id',{ascending:false});box.innerHTML=(or.data||[]).slice(0,30).map(o=>`<div class="admin-row"><div><b>Заказ #${o.id}</b><div class="admin-meta">${(r.data||[]).filter(x=>x.order_id===o.id).map(x=>esc(x.product_name)+' × '+x.quantity).join('<br>')}</div></div>${o.seller_status==='completed'?'✅':'<button class="primary" data-complete="'+o.id+'" type="button">Выполнен</button>'}</div>`).join('')}
function variantRow(q='',p='',s='1'){const d=document.createElement('div');d.className='variant';d.innerHTML=`<input class="vq" type="number" min="1" placeholder="Количество" value="${q}"><input class="vp" type="number" min="0" placeholder="Цена ₽" value="${p}"><input class="vs" type="number" min="0" placeholder="Остаток" value="${s}"><button class="del" type="button">×</button>`;d.querySelector('.del').onclick=()=>{if($$('.variant').length>1)d.remove();validatePublish()};d.querySelectorAll('input').forEach(x=>x.oninput=validatePublish);$('#variants').appendChild(d);validatePublish()}
function validatePublish(){const rows=$$('.variant');const ok=$('#sName').value.trim()&&$('#sImage').files[0]&&rows.length&&rows.every(r=>Number(r.querySelector('.vq').value)>0&&Number(r.querySelector('.vp').value)>=0&&Number(r.querySelector('.vs').value)>=0);$('#publish').disabled=!ok}
async function compress(file){const b=await createImageBitmap(file),scale=Math.min(1,900/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(b.width*scale));c.height=Math.max(1,Math.round(b.height*scale));c.getContext('2d').drawImage(b,0,0,c.width,c.height);b.close?.();let q=.72,d=c.toDataURL('image/jpeg',q);for(let i=0;i<5&&d.length*.75>550000;i++){q=Math.max(.4,q-.07);d=c.toDataURL('image/jpeg',q)}return d}
async function publish(){const b=$('#publish');b.disabled=true;b.textContent='Публикуем…';try{const m=await loadMe();if(!m?.is_seller)throw Error('Нет прав продавца');const f=$('#sImage').files[0];if(!f)throw Error('Добавьте фото');const os=$$('.variant').map(r=>({qty:Number(r.querySelector('.vq').value),price:Number(r.querySelector('.vp').value),stock:Number(r.querySelector('.vs').value)}));const img=await compress(f),first=os[0];const p={name:$('#sName').value.trim(),description:$('#sDesc').value.trim(),details:$('#sDetails').value.trim(),price:first.price,stock:first.stock,price_options:os,image_url:img,icon:'📦',category:$('#sCat').value,seller_id:Number(uid()),seller_username:m.username?String(m.username).replace(/^@/,''):null,approval_status:'pending'};const r=await db.from('products').insert(p).select().single();if(r.error)throw r.error;try{await db.functions.invoke('notify-order',{body:{event_type:'product_moderation',notification_type:'product_moderation',telegram_id:uid(),recipient_telegram_id:uid(),seller_id:uid(),product_id:r.data.id,product_name:p.name,moderation_status:'pending',message:'Товар отправлен на проверку.'}})}catch(e){console.warn(e)}$('#sName').value='';$('#sDesc').value='';$('#sDetails').value='';$('#sImage').value='';$('#sPreview').innerHTML='';$('#variants').innerHTML='';variantRow(1,'','1');$('#sellerForm').style.display='none';toast('Товар отправлен на проверку 🕐');await loadSellerProducts();await loadProducts()}catch(e){toast('Ошибка: '+(e.message||e))}finally{b.textContent='Опубликовать товар';validatePublish()}}
async function admin(){if(prompt('Пароль администратора:')!=='admin123')return toast('Неверный пароль');open('adminOverlay');const box=$('#adminContent');box.innerHTML='<div class="loading">Загрузка…</div>';const r=await db.from('products').select('*').order('id',{ascending:false});const list=r.data||[];box.innerHTML=`<div class="admin-list">${list.map(p=>`<div class="admin-row"><div><b>${esc(p.name)}</b><div class="admin-meta">#${p.id} · ${Number(p.price||0)} ₽ · ${esc(p.approval_status||'approved')}</div></div><div class="buttons">${p.seller_id&&p.approval_status==='pending'?`<button class="primary" data-approve="${p.id}" type="button">✅</button>`:''}<button class="danger" data-adelete="${p.id}" type="button">🗑</button></div></div>`).join('')}</div>`}
async function approve(id){const r=await db.from('products').update({approval_status:'approved',rejection_reason:null}).eq('id',id).select().single();if(r.error)return toast(r.error.message);try{await db.functions.invoke('notify-order',{body:{event_type:'product_moderation',notification_type:'product_moderation',telegram_id:String(r.data.seller_id),recipient_telegram_id:String(r.data.seller_id),seller_id:String(r.data.seller_id),product_id:r.data.id,product_name:r.data.name,moderation_status:'approved',message:'Ваш товар одобрен и опубликован.'}})}catch(e){}toast('Товар одобрен ✅');await admin();await loadProducts()}
async function init(){loadCart();await saveUser();await loadMe();await loadProducts();renderCart();if(localStorage.getItem('em_theme')==='light')document.documentElement.style.setProperty('--bg','#eef5ff')}
$('#search').oninput=render;$('#cats').onclick=e=>{const b=e.target.closest('[data-cat]');if(!b)return;cat=b.dataset.cat;$$('.cat').forEach(x=>x.classList.toggle('active',x===b));render()};$('#products').onclick=e=>{const buy=e.target.closest('[data-buy]');if(buy){e.stopPropagation();add(Number(buy.dataset.buy),1);return}const c=e.target.closest('[data-product]');if(c)showProduct(Number(c.dataset.product))};$('#productOverlay').onclick=e=>{if(e.target.id==='productOverlay')close('productOverlay');const o=e.target.closest('[data-option]');if(o&&selectedProduct){selectedQty=Number(o.dataset.option);showProduct(selectedProduct.id,selectedQty)}const mb=e.target.closest('[data-modal-buy]');if(mb){if(add(selectedProduct.id,selectedQty))close('productOverlay')}};$('#cartBtn').onclick=()=>{renderCart();open('cartOverlay')};$('#cartOverlay').onclick=e=>{const r=e.target.closest('[data-remove]');if(r){cart.splice(Number(r.dataset.remove),1);saveCart();renderCart()}const mi=e.target.closest('[data-minus]');if(mi)changeQty(Number(mi.dataset.minus),-1);const pl=e.target.closest('[data-plus]');if(pl)changeQty(Number(pl.dataset.plus),1)};$('#checkout').onclick=checkout;$('#profileBtn').onclick=async()=>{const u=user();$('#profile').innerHTML=u?`<div class="admin-row"><div><b>${esc([u.first_name,u.last_name].filter(Boolean).join(' ')||'Пользователь')}</b><div class="admin-meta">@${esc(u.username||'—')}<br>Telegram ID: ${esc(u.id)}</div></div></div>`:'<div class="empty">Откройте через Telegram.</div>';open('profileOverlay')};$$('[data-close]').forEach(b=>b.onclick=()=>close(b.dataset.close));$$('.nav [data-nav]').forEach(b=>b.onclick=async()=>{setNav(b);const n=b.dataset.nav;if(n==='orders'){open('ordersOverlay');loadOrders()}else if(n==='seller')sellerPanel();else if(n==='settings')open('settingsOverlay');else if(n==='chats'){open('ordersOverlay');loadOrders()}});function setNav(b){$$('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active')};$('#sellerEntry').onclick=sellerPanel;$('#becomeSeller').onclick=()=>tg?.openTelegramLink?tg.openTelegramLink('https://t.me/sopplain'):window.open('https://t.me/sopplain','_blank');$('#adminEntry').onclick=admin;$('#toggleAdd').onclick=()=>{$('#sellerForm').style.display=$('#sellerForm').style.display==='none'?'grid':'none';if($$('.variant').length===0)variantRow(1,'','1')};$('#addVariant').onclick=()=>variantRow();$('#sName').oninput=validatePublish;$('#sImage').onchange=()=>{const f=$('#sImage').files[0];$('#sPreview').innerHTML=f?'<div class="hint">Фото выбрано: '+esc(f.name)+'</div>':'';validatePublish()};$('#publish').onclick=publish;$('#sellerOverlay').onclick=async e=>{const d=e.target.closest('[data-sdel]');if(d&&confirm('Удалить товар?')){const r=await db.from('products').delete().eq('id',Number(d.dataset.sdel)).eq('seller_id',Number(uid()));if(r.error)toast(r.error.message);else{toast('Удалено');loadSellerProducts();loadProducts()}}const c=e.target.closest('[data-complete]');if(c){const r=await db.from('orders').update({seller_status:'completed',seller_completed_at:new Date().toISOString()}).eq('id',Number(c.dataset.complete));if(r.error)toast(r.error.message);else{toast('Заказ выполнен ✅');loadSellerOrders()}}};$('#ordersOverlay').onclick=e=>{const b=e.target.closest('[data-order-filter]');if(b){orderFilter=b.dataset.orderFilter;loadOrders()}};$$('[data-close]').forEach(b=>b.onclick=()=>close(b.dataset.close));$('#themeBtn').onclick=()=>{const l=localStorage.getItem('em_theme')!=='light';localStorage.setItem('em_theme',l?'light':'dark');document.body.style.filter=l?'brightness(1.08)':'none';toast(l?'Светлая тема':'Тёмная тема')};document.addEventListener('keydown',e=>{if(e.key==='Escape')$$('.overlay.open').forEach(x=>x.classList.remove('open'))});init();
</script>
