<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>EasyMarket</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#0b0d12;color:#fff;font-family:Arial,sans-serif}button{font:inherit;cursor:pointer}.wrap{max-width:760px;margin:auto;padding:14px}.top{display:flex;gap:10px;align-items:center;margin-bottom:12px}.top h1{font-size:22px;margin:0;flex:1}.search{width:100%;padding:13px;border:1px solid #292d38;border-radius:13px;background:#141720;color:#fff;margin-bottom:12px}.cats{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.cat{border:1px solid #292d38;background:#141720;color:#ddd;border-radius:20px;padding:9px 13px;white-space:nowrap}.cat.active{background:#fff;color:#111}.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.product{background:#141720;border:1px solid #252a35;border-radius:16px;overflow:hidden;cursor:pointer}.pic{height:150px;background:#1a1e28;display:flex;align-items:center;justify-content:center;font-size:48px}.pic img{width:100%;height:100%;object-fit:cover}.pbody{padding:11px}.pname{font-weight:800;line-height:1.25;min-height:38px}.price{margin-top:8px;font-weight:900}.buy{width:100%;margin-top:10px;border:0;border-radius:11px;padding:11px;background:#fff;color:#111;font-weight:800}.empty{text-align:center;padding:40px 15px;color:#9aa0ae}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;z-index:50}.overlay.open{display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(760px,100%);max-height:90vh;overflow:auto;background:#10131a;border-radius:22px 22px 0 0;padding:16px}.close{float:right;border:0;background:#252a34;color:#fff;border-radius:10px;padding:8px 12px}.modal-img{width:100%;height:240px;object-fit:cover;border-radius:16px;background:#191d26}.qtys{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.qty{border:1px solid #343947;background:#191d26;color:#fff;border-radius:10px;padding:10px}.qty.sel{background:#fff;color:#111}.big{width:100%;border:0;border-radius:13px;padding:14px;background:#fff;color:#111;font-weight:900}.cartpanel{position:fixed;right:0;top:0;bottom:0;width:min(430px,100%);background:#10131a;z-index:60;transform:translateX(100%);transition:.2s;padding:16px;overflow:auto}.cartpanel.open{transform:none}.cartrow{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #292d38}.cartrow .x{margin-left:auto}.checkout{width:100%;padding:14px;border:0;border-radius:13px;background:#fff;color:#111;font-weight:900;margin-top:15px}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#fff;color:#111;padding:12px 16px;border-radius:12px;z-index:100;display:none}.toast.show{display:block}.seller{margin-top:25px;padding:15px;background:#141720;border:1px solid #292d38;border-radius:16px}.seller input,.seller textarea{width:100%;margin:6px 0;padding:12px;border-radius:10px;border:1px solid #303542;background:#191d26;color:#fff}.variants{margin-top:10px}.vrow{display:grid;grid-template-columns:1fr 1fr 1fr 40px;gap:6px;margin-bottom:7px}.vrow input{min-width:0;padding:10px;border-radius:9px;border:1px solid #303542;background:#191d26;color:#fff}.addv{width:100%;padding:11px;border:0;border-radius:10px;background:#252a34;color:#fff}.publish{width:100%;height:54px;margin-top:10px;border:0;border-radius:13px;font-weight:900;background:#666b75;color:#fff}.publish:disabled{background:#666b75;color:#fff;opacity:1}
</style>
</head>
<body>
<div class="wrap"><div class="top"><h1>EasyMarket</h1><button class="cat" id="cartOpen">🛒 <span id="cartCount">0</span></button></div><input class="search" id="search" placeholder="Поиск товаров…"><div class="cats" id="cats"></div><div id="products" class="products"><div class="empty">Загрузка товаров…</div></div><div id="sellerArea"></div></div>
<div id="modal" class="overlay"><div class="sheet" id="modalSheet"></div></div><div id="cartPanel" class="cartpanel"><button class="close" id="cartClose">Закрыть</button><h2>Корзина</h2><div id="cartItems"></div><div id="cartTotal"></div><button class="checkout" id="checkoutButton">⚡ Оформить заказ</button></div><div id="toast" class="toast"></div>
<script>
const SUPABASE_URL='https://uhmgjcoyxehknkehfbbj.supabase.co';const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVobWdqY295eGVoa25rZWhmYmJqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMzE4OTYsImV4cCI6MjEwNDkwNzg5Nn0.JRP4sjhcPIjlrxqaHfi3t4cU0xGNx0dEQcg-HI6FGcc';const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();let products=[],cart=JSON.parse(localStorage.getItem('easymarket_cart')||'[]'),activeCat='all',selected=null;
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toast(s){const x=document.getElementById('toast');x.textContent=s;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}function saveCart(){localStorage.setItem('easymarket_cart',JSON.stringify(cart));document.getElementById('cartCount').textContent=cart.reduce((a,x)=>a+x.count,0);renderCart()}
function renderProducts(){const q=document.getElementById('search').value.trim().toLowerCase();const a=products.filter(p=>!p.seller_id||String(p.approval_status||'approved')==='approved').filter(p=>activeCat==='all'||p.category===activeCat).filter(p=>(p.name+' '+(p.description||'')).toLowerCase().includes(q));const el=document.getElementById('products');if(!a.length){el.innerHTML='<div class="empty" style="grid-column:1/-1">Товаров не найдено</div>';return}el.innerHTML=a.map(p=>{const o=(Array.isArray(p.price_options)&&p.price_options.length?p.price_options:[{qty:1,price:Number(p.price)||0,stock:Number(p.stock??0)}]).find(x=>Number(x.stock)>0)||{qty:1,price:Number(p.price)||0,stock:Number(p.stock??0)};return `<div class="product" data-id="${Number(p.id)}"><div class="pic">${p.image_url?`<img src="${esc(p.image_url)}" alt="">`:esc(p.icon||'📦')}</div><div class="pbody"><div class="pname">${esc(p.name)}</div><div class="price">${Number(o.price)} ₽</div><button class="buy" data-buy="${Number(p.id)}">⚡ Оформить</button></div></div>`}).join('');el.querySelectorAll('.product').forEach(x=>x.onclick=e=>{if(!e.target.closest('.buy'))openProductModal(Number(x.dataset.id))});el.querySelectorAll('.buy').forEach(b=>b.onclick=e=>{e.stopPropagation();openProductModal(Number(b.dataset.buy))})}
function renderModal(i=0){const p=selected;const opts=Array.isArray(p.price_options)&&p.price_options.length?p.price_options:[{qty:1,price:Number(p.price)||0,stock:Number(p.stock??0)}];const o=opts[i]||opts[0];document.getElementById('modalSheet').innerHTML=`<button class="close" id="modalClose">✕</button>${p.image_url?`<img class="modal-img" src="${esc(p.image_url)}">`:''}<h2>${esc(p.name)}</h2><div style="color:#a5aab7">${esc(p.description||'')}</div><div class="qtys">${opts.map((x,n)=>`<button class="qty ${n===i?'sel':''}" data-opt="${n}" ${Number(x.stock)<=0?'disabled':''}>${Number(x.qty)} шт — ${Number(x.price)} ₽</button>`).join('')}</div><div style="margin:10px 0;color:#a5aab7">Остаток: ${Number(o.stock||0)}</div><button class="big" id="modalAdd" ${Number(o.stock)<=0?'disabled':''}>🛒 Добавить в корзину</button>`;document.getElementById('modalClose').onclick=closeModal;document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>renderModal(Number(b.dataset.opt)));document.getElementById('modalAdd').onclick=()=>{addToCart(p,Number(o.qty)||1,Number(o.price)||0);closeModal()}}
function openProductModal(id){selected=products.find(p=>Number(p.id)===Number(id));if(!selected)return toast('Товар не найден');renderModal();document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open');selected=null}function addToCart(p,qty,price){const k=String(p.id)+'_'+qty;const x=cart.find(a=>a.key===k);if(x)x.count++;else cart.push({key:k,id:Number(p.id),name:p.name,qty,price,count:1});saveCart();toast('Добавлено в корзину')}
function renderCart(){const el=document.getElementById('cartItems');if(!cart.length){el.innerHTML='<div class="empty">Корзина пуста</div>';document.getElementById('cartTotal').textContent='';return}el.innerHTML=cart.map((x,i)=>`<div class="cartrow"><div><b>${esc(x.name)}</b><div>${x.qty} шт × ${x.price} ₽</div><div>Количество: ${x.count}</div></div><button class="close x" data-remove="${i}">×</button></div>`).join('');el.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{cart.splice(Number(b.dataset.remove),1);saveCart()});document.getElementById('cartTotal').textContent='Итого: '+cart.reduce((a,x)=>a+x.price*x.count,0)+' ₽'}
async function checkout(){if(!cart.length)return toast('Корзина пуста');const u=tg?.initDataUnsafe?.user;if(!u)return toast('Откройте магазин через Telegram');const total=cart.reduce((a,x)=>a+x.price*x.count,0);const r=await sb.from('orders').insert({telegram_id:u.id,username:u.username||null,total_amount:total,status:'pending'}).select('*').single();if(r.error)return toast('Ошибка заказа: '+r.error.message);for(const x of cart){const z=await sb.from('order_items').insert({order_id:r.data.id,product_id:x.id,quantity:x.count,price:x.price});if(z.error)return toast('Ошибка позиции: '+z.error.message)}cart=[];saveCart();document.getElementById('cartPanel').classList.remove('open');toast('Заказ оформлен')}
async function loadProducts(){const r=await sb.from('products').select('*').order('id',{ascending:false});if(r.error){console.error(r.error);document.getElementById('products').innerHTML='<div class="empty">Ошибка загрузки товаров</div>';return}products=r.data||[];const cs=[...new Set(products.map(p=>p.category).filter(Boolean))];document.getElementById('cats').innerHTML='<button class="cat active" data-cat="all">Все</button>'+cs.map(c=>`<button class="cat" data-cat="${esc(c)}">${esc(c)}</button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{activeCat=b.dataset.cat;document.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('active',x===b));renderProducts()});renderProducts()}
function addVariant(){const d=document.createElement('div');d.className='vrow';d.innerHTML='<input class="vq" type="number" min="1" placeholder="Количество"><input class="vp" type="number" min="0" placeholder="Цена ₽"><input class="vs" type="number" min="0" placeholder="Остаток"><button class="close" type="button">×</button>';d.querySelector('button').onclick=()=>{if(document.querySelectorAll('.vrow').length>1)d.remove();validate()};d.querySelectorAll('input').forEach(x=>x.oninput=validate);document.getElementById('variants').appendChild(d);validate()}
function validate(){const b=document.getElementById('publish');if(!b)return;const rows=[...document.querySelectorAll('.vrow')];b.disabled=!document.getElementById('sellerName').value.trim()||!document.getElementById('sellerImage').files[0]||!rows.length||!rows.every(r=>Number(r.querySelector('.vq').value)>0&&Number(r.querySelector('.vp').value)>=0&&Number(r.querySelector('.vs').value)>=0)}
async function publish(){const b=document.getElementById('publish');b.disabled=true;b.textContent='Публикуем…';try{const u=tg?.initDataUnsafe?.user;if(!u)throw Error('Откройте через Telegram');const rows=[...document.querySelectorAll('.vrow')];const opts=rows.map(r=>({qty:Number(r.querySelector('.vq').value),price:Number(r.querySelector('.vp').value),stock:Number(r.querySelector('.vs').value)}));const f=document.getElementById('sellerImage').files[0];const data=await new Promise((res,rej)=>{const rd=new FileReader();rd.onload=()=>res(rd.result);rd.onerror=rej;rd.readAsDataURL(f)});const r=await sb.from('products').insert({name:document.getElementById('sellerName').value.trim(),description:document.getElementById('sellerDesc').value.trim(),price:opts[0].price,stock:opts[0].stock,price_options:opts,approval_status:'pending',seller_id:u.id,seller_username:u.username||null,image_url:data,icon:'📦',category:'other'});if(r.error)throw r.error;toast('Товар отправлен на проверку 🕐');document.getElementById('sellerArea').innerHTML='';await loadProducts()}catch(e){toast('Ошибка: '+e.message)}finally{b.disabled=false;b.textContent='Опубликовать товар';validate()}}
function sellerUI(){document.getElementById('sellerArea').innerHTML='<div class="seller"><h3>🏪 Добавить товар</h3><input id="sellerName" placeholder="Название"><textarea id="sellerDesc" placeholder="Описание"></textarea><input id="sellerImage" type="file" accept="image/*"><div class="variants" id="variants"></div><button class="addv" id="addVariant">＋ Добавить вариант</button><button class="publish" id="publish" disabled>Опубликовать товар</button></div>';addVariant();document.getElementById('sellerName').oninput=validate;document.getElementById('sellerImage').onchange=validate;document.getElementById('addVariant').onclick=addVariant;document.getElementById('publish').onclick=publish}
document.getElementById('search').oninput=renderProducts;document.getElementById('cartOpen').onclick=()=>{renderCart();document.getElementById('cartPanel').classList.add('open')};document.getElementById('cartClose').onclick=()=>document.getElementById('cartPanel').classList.remove('open');document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};document.getElementById('checkoutButton').onclick=checkout;sellerUI();saveCart();loadProducts();
</script></body></html>
