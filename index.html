<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>EasyMarket</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b0b0f;
      color: #fff;
    }

    button,
    input {
      font: inherit;
    }

    .app {
      max-width: 700px;
      margin: 0 auto;
      padding: 16px 14px 90px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .logo {
      font-size: 23px;
      font-weight: 800;
    }

    .logo span {
      color: #8b5cf6;
    }

    .profile {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #191923;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
    }

    .welcome {
      margin-bottom: 18px;
    }

    .welcome h1 {
      margin: 0 0 6px;
      font-size: 27px;
    }

    .welcome p {
      margin: 0;
      color: #8f8f9d;
      font-size: 14px;
    }

    .search {
      position: relative;
      margin-bottom: 18px;
    }

    .search input {
      width: 100%;
      border: 1px solid #22222d;
      background: #15151d;
      color: white;
      outline: none;
      border-radius: 14px;
      padding: 14px 16px 14px 43px;
    }

    .search span {
      position: absolute;
      left: 15px;
      top: 12px;
      font-size: 19px;
    }

    .categories {
      display: flex;
      gap: 9px;
      overflow-x: auto;
      padding-bottom: 5px;
      margin-bottom: 22px;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .category {
      flex: 0 0 auto;
      border: 1px solid #292936;
      background: #15151d;
      color: #aaaab7;
      border-radius: 12px;
      padding: 10px 14px;
      cursor: pointer;
    }

    .category.active {
      background: #8b5cf6;
      border-color: #8b5cf6;
      color: white;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 13px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 19px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .product {
      background: #15151d;
      border: 1px solid #23232e;
      border-radius: 17px;
      overflow: hidden;
    }

    .product-image {
      height: 125px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 45px;
      background: linear-gradient(135deg, #1d1930, #17171f);
    }

    .product-info {
      padding: 12px;
    }

    .product-name {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .product-description {
      color: #898996;
      font-size: 12px;
      min-height: 32px;
      margin-bottom: 11px;
    }

    .product-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 7px;
    }

    .price {
      font-weight: 800;
      font-size: 15px;
    }

    .buy {
      border: 0;
      background: #8b5cf6;
      color: white;
      border-radius: 10px;
      padding: 9px 11px;
      cursor: pointer;
    }

    .buy:active {
      transform: scale(.96);
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 45px 10px;
      color: #888895;
    }

    .cart-panel {
      display: none;
      position: fixed;
      z-index: 20;
      left: 0;
      right: 0;
      bottom: 0;
      max-width: 700px;
      margin: auto;
      background: #15151d;
      border-top: 1px solid #292936;
      border-radius: 22px 22px 0 0;
      padding: 18px;
      box-shadow: 0 -10px 35px rgba(0,0,0,.4);
    }

    .cart-panel.open {
      display: block;
    }

    .cart-title {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      font-weight: 800;
    }

    .cart-items {
      max-height: 220px;
      overflow-y: auto;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #262631;
    }

    .remove {
      border: 0;
      background: transparent;
      color: #ff6b6b;
      cursor: pointer;
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      margin: 15px 0;
      font-size: 18px;
      font-weight: 800;
    }

    .checkout {
      width: 100%;
      border: 0;
      border-radius: 13px;
      padding: 14px;
      background: #8b5cf6;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    .close-cart {
      border: 0;
      background: #252530;
      color: white;
      border-radius: 9px;
      padding: 5px 9px;
    }

    .bottom-nav {
      position: fixed;
      z-index: 10;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(700px, 100%);
      height: 66px;
      background: rgba(15,15,21,.96);
      border-top: 1px solid #24242e;
      display: flex;
      justify-content: space-around;
      align-items: center;
      backdrop-filter: blur(10px);
    }

    .nav-button {
      border: 0;
      background: transparent;
      color: #777783;
      font-size: 12px;
      cursor: pointer;
    }

    .nav-button div {
      font-size: 21px;
      margin-bottom: 2px;
    }

    .nav-button.active {
      color: #8b5cf6;
    }

    .cart-count {
      display: inline-flex;
      min-width: 18px;
      height: 18px;
      justify-content: center;
      align-items: center;
      border-radius: 50%;
      background: #8b5cf6;
      color: white;
      font-size: 10px;
      margin-left: 3px;
    }

    @media (min-width: 600px) {
      .products {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header class="header">
    <div class="logo">Easy<span>Market</span></div>
    <div class="profile">👤</div>
  </header>

  <section class="welcome">
    <h1>Добро пожаловать 👋</h1>
    <p>Цифровые товары в одном месте</p>
  </section>

  <div class="search">
    <span>🔎</span>
    <input
      id="searchInput"
      type="text"
      placeholder="Поиск товаров..."
      autocomplete="off"
    >
  </div>

  <div class="categories">
    <button class="category active" data-category="all">
      Все
    </button>

    <button class="category" data-category="games">
      🎮 Игры
    </button>

    <button class="category" data-category="digital">
      💻 Цифровые
    </button>

    <button class="category" data-category="mail">
      📧 Почта
    </button>

    <button class="category" data-category="other">
      🎁 Другое
    </button>
  </div>

  <div class="section-title">
    <h2>🔥 Популярное</h2>
  </div>

  <div id="products" class="products"></div>

</div>

<div id="cartPanel" class="cart-panel">

  <div class="cart-title">
    <span>🛒 Корзина</span>
    <button class="close-cart" onclick="closeCart()">✕</button>
  </div>

  <div id="cartItems" class="cart-items"></div>

  <div class="cart-total">
    <span>Итого</span>
    <span id="cartTotal">0 ₽</span>
  </div>

  <button class="checkout" onclick="checkout()">
    Оформить заказ
  </button>

</div>

<nav class="bottom-nav">

  <button class="nav-button active" onclick="scrollTopPage()">
    <div>🏠</div>
    Главная
  </button>

  <button class="nav-button" onclick="focusSearch()">
    <div>🔎</div>
    Поиск
  </button>

  <button class="nav-button" onclick="openCart()">
    <div>🛒</div>
    Корзина
    <span id="cartCount" class="cart-count">0</span>
  </button>

  <button class="nav-button" onclick="showProfile()">
    <div>👤</div>
    Профиль
  </button>

</nav>

<script>

  // Telegram Mini App
  const tg = window.Telegram.WebApp;

  tg.ready();
  tg.expand();

  // =========================
  // ТОВАРЫ
  // =========================

  const products = [
    {
      id: 1,
      name: "Игровой набор",
      description: "Цифровой товар для игр",
      price: 499,
      category: "games",
      icon: "🎮"
    },
    {
      id: 2,
      name: "Премиум подписка",
      description: "Цифровая подписка",
      price: 799,
      category: "digital",
      icon: "⭐"
    },
    {
      id: 3,
      name: "Почтовый аккаунт",
      description: "Новый легальный аккаунт",
      price: 199,
      category: "mail",
      icon: "📧"
    },
    {
      id: 4,
      name: "Цифровой ключ",
      description: "Ключ для активации",
      price: 349,
      category: "digital",
      icon: "🔑"
    },
    {
      id: 5,
      name: "Подарочный код",
      description: "Электронный подарочный код",
      price: 999,
      category: "other",
      icon: "🎁"
    },
    {
      id: 6,
      name: "Игровой предмет",
      description: "Цифровой игровой предмет",
      price: 599,
      category: "games",
      icon: "💎"
    }
  ];

  let cart = [];
  let currentCategory = "all";

  // =========================
  // ПОКАЗ ТОВАРОВ
  // =========================

  function renderProducts() {

    const container = document.getElementById("products");
    const search = document
      .getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();

    const filtered = products.filter(product => {

      const categoryMatch =
        currentCategory === "all" ||
        product.category === currentCategory;

      const searchMatch =
        product.name.toLowerCase().includes(search) ||
        product.description.toLowerCase().includes(search);

      return categoryMatch && searchMatch;

    });

    if (!filtered.length) {
      container.innerHTML = `
        <div class="empty">
          😔<br><br>
          Ничего не найдено
        </div>
      `;
      return;
    }

    container.innerHTML = filtered.map(product => `

      <article class="product">

        <div class="product-image">
          ${product.icon}
        </div>

        <div class="product-info">

          <div class="product-name">
            ${product.name}
          </div>

          <div class="product-description">
            ${product.description}
          </div>

          <div class="product-bottom">

            <div class="price">
              ${product.price} ₽
            </div>

            <button
              class="buy"
              onclick="addToCart(${product.id})"
            >
              В корзину
            </button>

          </div>

        </div>

      </article>

    `).join("");
  }

  // =========================
  // КАТЕГОРИИ
  // =========================

  document.querySelectorAll(".category").forEach(button => {

    button.addEventListener("click", () => {

      document
        .querySelectorAll(".category")
        .forEach(btn => btn.classList.remove("active"));

      button.classList.add("active");

      currentCategory =
        button.dataset.category;

      renderProducts();

    });

  });

  // =========================
  // ПОИСК
  // =========================

  document
    .getElementById("searchInput")
    .addEventListener("input", renderProducts);

  // =========================
  // КОРЗИНА
  // =========================

  function addToCart(id) {

    const product =
      products.find(item => item.id === id);

    if (!product) return;

    cart.push(product);

    updateCart();

    tg.HapticFeedback.impactOccurred("light");

  }

  function removeFromCart(index) {

    cart.splice(index, 1);

    updateCart();

  }

  function updateCart() {

    const count =
      document.getElementById("cartCount");

    count.textContent = cart.length;

    const items =
      document.getElementById("cartItems");

    if (!cart.length) {

      items.innerHTML = `
        <div class="empty">
          Корзина пуста 🛒
        </div>
      `;

    } else {

      items.innerHTML = cart.map((item, index) => `

        <div class="cart-item">

          <div>
            ${item.icon} ${item.name}
          </div>

          <div>
            ${item.price} ₽

            <button
              class="remove"
              onclick="removeFromCart(${index})"
            >
              ✕
            </button>
          </div>

        </div>

      `).join("");

    }

    const total =
      cart.reduce((sum, item) => sum + item.price, 0);

    document.getElementById("cartTotal").textContent =
      total + " ₽";

  }

  function openCart() {

    document
      .getElementById("cartPanel")
      .classList.add("open");

    updateCart();

  }

  function closeCart() {

    document
      .getElementById("cartPanel")
      .classList.remove("open");

  }

  // =========================
  // ОФОРМЛЕНИЕ
  // =========================

  function checkout() {

    if (!cart.length) {

      tg.showAlert("Корзина пуста");

      return;

    }

    const total =
      cart.reduce((sum, item) => sum + item.price, 0);

    tg.showConfirm(
      `Оформить заказ на ${total} ₽?`,
      confirmed => {

        if (!confirmed) return;

        /*
          Позже здесь подключим отправку
          заказа на твой backend / бота.
        */

        const order = {
          items: cart,
          total: total,
          telegram_user:
            tg.initDataUnsafe?.user || null
        };

        console.log("ORDER:", order);

        tg.showAlert(
          "Заказ создан! Следующим шагом подключим оплату."
        );

        cart = [];

        updateCart();

        closeCart();

      }
    );

  }

  // =========================
  // НАВИГАЦИЯ
  // =========================

  function scrollTopPage() {

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }

  function focusSearch() {

    document
      .getElementById("searchInput")
      .focus();

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }

  function showProfile() {

    const user =
      tg.initDataUnsafe?.user;

    if (!user) {

      tg.showAlert("Профиль будет доступен после запуска в Telegram.");

      return;

    }

    const name =
      user.first_name || "Пользователь";

    tg.showAlert(
      `Привет, ${name}! 👋`
    );

  }

  // =========================
  // СТАРТ
  // =========================

  renderProducts();
  updateCart();

</script>

</body>
</html>
