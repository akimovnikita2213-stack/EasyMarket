<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>EasyMarket</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#0b0d12;color:#fff;font-family:Arial,sans-serif}body{overflow-x:hidden}button,input,textarea{font:inherit}button{cursor:pointer}.container{width:100%;max-width:1100px;margin:auto;padding:15px}.header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.logo{font-size:24px;font-weight:900}.logo span{color:#6c63ff}.header-buttons{display:flex;gap:8px}.icon-btn{width:42px;height:42px;border:0;border-radius:12px;background:#171a23;color:#fff;font-size:18px}.search{margin-bottom:14px}.search input{width:100%;padding:14px 16px;border:1px solid #252936;border-radius:14px;outline:none;background:#141720;color:#fff;font-size:15px}.categories{display:flex;gap:8px;overflow-x:auto;padding-bottom:5px;margin-bottom:18px}.categories::-webkit-scrollbar{display:none}.category{flex-shrink:0;border:1px solid #282c38;background:#151821;color:#bbb;padding:10px 14px;border-radius:12px;font-size:14px}.category.active{background:#6c63ff;border-color:#6c63ff;color:#fff}.section-title{font-size:21px;font-weight:900;margin:0 0 14px}.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.product{background:#141720;border:1px solid #252936;border-radius:16px;padding:10px;cursor:pointer;transition:transform .15s,border-color .15s,background .15s}.product:active{transform:scale(.985)}.product:hover{border-color:#3a3f50}.product-image,.product-icon{width:100%;aspect-ratio:16/10;border-radius:13px;background:#1b1e28;margin-bottom:11px;object-fit:cover}.product-icon{display:flex;align-items:center;justify-content:center;font-size:44px}.product-name{font-size:16px;font-weight:800;line-height:1.25;margin-bottom:6px}.product-description{color:#8e94a4;font-size:12px;line-height:1.35;min-height:33px;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.product-bottom{display:flex;justify-content:space-between;align-items:center;gap:8px}.price{font-weight:900;font-size:16px;white-space:nowrap}.buy-btn{border:0;background:#6c63ff;color:#fff;border-radius:10px;padding:9px 12px;font-weight:800;font-size:13px}.buy-btn:active,.primary:active{transform:scale(.98)}.empty,.loading{grid-column:1/-1;text-align:center;color:#777d8d;padding:50px 20px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;justify-content:center;z-index:9999;padding:12px}.modal.open{display:flex}.modal-card{width:100%;max-width:620px;max-height:90vh;overflow:auto;background:#141720;border:1px solid #292e3b;border-radius:22px;padding:16px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.45)}.modal-close{position:absolute;right:12px;top:12px;width:38px;height:38px;border:0;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:24px;z-index:2}.modal-image{width:100%;max-height:330px;object-fit:cover;border-radius:16px;margin-bottom:15px;background:#1b1e28}.modal-title{font-size:23px;font-weight:900;margin-bottom:8px;padding-right:45px}.modal-price{font-size:22px;font-weight:900;margin:12px 0}.modal-label{font-size:13px;color:#858b99;margin:14px 0 6px;font-weight:800}.modal-text{color:#d9dce3;line-height:1.5;white-space:pre-line}.options{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.option{border:1px solid #343947;background:#191d26;color:#fff;border-radius:11px;padding:10px 12px}.option.active{background:#fff;color:#111}.option:disabled{opacity:.4;cursor:not-allowed}.primary{width:100%;border:0;border-radius:13px;padding:14px;background:#6c63ff;color:#fff;font-weight:900;font-size:16px}.cart-panel{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:10000;align-items:flex-end}.cart-panel.open{display:flex}.cart-box{width:100%;max-height:85vh;overflow:auto;background:#11141b;border-radius:22px 22px 0 0;padding:20px 20px 105px;border-top:1px solid #292d38;position:relative}.cart-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.cart-title{font-size:22px;font-weight:900}.close-btn{border:0;background:#20232d;color:#fff;width:38px;height:38px;border-radius:10px;font-size:20px}.cart-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #242833}.cart-item-name{font-weight:800}.cart-item-price{color:#aaa;font-size:13px;margin-top:4px}.remove-btn{border:0;background:#272a34;color:#fff;border-radius:8px;padding:7px 10px}.cart-total{display:flex;justify-content:space-between;margin:20px 0;font-size:19px;font-weight:900}.checkout-wrap{position:absolute;left:0;right:0;bottom:0;padding:14px 20px 20px;background:#11141b;border-top:1px solid #292d38}.checkout-btn{display:block;width:100%;min-height:52px;border:0;border-radius:13px;padding:14px;background:#6c63ff;color:#fff;font-size:16px;font-weight:900}.checkout-btn:disabled{opacity:.55}.seller{margin-top:28px;background:#12151c;border:1px solid #242834;border-radius:17px;padding:16px}.seller h3{margin:0 0 12px;font-size:19px}.seller input,.seller textarea{width:100%;margin:6px 0;padding:12px;border-radius:10px;border:1px solid #303542;background:#191d26;color:#fff;outline:none}.seller textarea{min-height:90px;resize:vertical}.variants-title{font-size:13px;color:#858b99;font-weight:800;margin:12px 0 7px}.vrow{display:grid;grid-template-columns:1fr 1fr 1fr 40px;gap:6px;margin-bottom:7px}.vrow input{min-width:0;padding:10px;border-radius:9px;border:1px solid #303542;background:#191d26;color:#fff;outline:none}.vremove{border:0;background:#252a34;color:#fff;border-radius:9px}.addv{width:100%;padding:11px;border:0;border-radius:10px;background:#252a34;color:#fff;font-weight:800}.publish{width:100%;height:52px;margin-top:10px;border:0;border-radius:13px;font-weight:900;background:#666b75;color:#fff}.publish:disabled{background:#666b75;color:#fff;opacity:1}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#fff;color:#111;padding:12px 16px;border-radius:12px;z-index:11000;display:none;box-shadow:0 8px 30px rgba(0,0,0,.3)}.toast.show{display:block}@media(min-width:700px){.products{grid-template-columns:repeat(4,minmax(0,1fr))}.cart-box{max-width:620px;margin:auto}.modal{align-items:center}.cart-panel{align-items:center;justify-content:center}.cart-box{border-radius:22px}}
</style>
</head>
<body>
<div class="container">
<header class="header"><div class="logo">Easy<span>Market</span></div><div class="header-buttons"><button class="icon-btn" id="cartOpen" type="button">🛒 <span id="cartCount">0</span></button></div></header>
<div class="search"><input id="search" type="search" placeholder="Поиск товаров…" autocomplete="off"></div>
<div class="categories" id="cats"></div>
<div class="section-title">Товары</div>
<div id="products" class="products"><div class="loading">Загрузка товаров…</div></div>
<div id="sellerArea"></div>
</div>
<div id="modal" class="modal"><div class="modal-card" id="modalCard"></div></div>
<div id="cartPanel" class="cart-panel"><div class="cart-box"><div class="cart-header"><div class="cart-title">Корзина</div><button class="close-btn" id="cartClose" type="button">✕</button></div><div id="cartItems"></div><div class="cart-total"><span>Итого</span><span id="cartTotal">0 ₽</span></div><div class="checkout-wrap"><button class="checkout-btn" id="checkoutButton" type="button">⚡ Оформить заказ</button></div></div></div>
<div id="toast" class="toast"></div>
<script>
const SUPABASE_URL='https://uhmgjcoyxehknkehfbbj.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVobWdqY295eGVoa25rZWhmYmJqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMzE4OTYsImV4cCI6MjEwNDkwNzg5Nn0.JRP4sjhcPIjlrxqaHfi3t4cU0xGNx0dEQcg-HI6FGcc';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
let products=[];let cart=JSON.parse(localStorage.getItem('easymarket_cart')||'[]');let activeCat='all';let selected=null;let selectedOption=0;
const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toast(s){const x=$('toast');x.textContent=s;x.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>x.classList.remove('show'),2400)}function saveCart(){localStorage.setItem('easymarket_cart',JSON.stringify(cart));$('cartCount').textContent=cart.reduce((a,x)=>a+Number(x.count||0),0);renderCart()}
function optionsFor(p){const a=Array.isArray(p.price_options)?p.price_options:[];return a.length?a:[{qty:1,price:Number(p.price)||0,stock:Number(p.stock??0)}]}
function firstAvailable(p){const a=optionsFor(p);return a.find(x=>Number(x.stock)>0)||a[0]}
function renderProducts(){const q=$('search').value.trim().toLowerCase();const list=products.filter(p=>!p.seller_id||String(p.approval_status||'approved')==='approved').filter(p=>activeCat==='all'||String(p.category||'other')===activeCat).filter(p=>(String(p.name||'')+' '+String(p.description||'')).toLowerCase().includes(q));const el=$('products');if(!list.length){el.innerHTML='<div class="empty">Товаров не найдено</div>';return}el.innerHTML=list.map(p=>{const o=firstAvailable(p);return `<article class="product" data-id="${Number(p.id)}">${p.image_url?`<img class="product-image" src="${esc(p.image_url)}" alt="">`:`<div class="product-icon">${esc(p.icon||'📦')}</div>`}<div class="product-name">${esc(p.name)}</div><div class="product-description">${esc(p.description||'')}</div><div class="product-bottom"><div class="price">${Number(o.price)||0} ₽</div><button class="buy-btn" type="button" data-buy="${Number(p.id)}">⚡ Оформить</button></div></article>`}).join('');el.querySelectorAll('.product').forEach(card=>card.addEventListener('click',e=>{if(!e.target.closest('.buy-btn'))openProductModal(Number(card.dataset.id))}));el.querySelectorAll('.buy-btn').forEach(btn=>btn.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();openProductModal(Number(btn.dataset.buy))}))}
function renderModal(){if(!selected)return;const opts=optionsFor(selected);if(selectedOption>=opts.length)selectedOption=0;const o=opts[selectedOption];$('modalCard').innerHTML=`<button class="modal-close" id="modalClose" type="button">✕</button>${selected.image_url?`<img class="modal-image" src="${esc(selected.image_url)}" alt="">`:`<div class="product-icon">${esc(selected.icon||'📦')}</div>`}<div class="modal-title">${esc(selected.name)}</div><div class="modal-price">${Number(o.price)||0} ₽</div><div class="modal-label">Описание</div><div class="modal-text">${esc(selected.description||'Описание отсутствует')}</div><div class="modal-label">Выберите вариант</div><div class="options">${opts.map((x,i)=>`<button class="option ${i===selectedOption?'active':''}" data-option="${i}" type="button" ${Number(x.stock)<=0?'disabled':''}>${Number(x.qty)} шт — ${Number(x.price)||0} ₽</button>`).join('')}</div><div class="modal-label">Остаток: ${Number(o.stock)||0}</div><button class="primary" id="modalAdd" type="button" ${Number(o.stock)<=0?'disabled':''}>🛒 Добавить в корзину</button>`;$('modalClose').onclick=closeModal;$('modalAdd').onclick=()=>{addToCart(selected,Number(o.qty)||1,Number(o.price)||0);closeModal()};$('modalCard').querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{selectedOption=Number(b.dataset.option);renderModal()})}
function openProductModal(id){const p=products.find(x=>Number(x.id)===Number(id));if(!p)return toast('Товар не найден');selected=p;selectedOption=Math.max(0,optionsFor(p).findIndex(x=>Number(x.stock)>0));if(selectedOption<0)selectedOption=0;renderModal();$('modal').classList.add('open');document.body.style.overflow='hidden'}function closeModal(){$('modal').classList.remove('open');document.body.style.overflow='';selected=null}
function addToCart(p,qty,price){const key=String(p.id)+'_'+String(qty)+'_'+String(price);const x=cart.find(a=>a.key===key);if(x)x.count++;else cart.push({key,id:Number(p.id),name:String(p.name||''),qty,price,count:1});saveCart();toast('Добавлено в корзину')}
function renderCart(){const el=$('cartItems');if(!cart.length){el.innerHTML='<div class="empty">Корзина пуста</div>';$('cartTotal').textContent='0 ₽';return}el.innerHTML=cart.map((x,i)=>`<div class="cart-item"><div><div class="cart-item-name">${esc(x.name)}</div><div class="cart-item-price">${Number(x.qty)} шт × ${Number(x.price)} ₽ · ${Number(x.count)} шт.</div></div><button class="remove-btn" type="button" data-remove="${i}">Удалить</button></div>`).join('');el.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{cart.splice(Number(b.dataset.remove),1);saveCart()});$('cartTotal').textContent=cart.reduce((a,x)=>a+Number(x.price)*Number(x.count),0)+' ₽'}
async function checkout(){if(!cart.length)return toast('Корзина пуста');const u=tg?.initDataUnsafe?.user;if(!u)return toast('Откройте магазин через Telegram');const btn=$('checkoutButton');btn.disabled=true;btn.textContent='Оформляем…';try{const total=cart.reduce((a,x)=>a+Number(x.price)*Number(x.count),0);const r=await sb.from('orders').insert({telegram_id:u.id,username:u.username||null,total_amount:total,status:'pending'}).select('*').single();if(r.error)throw r.error;for(const x of cart){const z=await sb.from('order_items').insert({order_id:r.data.id,product_id:x.id,quantity:Number(x.count),price:Number(x.price)});if(z.error)throw z.error}cart=[];saveCart();$('cartPanel').classList.remove('open');document.body.style.overflow='';toast('Заказ оформлен')}catch(e){console.error(e);toast('Ошибка заказа: '+(e.message||e))}finally{btn.disabled=false;btn.textContent='⚡ Оформить заказ'}}
async function loadProducts(){const r=await sb.from('products').select('*').order('id',{ascending:false});if(r.error){console.error(r.error);$('products').innerHTML='<div class="empty">Не удалось загрузить товары</div>';return}products=r.data||[];const cats=[...new Set(products.map(p=>String(p.category||'other')).filter(Boolean))];$('cats').innerHTML='<button class="category active" data-cat="all" type="button">Все</button>'+cats.map(c=>`<button class="category" data-cat="${esc(c)}" type="button">${esc(c)}</button>`).join('');$('cats').querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{activeCat=b.dataset.cat;$('cats').querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('active',x===b));renderProducts()});renderProducts()}
function addVariant(){const d=document.createElement('div');d.className='vrow';d.innerHTML='<input class="vq" type="number" min="1" placeholder="Количество"><input class="vp" type="number" min="0" placeholder="Цена ₽"><input class="vs" type="number" min="0" placeholder="Остаток"><button class="vremove" type="button">×</button>';d.querySelector('.vremove').onclick=()=>{if(document.querySelectorAll('.vrow').length>1)d.remove();validate()};d.querySelectorAll('input').forEach(x=>x.oninput=validate);$('variants').appendChild(d);validate()}
function validate(){const b=$('publish');if(!b)return;const rows=[...document.querySelectorAll('.vrow')];const ok=$('sellerName').value.trim()&&$('sellerImage').files[0]&&rows.length&&rows.every(r=>Number(r.querySelector('.vq').value)>0&&Number(r.querySelector('.vp').value)>=0&&Number(r.querySelector('.vs').value)>=0);b.disabled=!ok}
async function publish(){const b=$('publish');b.disabled=true;b.textContent='Публикуем…';try{const u=tg?.initDataUnsafe?.user;if(!u)throw Error('Откройте магазин через Telegram');const rows=[...document.querySelectorAll('.vrow')];const opts=rows.map(r=>({qty:Number(r.querySelector('.vq').value),price:Number(r.querySelector('.vp').value),stock:Number(r.querySelector('.vs').value)}));const f=$('sellerImage').files[0];const data=await new Promise((res,rej)=>{const rd=new FileReader();rd.onload=()=>res(rd.result);rd.onerror=rej;rd.readAsDataURL(f)});const r=await sb.from('products').insert({name:$('sellerName').value.trim(),description:$('sellerDesc').value.trim(),price:opts[0].price,stock:opts[0].stock,price_options:opts,approval_status:'pending',seller_id:u.id,seller_username:u.username||null,image_url:data,icon:'📦',category:'other'});if(r.error)throw r.error;toast('Товар отправлен на проверку 🕐');$('sellerArea').innerHTML='';await loadProducts()}catch(e){console.error(e);toast('Ошибка: '+(e.message||e))}finally{b.textContent='Опубликовать товар';validate()}}
function sellerUI(){$('sellerArea').innerHTML='<section class="seller"><h3>🏪 Добавить товар</h3><input id="sellerName" placeholder="Название товара"><textarea id="sellerDesc" placeholder="Описание товара"></textarea><input id="sellerImage" type="file" accept="image/*"><div class="variants-title">Варианты товара</div><div id="variants"></div><button class="addv" id="addVariant" type="button">＋ Добавить вариант</button><button class="publish" id="publish" type="button" disabled>Опубликовать товар</button></section>';addVariant();$('sellerName').oninput=validate;$('sellerImage').onchange=validate;$('addVariant').onclick=addVariant;$('publish').onclick=publish}
$('search').oninput=renderProducts;$('cartOpen').onclick=()=>{$('cartPanel').classList.add('open');document.body.style.overflow='hidden';renderCart()};$('cartClose').onclick=()=>{$('cartPanel').classList.remove('open');document.body.style.overflow=''};$('cartPanel').onclick=e=>{if(e.target.id==='cartPanel'){$('cartPanel').classList.remove('open');document.body.style.overflow=''}};$('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};$('checkoutButton').onclick=checkout;sellerUI();saveCart();loadProducts();
</script>
</body>
</html>
