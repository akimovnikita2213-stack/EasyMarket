<style>
:root{--bg:#071225;--panel:#0b1b34;--line:#234267;--text:#f7fbff;--muted:#9db1cc;--blue:#2563eb;--cyan:#0ea5e9}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#071225;color:var(--text);font-family:Arial,sans-serif}body{padding:14px 14px 86px}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:1100px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.logo{font-size:25px;font-weight:900}.logo span{color:#38bdf8}.actions{display:flex;gap:8px}.icon{position:relative;width:44px;height:44px;border-radius:13px;background:#0b203e;border:1px solid #25476e;color:#fff;font-size:20px}.badge{position:absolute;right:-4px;top:-5px;min-width:18px;height:18px;border-radius:99px;background:#2563eb;font-size:10px;display:flex;align-items:center;justify-content:center}.search{width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:#08172d;color:#fff;margin-bottom:12px;outline:0}.cats{display:flex;gap:8px;overflow:auto;margin-bottom:18px}.cat{flex:0 0 auto;padding:10px 14px;border-radius:12px;background:#0b1d37;border:1px solid #244568;color:#b9c9df}.cat.active{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff}.title{font-size:21px;font-weight:900;margin-bottom:13px}.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{min-width:0;border:1px solid #214264;border-radius:16px;background:linear-gradient(145deg,#0d2442,#08172c);padding:11px}.pic,.emoji{width:100%;aspect-ratio:1.15;border-radius:12px;background:#0b1c35;margin-bottom:10px}.pic{object-fit:cover}.emoji{display:flex;align-items:center;justify-content:center;font-size:48px}.name{font-weight:800;font-size:15px}.desc{color:var(--muted);font-size:12px;line-height:1.35;margin:5px 0 8px}.seller{color:#7fb4e8;font-size:11px;margin-bottom:8px}.row{display:flex;align-items:center;justify-content:space-between;gap:7px}.price{font-weight:900}.buy,.primary{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;border-radius:11px;padding:10px 11px;font-weight:900}.empty,.loading{text-align:center;color:var(--muted);padding:45px 15px;grid-column:1/-1}.overlay{position:fixed;inset:0;background:#000b;backdrop-filter:blur(8px);display:none;align-items:flex-end;justify-content:center;z-index:100}.overlay.open{display:flex}.sheet{width:min(620px,100%);max-height:92vh;overflow:auto;background:linear-gradient(145deg,#0e2443,#071426);border:1px solid #285078;border-radius:24px 24px 0 0;padding:17px}.head{display:flex;align-items:center;justify-content:space-between}.head h2{margin:0}.close{width:38px;height:38px;border-radius:11px;background:#19304e;color:#fff;font-size:22px}.modal-img{width:100%;max-height:330px;object-fit:cover;border-radius:15px}.modal-title{font-size:23px;font-weight:900;margin:13px 0 5px}.modal-price{font-size:22px;font-weight:900}.label{color:#8ea7c5;font-size:12px;font-weight:800;margin:15px 0 6px}.text{white-space:pre-line;line-height:1.5}.options,.buttons{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.opt,.secondary{padding:9px 11px;border-radius:11px;background:#19304e;color:#fff;font-weight:800}.opt.active{background:linear-gradient(135deg,var(--blue),var(--cyan))}.cart-item{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #1e3a5a}.qty{display:flex;gap:7px;margin-top:7px}.qty button{width:29px;height:29px;border-radius:8px;background:#19304e;color:#fff}.total{display:flex;justify-content:space-between;font-size:19px;font-weight:900;padding:15px 0}.form{display:grid;gap:9px}.form input,.form textarea,.form select{width:100%;border:1px solid #284b70;border-radius:12px;background:#08172c;color:#fff;padding:12px;outline:0}.form textarea{min-height:80px}.variants{display:grid;gap:8px}.variant{display:grid;grid-template-columns:1fr 1fr 1fr 40px;gap:7px}.hint{font-size:11px;color:#8ea7c5}.full{width:100%}.nav{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);width:calc(100% - 14px);max-width:560px;display:flex;gap:4px;padding:5px;border:1px solid #234267;border-radius:17px;background:#071426f2;z-index:90}.nav button{flex:1;height:46px;border-radius:12px;background:transparent;color:#9db1cc;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:18px}.nav button span{font-size:8px}.nav button.active{background:#12345d;color:#fff}.toast{position:fixed;left:50%;bottom:75px;transform:translate(-50%,15px);opacity:0;pointer-events:none;background:#132943;border:1px solid #31577f;color:#fff;padding:11px 15px;border-radius:12px;z-index:5000;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(min-width:700px){.products{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:420px){.variant{grid-template-columns:1fr 1fr 1fr 34px}.variant input{padding:9px 6px}.buy{padding:9px 7px;font-size:11px}}
</style></head>
<body>
<div class="app"><header class="top"><div class="logo">Easy<span>Market</span></div><div class="actions"><button type="button" class="icon" id="profileBtn">👤</button><button type="button" class="icon" id="cartBtn">🛒<b class="badge" id="cartBadge">0</b></button></div></header><input class="search" id="search" placeholder="🔎 Поиск товаров..."><div class="cats" id="cats"><button type="button" class="cat active" data-cat="all">Все</button><button type="button" class="cat" data-cat="services">🛠️ Услуги</button><button type="button" class="cat" data-cat="accounts">👤 Аккаунты</button><button type="button" class="cat" data-cat="codes">🔑 Коды</button><button type="button" class="cat" data-cat="donate">🎁 Донат</button><button type="button" class="cat" data-cat="other">📦 Прочее</button></div><div class="title">Товары</div><main class="products" id="products"><div class="loading">Загрузка товаров…</div></main></div>
<nav class="nav"><button type="button" class="active" data-nav="orders">🧾<span>Заказы</span></button><button type="button" id="sellerNav" data-nav="seller" style="display:none">🏪<span>Товары</span></button><button type="button" data-nav="chats">💬<span>Чаты</span></button><button type="button" data-nav="settings">⚙️<span>Настройки</span></button></nav>
<div class="overlay" id="productOverlay"><div class="sheet" id="productSheet"></div></div><div class="overlay" id="cartOverlay"><div class="sheet"><div class="head"><h2>🛒 Корзина</h2><button type="button" class="close" data-close="cartOverlay">×</button></div><div id="cartItems"></div><div class="total"><span>Итого</span><span id="cartTotal">0 ₽</span></div><button type="button" class="primary full" id="checkout">⚡ Оформить заказ</button></div></div><div class="overlay" id="ordersOverlay"><div class="sheet"><div class="head"><h2>🧾 Мои заказы</h2><button type="button" class="close" data-close="ordersOverlay">×</button></div><div class="buttons"><button type="button" class="secondary" data-order-filter="pending">⏳ В работе</button><button type="button" class="secondary" data-order-filter="done">✅ Получены</button></div><div id="ordersList"></div></div></div><div class="overlay" id="settingsOverlay"><div class="sheet"><div class="head"><h2>⚙️ Настройки</h2><button type="button" class="close" data-close="settingsOverlay">×</button></div><button type="button" class="secondary full" id="themeBtn">☀️ Светлая тема</button><button type="button" class="primary full" id="sellerEntry" style="display:none;margin-top:9px">🏪 Панель продавца</button><button type="button" class="secondary full" id="becomeSeller" style="margin-top:9px">🏪 Стать продавцом</button><button type="button" class="secondary full" id="adminEntry" style="margin-top:9px">🛡️ Админ-панель</button></div></div><div class="overlay" id="profileOverlay"><div class="sheet"><div class="head"><h2>👤 Профиль</h2><button type="button" class="close" data-close="profileOverlay">×</button></div><div id="profile"></div></div></div><div class="overlay" id="sellerOverlay"><div class="sheet"><div class="head"><h2>🏪 Панель продавца</h2><button type="button" class="close" data-close="sellerOverlay">×</button></div><div id="sellerStats"></div><div style="margin:10px 0"><button type="button" class="secondary full" id="toggleAdd">＋ Добавить товар</button><div id="sellerForm" class="form" style="display:none;margin-top:10px"><input id="sName" placeholder="Название товара"><textarea id="sDesc" placeholder="Описание"></textarea><textarea id="sDetails" placeholder="Что получит покупатель"></textarea><div class="variants" id="variants"></div><button type="button" class="secondary full" id="addVariant">＋ Добавить вариант</button><div class="hint">Количество • Цена ₽ • Остаток</div><input id="sImage" type="file" accept="image/*"><div id="sPreview"></div><select id="sCat"><option value="other">📦 Прочее</option><option value="services">🛠️ Услуги</option><option value="accounts">👤 Аккаунты</option><option value="codes">🔑 Коды</option><option value="donate">🎁 Донат</option></select><button type="button" class="primary full publish" id="publish" disabled>Опубликовать товар</button></div></div><h3>📦 Мои товары</h3><div id="sellerProducts"></div><h3>🧾 Заказы</h3><div id="sellerOrders"></div></div></div><div class="overlay" id="adminOverlay"><div class="sheet"><div class="head"><h2>🛡️ Админ-панель</h2><button type="button" class="close" data-close="adminOverlay">×</button></div><div id="adminContent"></div></div></div><div class="toast" id="toast"></div>
<script>
'use strict';
const SUPABASE_URL='https://uhmgjcoyxehknkehfbbj.supabase.co';
const SUPABASE_KEY='sb_publishable_7Bn4Azfm58BkIJS_6vSsUw_qbGS4wTH';
const tg=window.Telegram&&window.Telegram.WebApp;
if(tg){tg.ready();tg.expand()}
const db=window.supabase&&window.supabase.createClient?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let products=[],cart=[],cat='all',selectedProduct=null,selectedQty=null,checkoutBusy=false,me=null,orderFilter='pending';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),3000)}
function open(id){$('#'+id)?.classList.add('open')}function close(id){$('#'+id)?.classList.remove('open')}
function uid(){return tg?.initDataUnsafe?.user?.id?String(tg.initDataUnsafe.user.id):''}
function user(){return tg?.initDataUnsafe?.user||null}
async function loadProducts(){const box=$('#products');box.innerHTML='<div class="loading">Загрузка товаров…</div>';if(!db){box.innerHTML='<div class="empty">Не удалось подключить базу данных.</div>';return}try{let q=db.from('products').select('*').order('id',{ascending:false});let r=await q;if(r.error)throw r.error;products=r.data||[];const ids=[...new Set(products.map(p=>p.seller_id).filter(Boolean).map(String))];if(ids.length){try{const s=await db.from('users').select('telegram_id,username').in('telegram_id',ids);const map=new Map((s.data||[]).map(x=>[String(x.telegram_id),x]));products=products.map(p=>p.seller_username||!map.get(String(p.seller_id))?p:{...p,seller_username:map.get(String(p.seller_id)).username})}catch(e){console.warn('seller lookup skipped',e)}}renderProducts()}catch(e){console.error('PRODUCT LOAD',e);box.innerHTML='<div class="empty">Ошибка загрузки товаров.<br><br>'+esc(e?.message||e)+'</div>'}}
function options(p){if(Array.isArray(p?.price_options)&&p.price_options.length)return p.price_options.map(x=>({qty:Number(x.qty),price:Number(x.price),stock:Number(x.stock??p.stock??0)})).filter(x=>x.qty>0&&x.price>=0);return[{qty:1,price:Number(p?.price||0),stock:Number(p?.stock??0)}]}
function available(p,o){return Number(o.stock)>0}
function renderProducts(){const box=$('#products');const term=$('#search').value.trim().toLowerCase();const list=products.filter(p=>(cat==='all'||p.category===cat)&&(!term||String(p.name||'').toLowerCase().includes(term)||String(p.description||'').toLowerCase().includes(term))&&String(p.approval_status||'approved').toLowerCase()==='approved');if(!list.length){box.innerHTML='<div class="empty">Товаров пока нет.</div>';return}box.innerHTML=list.map(p=>{const o=options(p)[0],img=p.image_url?'<img class="pic" src="'+esc(p.image_url)+'" alt="">':'<div class="emoji">'+esc(p.icon||'📦')+'</div>';return '<article class="card" data-id="'+Number(p.id)+'"><div data-open="1">'+img+'<div class="name">'+esc(p.name)+'</div><div class="desc">'+esc(p.description||'')+'</div>'+(p.seller_username?'<div class="seller">Продавец: @'+esc(p.seller_username)+'</div>':'')+'</div><div class="row"><span class="price">'+Number(o.price)+' ₽</span><button type="button" class="buy" data-buy="'+Number(p.id)+'" '+(!available(p,o)?'disabled':'')+'>⚡ Оформить</button></div></article>'}).join('')}
function openProduct(id,qty){const p=products.find(x=>Number(x.id)===Number(id));if(!p){toast('Товар не найден');return}selectedProduct=p;const os=options(p);selectedQty=qty||os.find(o=>o.stock>0)?.qty||os[0].qty;$('#productSheet').innerHTML='<div class="head"><h2>🛍️ Товар</h2><button type="button" class="close" data-close="productOverlay">×</button></div>'+(p.image_url?'<img class="modal-img" src="'+esc(p.image_url)+'">':'<div class="emoji">'+esc(p.icon||'📦')+'</div>')+'<div class="modal-title">'+esc(p.name)+'</div><div class="modal-price" id="modalPrice">'+Number(os.find(o=>Number(o.qty)===Number(selectedQty))?.price??p.price)+' ₽</div><div class="label">Количество</div><div class="options">'+os.map(o=>'<button type="button" class="opt '+(Number(o.qty)===Number(selectedQty)?'active':'')+'" data-opt="'+Number(o.qty)+'" '+(o.stock<=0?'disabled':'')+'>'+Number(o.qty)+' шт. · '+Number(o.price)+' ₽</button>').join('')+'</div><div class="label">Описание</div><div class="text">'+esc(p.description||p.details||'')+'</div><button type="button" class="primary full" id="modalBuy" style="margin-top:15px">⚡ Оформить</button>';open('productOverlay')}
function addToCart(id,qty){const p=products.find(x=>Number(x.id)===Number(id));if(!p){toast('Товар не найден');return}const o=options(p).find(x=>Number(x.qty)===Number(qty||selectedQty||1));if(!o||o.stock<=0){toast('Этого варианта нет в наличии');return}const key=Number(p.id)+'_'+Number(o.qty);const x=cart.find(i=>i.key===key);if(x)x.count++;else cart.push({key,productId:Number(p.id),qty:Number(o.qty),price:Number(o.price),count:1,name:p.name});saveCart();updateCart();close('productOverlay');toast('Добавлено в корзину 🛒')}
function saveCart(){try{localStorage.setItem('easymarket_cart',JSON.stringify(cart))}catch(e){}}function loadCart(){try{const x=JSON.parse(localStorage.getItem('easymarket_cart')||'[]');if(Array.isArray(x))cart=x}catch(e){cart=[]}updateCart()}
function updateCart(){$('#cartBadge').textContent=cart.reduce((a,x)=>a+Number(x.count||1),0);const items=$('#cartItems');if(!cart.length){items.innerHTML='<div class="empty">Корзина пуста.</div>';$('#cartTotal').textContent='0 ₽';return}let total=0;items.innerHTML=cart.map((x,i)=>{total+=x.price*x.count;return '<div class="cart-item"><div><b>'+esc(x.name)+'</b><div class="hint">'+x.qty+' шт. · '+x.price+' ₽</div><div class="qty"><button type="button" data-dec="'+i+'">−</button><span>'+x.count+'</span><button type="button" data-inc="'+i+'">＋</button></div></div><b>'+x.price*x.count+' ₽</b></div>'}).join('');$('#cartTotal').textContent=total+' ₽'}
async function checkout(){if(checkoutBusy||!cart.length)return;const id=uid();if(!id){toast('Откройте магазин через Telegram');return}if(!db){toast('База данных недоступна');return}checkoutBusy=true;const btn=$('#checkout');btn.disabled=true;btn.textContent='Ожидайте…';try{const total=cart.reduce((a,x)=>a+x.price*x.count,0);const u=user();const o=await db.from('orders').insert({telegram_id:id,telegram_username:u?.username||null,total,status:'pending'}).select('id').single();if(o.error)throw o.error;const rows=cart.map(x=>({order_id:o.data.id,product_id:x.productId,product_name:x.name,price:x.price,quantity:x.qty*x.count,seller_id:String(products.find(p=>Number(p.id)===Number(x.productId))?.seller_id||'')}));const ir=await db.from('order_items').insert(rows);if(ir.error)throw ir.error;try{await db.functions.invoke('notify-order',{body:{order_id:o.data.id}})}catch(e){console.warn('notify-order',e)}cart=[];saveCart();updateCart();close('cartOverlay');toast('Заказ оформлен ✅')}catch(e){console.error(e);toast('Ошибка оформления: '+(e?.message||e))}finally{checkoutBusy=false;btn.disabled=false;btn.textContent='⚡ Оформить заказ'}}
async function loadMe(){const id=uid();if(!id||!db)return null;const r=await db.from('users').select('*').eq('telegram_id',id).maybeSingle();me=r.data||null;$('#sellerNav').style.display=me?.is_seller?'flex':'none';$('#sellerEntry').style.display=me?.is_seller?'block':'none';return me}
function profile(){const u=user()||{};$('#profile').innerHTML='<div class="text"><b>'+esc([u.first_name,u.last_name].filter(Boolean).join(' ')||'Пользователь')+'</b><br>@'+esc(u.username||'telegram')+'<br>ID: '+esc(u.id||'—')+'</div>';open('profileOverlay')}
function renderSeller(){if(!me?.is_seller)return;$('#sellerStats').innerHTML='<div class="hint">Панель продавца</div>';$('#sellerProducts').innerHTML=products.filter(p=>String(p.seller_id)===String(me.telegram_id)).map(p=>'<div class="admin-row"><b>'+esc(p.name)+'</b><span>'+esc(p.approval_status||'approved')+'</span></div>').join('')||'<div class="hint">Товаров пока нет.</div>'}
function variantRow(q='',p='',s='1'){const d=document.createElement('div');d.className='variant';d.innerHTML='<input type="number" min="1" placeholder="Количество" value="'+q+'"><input type="number" min="0" placeholder="Цена ₽" value="'+p+'"><input type="number" min="0" placeholder="Остаток" value="'+s+'"><button type="button" class="secondary">×</button>';d.lastElementChild.onclick=()=>d.remove();$('#variants').appendChild(d)}
async function publish(){const name=$('#sName').value.trim(),file=$('#sImage').files[0];const rows=$$('#variants .variant');const opts=rows.map(r=>({qty:Number(r.children[0].value),price:Number(r.children[1].value),stock:Number(r.children[2].value)}));if(!name||!file||!opts.length||opts.some(x=>x.qty<1||x.price<0||x.stock<0)){toast('Заполните название, фото и варианты');return}if(!me?.is_seller){toast('Нет прав продавца');return}const b=$('#publish');b.disabled=true;b.textContent='Публикуем…';try{const data=await new Promise((res,rej)=>{const f=new FileReader();f.onload=()=>res(f.result);f.onerror=rej;f.readAsDataURL(file)});const r=await db.from('products').insert({name,description:$('#sDesc').value.trim(),details:$('#sDetails').value.trim(),price:opts[0].price,icon:'📦',category:$('#sCat').value,image_url:data,seller_id:Number(me.telegram_id),seller_username:me.username||null,stock:opts[0].stock,price_options:opts,approval_status:'pending'});if(r.error)throw r.error;toast('Товар отправлен на проверку 🕐');$('#sName').value='';$('#sDesc').value='';$('#sDetails').value='';$('#sImage').value='';$('#variants').innerHTML='';variantRow(1,'','1');await loadProducts();renderSeller()}catch(e){console.error(e);toast('Ошибка: '+(e?.message||e))}finally{b.disabled=false;validatePublish()}}
function validatePublish(){const ok=$('#sName').value.trim()&&$('#sImage').files.length&&$$('#variants .variant').length;$('#publish').disabled=!ok}
function showSeller(){if(!me?.is_seller){toast('Вы не продавец');return}renderSeller();open('sellerOverlay')}
function nav(n){if(n==='orders')open('ordersOverlay');else if(n==='seller')showSeller();else if(n==='settings')open('settingsOverlay');else if(n==='chats'){open('ordersOverlay');toast('Чаты открываются из заказа 💬')}}
function bind(){document.addEventListener('click',e=>{const b=e.target.closest('button');if(b?.dataset.close){close(b.dataset.close);return}const card=e.target.closest('.card');if(card&&!e.target.closest('[data-buy]')){e.preventDefault();openProduct(Number(card.dataset.id));return}if(b?.dataset.buy){e.preventDefault();addToCart(Number(b.dataset.buy));return}if(b?.dataset.opt){selectedQty=Number(b.dataset.opt);openProduct(Number(selectedProduct.id),selectedQty);return}if(b?.id==='modalBuy'){addToCart(Number(selectedProduct.id),selectedQty);return}if(b?.dataset.inc){cart[Number(b.dataset.inc)].count++;saveCart();updateCart();return}if(b?.dataset.dec){cart[Number(b.dataset.dec)].count=Math.max(0,cart[Number(b.dataset.dec)].count-1);if(!cart[Number(b.dataset.dec)].count)cart.splice(Number(b.dataset.dec),1);saveCart();updateCart();return}if(b?.id==='cartBtn')open('cartOverlay');if(b?.id==='profileBtn')profile();if(b?.id==='checkout')checkout();if(b?.id==='sellerEntry')showSeller();if(b?.id==='toggleAdd'){$('#sellerForm').style.display=$('#sellerForm').style.display==='none'?'grid':'none'}if(b?.id==='addVariant')variantRow();if(b?.id==='publish')publish();if(b?.dataset.nav)nav(b.dataset.nav);if(b?.id==='themeBtn'){document.documentElement.classList.toggle('light-theme')}if(b?.id==='adminEntry')toast('Админ-панель доступна владельцу магазина')});$('#search').addEventListener('input',renderProducts);$('#cats').addEventListener('click',e=>{const b=e.target.closest('.cat');if(!b)return;cat=b.dataset.cat;$$('.cat').forEach(x=>x.classList.toggle('active',x===b));renderProducts()});$('#sName').addEventListener('input',validatePublish);$('#sImage').addEventListener('change',validatePublish)}
async function init(){loadCart();bind();variantRow(1,'','1');if(!db){$('#products').innerHTML='<div class="empty">Supabase не загрузился.</div>';return}await saveUser();await loadMe();await loadProducts()}
async function saveUser(){const u=user();if(!u?.id||!db)return;try{await db.from('users').upsert({telegram_id:String(u.id),username:u.username||null,first_name:u.first_name||null,last_name:u.last_name||null},{onConflict:'telegram_id'})}catch(e){console.warn('user sync',e)}}
init();
</script></body></html>
