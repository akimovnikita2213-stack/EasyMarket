<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>EasyMarket</title>
<style>
html,body{margin:0;width:100%;min-height:100%;background:#0b0d12;color:#fff;font-family:Arial,sans-serif}
#boot{padding:30px;text-align:center;color:#9db1cc}
</style>
</head>
<body>
<div id="boot">Загрузка EasyMarket…</div>
<script>
(async function(){
  try{
    const r=await fetch('./index34.html?samepage='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const html=await r.text();
    const parsed=new DOMParser().parseFromString(html,'text/html');
    const scripts=[...parsed.scripts].map(s=>({src:s.src,text:s.textContent,type:s.type||'text/javascript'}));
    document.head.innerHTML=parsed.head.innerHTML;
    document.body.innerHTML=parsed.body.innerHTML;
    for(const s of scripts){
      const el=document.createElement('script');
      el.type=s.type;
      if(s.src){
        await new Promise((resolve,reject)=>{el.src=s.src;el.onload=resolve;el.onerror=()=>reject(new Error('Не загрузился скрипт: '+s.src));document.head.appendChild(el);});
      }else{
        el.textContent=s.text;
        document.body.appendChild(el);
      }
    }
  }catch(e){
    document.body.innerHTML='<div style="padding:30px;color:#fff;font-family:Arial,sans-serif">Ошибка загрузки EasyMarket: '+String(e&&e.message||e)+'</div>';
    console.error(e);
  }
})();
</script>
</body>
</html>
