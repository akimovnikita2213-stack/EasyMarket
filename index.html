<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>EasyMarket</title></head><body style="margin:0;background:#0b0d12;color:#fff;font-family:Arial,sans-serif"><div id="loading" style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:#858b99">Загружаем EasyMarket…</div><script>(async()=>{try{const u=new URL('index34.html',location.href);u.searchParams.set('v','stable-20260916');const r=await fetch(u.href,{cache:'no-store'});if(!r.ok)throw new Error('Не удалось загрузить EasyMarket');let html=await r.text();const patch=`<script>\n(function(){\n  let moderationSubmitted=false;\n  window.notifySellerProductStatus=async function(product,status,reason=""){\n    const sellerId=product?.seller_id?String(product.seller_id):"";\n    const name=String(product?.name||"Товар");\n    if(!sellerId)return {ok:false,error:"seller_id is missing"};\n    let text="";\n    if(status==="pending") text=`🕐 <b>Товар отправлен на модерацию</b>\\n\\n📦 <b>Товар:</b> ${name}\\n\\nДождитесь решения модератора.`;\n    else if(status==="approved") text=`🎉 <b>Ваш товар одобрен!</b>\\n\\n📦 <b>Товар:</b> ${name}\\n\\nТеперь объявление опубликовано.`;\n    else if(status==="rejected") text=`❌ <b>Ваш товар отклонён</b>\\n\\n📦 <b>Товар:</b> ${name}\\n\\n📝 <b>Причина:</b> ${reason||"Не указана"}`;\n    else return {ok:false,error:"unknown status"};\n    try{if(window.tg?.showPopup)tg.showPopup({title:"EasyMarket",message:text.replace(/<[^>]*>/g,"").slice(0,190),buttons:[{id:"ok",type:"ok",text:"Понятно"}]});}catch(e){}\n    if(status==="pending") moderationSubmitted=true;\n    try{\n      const response=await fetch(`${SUPABASE_URL}/functions/v1/notify-order`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY,"Authorization":`Bearer ${SUPABASE_KEY}`},body:JSON.stringify({event_type:"product_moderation",notification_type:"product_moderation",recipient_telegram_id:sellerId,telegram_id:sellerId,seller_id:sellerId,product_id:Number(product?.id||0),product_name:name,moderation_status:status,rejection_reason:reason||null,message:text,status_text:status==="approved"?"Одобрено":status==="rejected"?"Отклонено":"На проверке"})});\n      const raw=await response.text(); let data=null; try{data=raw?JSON.parse(raw):null}catch(e){data={raw}};\n      if(!response.ok||data?.success===false){console.error("PRODUCT TELEGRAM NOTIFY FAILED",data||raw);return {ok:false,error:data?.error||raw||`HTTP ${response.status}`};}\n      console.log("PRODUCT TELEGRAM NOTIFY SENT",data); return {ok:true,data};\n    }catch(e){console.error("PRODUCT TELEGRAM NOTIFY EXCEPTION",e);return {ok:false,error:e?.message||String(e)}}\n  };\n  const originalSaveSellerProduct=window.saveSellerProduct;\n  if(typeof originalSaveSellerProduct==="function"){\n    window.saveSellerProduct=async function(event){\n      moderationSubmitted=false;\n      const btn=document.getElementById("sellerPublishProductBtn");\n      if(btn){btn.disabled=true;btn.textContent="Ожидайте…";btn.style.background="#4b4f5a";btn.style.color="#aeb3bf";}\n      await originalSaveSellerProduct(event);\n      if(moderationSubmitted){\n        const form=document.getElementById("sellerProductForm"); if(form)form.style.display="grid";\n        if(btn){btn.disabled=true;btn.textContent="Ожидайте…";btn.style.background="#4b4f5a";btn.style.color="#aeb3bf";}\n      } else if(btn){btn.disabled=false;btn.textContent="Опубликовать товар";btn.style.background="";btn.style.color="";}\n    };\n  }\n})();\n<\/script>`;html=html.replace('</body>',patch+'</body>');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div style="padding:30px;text-align:center">Ошибка загрузки EasyMarket<br><small>'+String(e.message||e)+'</small></div>'}})();</script></body></html>
