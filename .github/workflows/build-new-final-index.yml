name: Build new final EasyMarket index
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build index-new.html from the existing full design
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('index.html').read_text(encoding='utf-8')
          marker = '/* EM-ROBUST-FUNCTIONAL-LAYER-2026-09-16 */'
          if marker in src:
              src = src.split(marker, 1)[0].rstrip() + '\n'

          bridge = r'''
<script id="easymarket-telegram-click-fix">
(function(){
  function fn(name){
    try { return window[name] || globalThis[name]; } catch(e){ return null; }
  }
  function call(name){
    var f=fn(name), args=[].slice.call(arguments,1);
    if(typeof f==='function'){ try{return f.apply(window,args);}catch(e){console.error('EasyMarket action',name,e);} }
  }
  function productIdFrom(el){
    var card=el && el.closest ? el.closest('.product') : null;
    if(!card) return null;
    var attr=card.getAttribute('data-product-id');
    if(attr) return Number(attr);
    var m=(card.getAttribute('onclick')||'').match(/openProductModal\\((\\d+)/);
    return m ? Number(m[1]) : null;
  }
  function bind(){
    document.addEventListener('click', function(e){
      var buy=e.target.closest && e.target.closest('.product-buy-now');
      if(buy){
        var onclick=buy.getAttribute('onclick')||'';
        var m=onclick.match(/addToCart\\((\\d+)/);
        var id=m?Number(m[1]):productIdFrom(buy);
        if(id!=null){ e.preventDefault(); e.stopImmediatePropagation(); call('addToCart',id); }
        return;
      }
      var card=e.target.closest && e.target.closest('.product');
      if(card && !(e.target.closest && e.target.closest('button,a,input,select,textarea,.product-seller'))){
        var id=productIdFrom(card);
        if(id!=null){ e.preventDefault(); e.stopImmediatePropagation(); call('openProductModal',id); }
        return;
      }
      var checkout=e.target.closest && e.target.closest('#checkoutButton');
      if(checkout){ e.preventDefault(); e.stopImmediatePropagation(); call('checkout'); return; }
    }, true);
  }

  function sellerVariants(){
    var price=document.getElementById('sellerProductPrice');
    var stock=document.getElementById('sellerProductStock');
    if(!price || document.getElementById('sellerPriceOptionsRows')) return;
    var host=price.closest('.form-group') || price.parentElement;
    if(!host) return;
    var box=document.createElement('div');
    box.id='sellerPriceOptionsBox';
    box.style.marginTop='10px';
    box.innerHTML='<div style="font-size:13px;font-weight:800;margin-bottom:7px">Варианты количества и цены</div><div id="sellerPriceOptionsRows"></div><button type="button" class="admin-btn secondary" id="sellerAddPriceOption" style="margin-top:8px;width:100%">＋ Добавить вариант</button><input type="hidden" id="sellerProductPriceOptions">';
    host.parentNode.insertBefore(box, host.nextSibling);
    var rows=box.querySelector('#sellerPriceOptionsRows');
    function add(q,p,s){
      var r=document.createElement('div'); r.className='price-option-row';
      r.innerHTML='<input class="seller-opt-qty" type="number" min="1" step="1" placeholder="Количество" value="'+(q||'')+'"><input class="seller-opt-price" type="number" min="0" step="0.01" placeholder="Цена, ₽" value="'+(p||'')+'"><button type="button" class="price-option-remove">×</button>';
      rows.appendChild(r);
      r.querySelector('.price-option-remove').onclick=function(){r.remove();sync();};
      r.querySelectorAll('input').forEach(function(x){x.addEventListener('input',sync);});
      sync();
    }
    function sync(){
      var opts=[].slice.call(rows.querySelectorAll('.price-option-row')).map(function(r){return {qty:Number(r.querySelector('.seller-opt-qty').value),price:Number(r.querySelector('.seller-opt-price').value)};}).filter(function(x){return Number.isFinite(x.qty)&&x.qty>0&&Number.isFinite(x.price)&&x.price>=0;});
      document.getElementById('sellerProductPriceOptions').value=JSON.stringify(opts);
      if(opts[0]){price.value=opts[0].price;if(stock)stock.value=stock.value||0;}
    }
    document.getElementById('sellerAddPriceOption').onclick=function(){add('','','');};
    add(1,price.value||'');

    var original=fn('saveSellerProduct');
    if(typeof original==='function' && !original.__emWrapped){
      function wrapped(ev){
        sync();
        var details=document.getElementById('sellerProductDetails');
        var old=details?details.value:'';
        var raw=document.getElementById('sellerProductPriceOptions')?.value||'[]';
        try{
          var clean=old.replace(/\\n?<!--EM_PRICES:.*?-->/g,'').trim();
          if(details) details.value=clean+'\\n<!--EM_PRICES:'+raw+'-->';
        }catch(e){}
        try{return original.call(this,ev);} finally { if(details) details.value=old; }
      }
      wrapped.__emWrapped=true;
      window.saveSellerProduct=wrapped;
    }
  }

  function expose(){
    ['openProductModal','closeProductModal','addToCart','addToCartFromModal','buyNow','openCart','closeCart','changeCartQuantity','removeFromCart','checkout','renderProducts','selectProductQuantity','saveSellerProduct'].forEach(function(n){
      try{ if(typeof window[n] !== 'function' && typeof globalThis[n] === 'function') window[n]=globalThis[n]; }catch(e){}
    });
  }
  function start(){expose();bind();sellerVariants();setTimeout(function(){expose();sellerVariants();},500);setTimeout(function(){expose();sellerVariants();},1500);}
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start); else start();
})();
</script>
'''
          src = src.replace('</body>', bridge + '\n</body>')
          Path('index-new.html').write_text(src, encoding='utf-8')
          PY
      - name: Commit new final index
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index-new.html
          git commit -m 'Build new final index with working Telegram buttons' || exit 0
          git push
