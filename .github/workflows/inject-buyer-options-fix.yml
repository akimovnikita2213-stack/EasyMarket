name: Inject robust buyer options fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject buyer fix
        run: |
          if ! grep -q 'src="./buyer-options-fix.js"' index.html; then
            sed -i 's#</body>#<script src="./buyer-options-fix.js"></script></body>#' index.html
          fi
      - name: Validate JavaScript
        run: node --check buyer-options-fix.js
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/inject-buyer-options-fix.yml
          git commit -m 'Fix buyer quantity and price selector'
          git push
