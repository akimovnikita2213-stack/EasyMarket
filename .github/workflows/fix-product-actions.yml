name: Fix product card clicks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add click fallback only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='EM-TELEGRAM-CARD-CLICK-FIX-2026-09-17'
          if marker not in s:
              hook=r'''
<script>
/* EM-TELEGRAM-CARD-CLICK-FIX-2026-09-17 */
(function(){
  document.addEventListener('click',function(e){
    var el=e.target;
    var buy=el&&el.closest?el.closest('.product-buy-now'):null;
    if(buy){
      var oc=buy.getAttribute('onclick')||'';
      var m=oc.match(/addToCart\((\d+)/);
      if(m && typeof window.addToCart==='function'){
        e.preventDefault();e.stopPropagation();window.addToCart(Number(m[1]));
      }
      return;
    }
    var card=el&&el.closest?el.closest('.product'):null;
    if(card){
      var oc2=card.getAttribute('onclick')||'';
      var m2=oc2.match(/openProductModal\((\d+)/);
      if(m2 && typeof window.openProductModal==='function'){
        e.preventDefault();e.stopPropagation();window.openProductModal(Number(m2[1]));
      }
    }
  },true);
})();
</script>
'''
              s=s.replace('</body>',hook+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
          Path('index-fixed.html').write_text(s,encoding='utf-8')
          Path('index-final.html').write_text(s,encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html index-fixed.html index-final.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix product card and add-to-cart clicks without UI changes'
          git push
