name: Build clean fixed EasyMarket index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Keep current working index unchanged
        shell: bash
        run: |
          cp index.html index-fixed.html
          cp index.html index-final.html
      - name: Commit fixed files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-fixed.html index-final.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Sync final page with working EasyMarket index"
            git push
          fi
