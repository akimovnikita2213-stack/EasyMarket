name: Build clean fixed EasyMarket index

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build fixed indexes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('index.html').read_text(encoding='utf-8')
          marker = '/* EM-ROBUST-FUNCTIONAL-LAYER-2026-09-16 */'
          if marker in src:
              src = src.split(marker, 1)[0]
          orphan = '''\n      background: #141720;\n      border: 1px solid #242834;\n      border-radius: 18px;\n      padding: 14px;\n    }\n'''
          src = src.replace(orphan, '\n')
          hook = '''\n<script id="easymarket-global-actions">\n(function(){\n  const names = [\n    'openProductModal','closeProductModal','addToCart','addToCartFromModal','buyNow',\n    'openCart','closeCart','changeCartQuantity','removeFromCart','checkout',\n    'setCategory','renderProducts','selectProductQuantity'\n  ];\n  names.forEach(function(name){\n    try { if (typeof window[name] !== 'function' && typeof globalThis[name] === 'function') window[name] = globalThis[name]; } catch(e) {}\n  });\n})();\n</script>\n'''
          src = src.replace('</body>', hook + '\n</body>')
          Path('index-fixed.html').write_text(src, encoding='utf-8')
          Path('index-final.html').write_text(src, encoding='utf-8')
          Path('index.html').write_text(src, encoding='utf-8')
          PY

      - name: Commit fixed files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html index-fixed.html index-final.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Keep final EasyMarket design and working shop"
            git push
          fi
