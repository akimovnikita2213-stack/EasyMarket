name: Build clean fixed EasyMarket index

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build fixed indexes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('index.html').read_text(encoding='utf-8')
          marker = '/* EM-ROBUST-FUNCTIONAL-LAYER-2026-09-16 */'
          if marker in src:
              src = src.split(marker, 1)[0]
          orphan = '''\n      background: #141720;\n      border: 1px solid #242834;\n      border-radius: 18px;\n      padding: 14px;\n    }\n'''
          src = src.replace(orphan, '\n')
          bind = '''\n\n  // Telegram WebView: expose existing app actions on window for inline buttons.\n  try {\n    window.openProductModal = openProductModal;\n    window.closeProductModal = closeProductModal;\n    window.addToCart = addToCart;\n    window.addToCartFromModal = addToCartFromModal;\n    window.buyNow = buyNow;\n    window.openCart = openCart;\n    window.closeCart = closeCart;\n    window.changeCartQuantity = changeCartQuantity;\n    window.removeFromCart = removeFromCart;\n    window.checkout = checkout;\n    window.setCategory = setCategory;\n    window.renderProducts = renderProducts;\n    window.selectProductQuantity = selectProductQuantity;\n  } catch (e) { console.warn('EasyMarket global actions bind failed', e); }\n'''
          pos = src.rfind('</script>')
          if pos == -1:
              raise SystemExit('No closing script tag found')
          src = src[:pos] + bind + src[pos:]

          bridge = r'''\n<script id="easymarket-telegram-interaction-bridge">\n(function(){\n  'use strict';\n  const URL='https://uhmgjcoyxehknkehfbbj.supabase.co';\n  const KEY='sb_publishable_7Bn4Azfm58BkIJS_6vSsUw_qbGS4wTH';\n  let db=null, items=[], bridgeCart=[];\n  const tg=window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;\n  const esc=s=>String(s==null?'':s).replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));\n  const opts=p=>{\n    if(Array.isArray(p&&p.price_options)&&p.price_options.length) return p.price_options.map(x=>({qty:Number(x.qty),price:Number(x.price)})).filter(x=>x.qty>0&&x.price>=0);\n    const m=String(p&&p.details||'').match(/<!--EM_PRICES:(.*?)-->/);\n    if(m) try { const a=JSON.parse(m[1]); if(Array.isArray(a)&&a.length) return a.map(x=>({qty:Number(x.qty),price:Number(x.price)})).filter(x=>x.qty>0&&x.price>=0); } catch(e){}\n    return [{qty:1,price:Number(p&&p.price||0)}];\n  };\n  const text=s=>String(s||'').replace(/\\s*<!--EM_PRICES:.*?-->\\s*/g,'').trim();\n  function toast(msg){ try{ if(typeof window.showToast==='function'){window.showToast(msg);return;} }catch(e){}; try{ if(tg&&tg.showPopup) tg.showPopup({title:'EasyMarket',message:String(msg).slice(0,190),buttons:[{id:'ok',type:'ok',text:'OK'}]}); }catch(e){} }\n  function save(){try{localStorage.setItem('easymarket_cart',JSON.stringify(bridgeCart));}catch(e){}}\n  function loadCart(){try{const a=JSON.parse(localStorage.getItem('easymarket_cart')||'[]');bridgeCart=Array.isArray(a)?a:[];}catch(e){bridgeCart=[];}}\n  function renderCart(){\n    const box=document.getElementById('cartItems'), totalEl=document.getElementById('cartTotal'), btn=document.getElementById('checkoutButton');\n    if(!box)return;\n    const count=bridgeCart.length;\n    ['cartCount','topCartCount','statCart'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=count;});\n    if(!count){box.innerHTML='<div class="empty" style="padding:30px 10px;">Корзина пустая 🛒</div>';if(totalEl)totalEl.textContent='0 ₽';if(btn){btn.disabled=true;btn.textContent='Корзина пустая';}return;}\n    let total=0;\n    box.innerHTML=bridgeCart.map((p,i)=>{total+=Number(p.price||0);return '<div class="cart-item"><div><div class="cart-item-name">'+esc(p.name)+'</div><div class="cart-item-price">'+Number(p.price||0)+' ₽ · '+Number(p.quantity||1)+' шт.</div><div class="cart-quantity"><button data-em-minus="'+i+'">−</button><span>'+Number(p.quantity||1)+'</span><button data-em-plus="'+i+'">+</button></div></div><button class="remove-btn" data-em-remove="'+i+'">✕</button></div>';}).join('');\n    if(totalEl)totalEl.textContent=total+' ₽';\n    if(btn){btn.disabled=false;btn.textContent='⚡ Оформить заказ';}\n  }\n  function openCart(){const p=document.getElementById('cartPanel');if(p){p.classList.add('open');renderCart();}}\n  function closeModal(){const p=document.getElementById('productModal');if(p)p.classList.remove('open');document.body.style.overflow='';}\n  function add(product,qty){\n    const o=opts(product).find(x=>Number(x.qty)===Number(qty))||opts(product)[0];\n    const i=bridgeCart.findIndex(x=>Number(x.id)===Number(product.id));\n    const entry={...product,quantity:Number(o.qty),price:Number(o.price)};\n    if(i<0)bridgeCart.push(entry); else bridgeCart[i]=entry;\n    save();renderCart();toast('Товар добавлен в корзину 🛒');\n    openCart();\n  }\n  function openModal(product,qty){\n    const panel=document.getElementById('productModal'), content=document.getElementById('productModalContent');\n    if(!panel||!content)return;\n    const os=opts(product), selected=os.find(o=>Number(o.qty)===Number(qty))||os[0];\n    const media=product.image_url?'<img class="product-modal-image" src="'+esc(product.image_url)+'" alt="'+esc(product.name)+'">':'<div class="product-modal-icon">'+esc(product.icon||'📦')+'</div>';\n    content.innerHTML=media+'<div class="product-modal-title">'+esc(product.name)+'</div><div class="product-modal-price">'+Number(selected.price||0)+' ₽</div><div class="quantity-picker"><div class="quantity-title">Выберите количество</div><div class="quantity-options">'+os.map(o=>'<button type="button" class="quantity-option '+(Number(o.qty)===Number(selected.qty)?'active':'')+'" data-em-qty="'+Number(o.qty)+'">'+Number(o.qty)+' шт.<small>'+Number(o.price)+' ₽</small></button>').join('')+'</div></div>'+(product.description?'<div class="product-modal-label">Описание</div><div class="product-modal-text">'+esc(text(product.description))+'</div>':'')+(product.details?'<div class="product-modal-label">Детали</div><div class="product-modal-text">'+esc(text(product.details))+'</div>':'')+'<div class="product-modal-actions"><button class="buy-btn product-buy-now" id="emModalBuy">⚡ Оформить</button></div>';\n    panel.classList.add('open');document.body.style.overflow='hidden';\n    content.querySelectorAll('[data-em-qty]').forEach(b=>b.addEventListener('click',()=>openModal(product,Number(b.dataset.emQty))));\n    const buy=document.getElementById('emModalBuy');if(buy)buy.onclick=()=>{add(product,selected.qty);closeModal();};\n  }\n  function renderProducts(){\n    const box=document.getElementById('products');if(!box)return;\n    const search=(document.getElementById('searchInput')?.value||'').trim().toLowerCase();\n    const cat=window.__emBridgeCategory||'all';\n    const list=items.filter(p=>(!p.seller_id||String(p.approval_status||'approved')==='approved')&&(cat==='all'||p.category===cat)&&(!search||String(p.name||'').toLowerCase().includes(search)||String(p.description||'').toLowerCase().includes(search)));\n    if(!list.length){box.innerHTML='<div class="empty">Товары не найдены 📦</div>';return;}\n    box.innerHTML=list.map(p=>'<div class="product" data-em-product="'+Number(p.id)+'">'+(p.image_url?'<img class="product-image" src="'+esc(p.image_url)+'" alt="'+esc(p.name)+'" loading="lazy">':'<div class="product-icon">'+esc(p.icon||'📦')+'</div>')+'<div class="product-name">'+esc(p.name)+'</div><div class="product-description">'+esc(text(p.description))+'</div>'+(p.seller_id||p.seller_username?'<div class="product-seller seller-link">🏪 Продавец · <b>'+esc(String(p.seller_username||'Продавец').replace(/^@/,''))+'</b></div>':'')+'<div class="product-bottom"><div class="product-cart-action"><div class="price">'+Number(p.price||0)+' ₽</div><button class="buy-btn product-buy-now" data-em-buy="'+Number(p.id)+'">⚡ Оформить</button></div></div></div>').join('');\n    box.querySelectorAll('[data-em-product]').forEach(c=>c.addEventListener('click',e=>{if(e.target.closest('[data-em-buy]'))return;const p=items.find(x=>Number(x.id)===Number(c.dataset.emProduct));if(p)openModal(p);}));\n    box.querySelectorAll('[data-em-buy]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const p=items.find(x=>Number(x.id)===Number(b.dataset.emBuy));if(p)add(p,opts(p)[0].qty);}));\n  }\n  async function load(){\n    try{\n      if(!window.supabase)return;\n      db=window.supabase.createClient(URL,KEY);\n      const r=await db.from('products').select('*').order('id',{ascending:false});\n      if(r.error)throw r.error;items=r.data||[];loadCart();renderProducts();renderCart();\n    }catch(e){console.error('EasyMarket bridge load error',e);const box=document.getElementById('products');if(box)box.innerHTML='<div class="empty">Не удалось загрузить товары.</div>';}\n  }\n  async function checkout(){\n    if(!bridgeCart.length){toast('Корзина пустая');return;}\n    const btn=document.getElementById('checkoutButton');if(btn){btn.disabled=true;btn.textContent='Создаём заказ...';}\n    try{\n      const u=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user?tg.initDataUnsafe.user:null;\n      const telegramId=u&&u.id?String(u.id):null, username=u&&u.username?String(u.username):null;\n      const total=bridgeCart.reduce((s,p)=>s+Number(p.price||0),0);\n      const sellerIds=[...new Set(bridgeCart.map(p=>p.seller_id).filter(Boolean).map(String))];\n      const orderR=await db.from('orders').insert({telegram_id:telegramId,telegram_username:username,total,status:'pending',seller_id:sellerIds.length===1?sellerIds[0]:null,seller_status:'pending',buyer_received:false}).select().single();\n      if(orderR.error)throw orderR.error;\n      const rows=bridgeCart.map(p=>({order_id:orderR.data.id,product_id:p.id,product_name:p.name,price:Number(p.price||0),quantity:Number(p.quantity||1),seller_id:p.seller_id?String(p.seller_id):null}));\n      const ir=await db.from('order_items').insert(rows);if(ir.error)throw ir.error;\n      try{await db.functions.invoke('notify-order',{body:{record:{...orderR.data,status:'В ожидании'},items:rows,status_text:'В ожидании'}});}catch(e){}\n      bridgeCart=[];save();renderCart();const panel=document.getElementById('cartPanel');if(panel)panel.classList.remove('open');toast('Заказ №'+orderR.data.id+' создан ✅');\n      try{if(tg&&tg.showAlert)tg.showAlert('✅ Заказ №'+orderR.data.id+' оформлен!');}catch(e){}\n    }catch(e){console.error('EasyMarket bridge checkout error',e);toast('Ошибка оформления: '+(e&&e.message?e.message:e));}\n    finally{if(btn){btn.disabled=false;btn.textContent=bridgeCart.length?'⚡ Оформить заказ':'Корзина пустая';}}\n  }\n  function bind(){\n    loadCart();\n    document.addEventListener('click',e=>{\n      if(e.target.closest('[data-em-remove]')){const i=Number(e.target.closest('[data-em-remove]').dataset.emRemove);bridgeCart.splice(i,1);save();renderCart();}\n      if(e.target.closest('[data-em-minus]')){const i=Number(e.target.closest('[data-em-minus]').dataset.emMinus);const p=bridgeCart[i];if(p){const o=opts(p),pos=o.findIndex(x=>Number(x.qty)===Number(p.quantity));if(pos>0){p.quantity=o[pos-1].qty;p.price=o[pos-1].price;save();renderCart();}}}\n      if(e.target.closest('[data-em-plus]')){const i=Number(e.target.closest('[data-em-plus]').dataset.emPlus);const p=bridgeCart[i];if(p){const o=opts(p),pos=o.findIndex(x=>Number(x.qty)===Number(p.quantity));if(pos>=0&&pos<o.length-1){p.quantity=o[pos+1].qty;p.price=o[pos+1].price;save();renderCart();}}}\n      if(e.target.id==='checkoutButton')checkout();\n    },true);\n    const search=document.getElementById('searchInput');if(search)search.addEventListener('input',renderProducts);\n    document.querySelectorAll('.category').forEach(b=>b.addEventListener('click',()=>{window.__emBridgeCategory=b.textContent.includes('Услуги')?'services':b.textContent.includes('Аккаунты')?'accounts':b.textContent.includes('Коды')?'codes':b.textContent.includes('Донат')?'donate':b.textContent.includes('Прочее')?'other':'all';renderProducts();}));\n    const cp=document.getElementById('cartPanel');if(cp)cp.addEventListener('click',e=>{if(e.target===cp)cp.classList.remove('open');});\n    const pm=document.getElementById('productModal');if(pm)pm.addEventListener('click',e=>{if(e.target===pm)closeModal();});\n  }\n  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>{bind();load();});else{bind();load();}\n  window.emBridge={openModal,openCart,checkout};\n})();\n</script>\n'''
          bodypos = src.lower().rfind('</body>')
          if bodypos == -1:
              raise SystemExit('No closing body tag found')
          src = src[:bodypos] + bridge + '\n' + src[bodypos:]
          Path('index-fixed.html').write_text(src, encoding='utf-8')
          Path('index-final.html').write_text(src, encoding='utf-8')
          Path('index.html').write_text(src, encoding='utf-8')
          PY

      - name: Commit fixed files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html index-fixed.html index-final.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Fix Telegram product modal and cart interactions"
            git push
          fi
