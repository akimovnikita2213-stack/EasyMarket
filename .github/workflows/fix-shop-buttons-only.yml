name: Fix Telegram shop buttons only
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only quantity selection and stray text
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          fix=r'''
<script id="telegram-quantity-only-fix">
(function(){
  function expose(){
    ['openProductModal','closeProductModal','addToCart','addToCartFromModal','buyNow','openCart','closeCart','changeCartQuantity','removeFromCart','checkout','setCategory','renderProducts'].forEach(function(n){
      try { if(typeof globalThis[n]==='function') window[n]=globalThis[n]; } catch(e) {}
    });
  }
  function selectQty(productId, qty){
    var product=(typeof products!=='undefined' && Array.isArray(products)) ? products.find(function(p){return Number(p.id)===Number(productId);}) : null;
    if(!product) return;
    var options=[];
    try{ options=getPriceOptions(product)||[]; }catch(e){}
    var chosen=options.find(function(o){return Number(o.qty)===Number(qty);}) || options[0] || {qty:1,price:Number(product.price||0)};
    document.querySelectorAll('#productModal .quantity-option').forEach(function(b){
      var m=(b.textContent||'').match(/[-+]?\d+(?:[.,]\d+)?/);
      b.classList.toggle('active', !!m && Number(m[0].replace(',','.'))===Number(chosen.qty));
    });
    var price=document.getElementById('modalSelectedPrice');
    if(price) price.textContent=Number(chosen.price||0)+' ₽';
    var btn=document.querySelector('#productModal .product-modal-actions .product-buy-now');
    if(btn) btn.setAttribute('onclick','addToCartFromModal('+Number(product.id)+','+Number(chosen.qty)+')');
  }
  function cleanStray(){
    var root=document.body;if(!root)return;
    var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT), nodes=[];
    while(w.nextNode()) nodes.push(w.currentNode);
    nodes.forEach(function(n){
      var t=(n.nodeValue||'').trim();
      if(/^(?:\\\\n|\\\\r|\\\\t|\\s)+$/.test(t) && /\\\\n|\\\\r|\\\\t/.test(t)) n.remove();
    });
  }
  expose();
  window.selectProductQuantity=selectQty;
  document.addEventListener('DOMContentLoaded',function(){expose();window.selectProductQuantity=selectQty;cleanStray();});
  setTimeout(function(){expose();window.selectProductQuantity=selectQty;cleanStray();},50);
  setTimeout(cleanStray,500);
})();
</script>
'''
          for name in ['index.html','index-final.html']:
              p=Path(name)
              if not p.exists(): continue
              s=p.read_text(encoding='utf-8')
              if 'id="telegram-quantity-only-fix"' in s: continue
              s=s.replace('</body>',fix+'\n</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html index-final.html
          git commit -m 'Fix product quantity selection and stray text only' || exit 0
          git push