name: Fix Telegram shop buttons only
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only Telegram button bindings and stray text
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # Remove only literal escaped newline-only text nodes/content.
          s=re.sub(r'(?<![A-Za-z0-9])(?:\\\\n[ \\t]*){2,}(?![A-Za-z0-9])', '', s)
          fix=r'''
<script id="telegram-shop-button-fix">
(function(){
  function expose(){
    var names=['openProductModal','closeProductModal','addToCart','addToCartFromModal','buyNow','openCart','closeCart','changeCartQuantity','removeFromCart','checkout','selectProductQuantity','setCategory','renderProducts'];
    names.forEach(function(n){
      try { if (typeof window[n] !== 'function' && typeof globalThis[n] === 'function') window[n]=globalThis[n]; } catch(e) {}
    });
  }
  expose();
  document.addEventListener('DOMContentLoaded', expose, {once:true});
  setTimeout(expose, 0);
  setTimeout(expose, 500);
  function cleanStrayNewlines(){
    var root=document.body;
    if(!root)return;
    var walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
    var nodes=[];
    while(walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(function(node){
      var t=node.nodeValue||'';
      if(/^(?:\\\\n[ \\t]*){2,}$/.test(t)) node.remove();
    });
  }
  cleanStrayNewlines();
  document.addEventListener('DOMContentLoaded', cleanStrayNewlines, {once:true});
})();
</script>
'''
          if 'id="telegram-shop-button-fix"' not in s:
              s=s.replace('</body>',fix+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix Telegram product modal and cart buttons only' || exit 0
          git push