name: Fix Telegram WebApp clicks

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add Telegram-safe click delegation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          src = p.read_text(encoding='utf-8')
          marker = 'EM-TELEGRAM-CLICK-DELEGATION-2026-09-16'
          if marker not in src:
              patch = r'''
          <script id="em-telegram-click-fix">
          /* EM-TELEGRAM-CLICK-DELEGATION-2026-09-16
             Telegram WebView-safe delegation for existing product/cart onclicks.
             No visual/layout changes. */
          (function(){
            function runExistingAction(el){
              if(!el) return false;
              const code = el.getAttribute && el.getAttribute('onclick');
              if(!code) return false;
              let m;
              if((m=code.match(/openProductModal\(\s*(\d+)/))){ openProductModal(Number(m[1])); return true; }
              if((m=code.match(/addToCartFromModal\(\s*(\d+)\s*,\s*Number\([^)]*?([0-9]+)[^)]*\)/))){ addToCartFromModal(Number(m[1]), Number(m[2])); return true; }
              if((m=code.match(/addToCart\(\s*(\d+)(?:\s*,\s*([0-9]+))?/))){ addToCart(Number(m[1]), m[2] ? Number(m[2]) : undefined); return true; }
              if(/\bcheckout\s*\(\s*\)/.test(code)){ checkout(); return true; }
              if(/\bopenCart\s*\(\s*\)/.test(code)){ openCart(); return true; }
              return false;
            }
            document.addEventListener('click', function(e){
              const el = e.target && e.target.closest ? e.target.closest('[onclick]') : null;
              if(!el) return;
              const code = el.getAttribute('onclick') || '';
              if(!/(openProductModal|addToCartFromModal|addToCart|checkout|openCart)\s*\(/.test(code)) return;
              e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
              try { runExistingAction(el); } catch(err) { console.error('Telegram click fix:', err); }
            }, true);
          })();
          </script>
          '''
              src = src.replace('</body>', patch + '\n</body>', 1)
              p.write_text(src, encoding='utf-8')

          clean = p.read_text(encoding='utf-8')
          Path('index-final.html').write_text(clean, encoding='utf-8')
          Path('index-fixed.html').write_text(clean, encoding='utf-8')
          PY

      - name: Commit patched files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html index-final.html index-fixed.html
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'Fix Telegram product and cart clicks'; git push; fi
