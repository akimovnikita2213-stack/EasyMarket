name: Repair current EasyMarket safely
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean duplicate generated blocks and fix seller totals
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          exact = re.compile(r'<script id="easymarket-global-actions">\s*window\.openProductModal = openProductModal;\s*window\.closeProductModal = closeProductModal;\s*window\.addToCart = addToCart;\s*window\.addToCartFromModal = addToCartFromModal;\s*window\.buyNow = buyNow;\s*window\.openCart = openCart;\s*window\.closeCart = closeCart;\s*window\.changeCartQuantity = changeCartQuantity;\s*window\.removeFromCart = removeFromCart;\s*window\.checkout = checkout;\s*window\.setCategory = setCategory;\s*window\.renderProducts = renderProducts;\s*window\.selectProductQuantity = selectProductQuantity;\s*</script>', re.S)
          matches = list(exact.finditer(s))
          if len(matches) > 1:
              keep = matches[-1]
              out=[]; last=0
              for m in matches[:-1]:
                  out.append(s[last:m.start()]); last=m.end()
              out.append(s[last:])
              s=''.join(out)
          old = "Number(its.reduce((a,i)=>a+Number(i.price||0)*Number(i.quantity||1),0))"
          new = "Number(its.reduce((a,i)=>a+Number(i.price||0),0))"
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify HTML script syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import subprocess, tempfile
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.scripts=[]; self.cur=None
              def handle_starttag(self, tag, attrs):
                  if tag.lower()=='script': self.cur=[]
              def handle_data(self, data):
                  if self.cur is not None: self.cur.append(data)
              def handle_endtag(self, tag):
                  if tag.lower()=='script' and self.cur is not None:
                      self.scripts.append(''.join(self.cur)); self.cur=None
          checked=[]
          for p in sorted(Path('.').glob('*.html')):
              parser=P(); parser.feed(p.read_text(encoding='utf-8'))
              for i,src in enumerate(parser.scripts):
                  if not src.strip(): continue
                  with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
                      f.write(src); name=f.name
                  r=subprocess.run(['node','--check',name],capture_output=True,text=True)
                  if r.returncode:
                      print(f'SYNTAX ERROR: {p} script {i+1}')
                      print(r.stderr)
                      raise SystemExit(1)
              checked.append(p.name)
          print('Checked HTML scripts:', len(checked), 'files')
          PY
      - name: Commit repair and remove this workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Repair current EasyMarket and remove conflicting workflows' || true
          git rm .github/workflows/repair-current.yml || true
          git commit -m 'Remove one-time repair workflow' || true
          git push
