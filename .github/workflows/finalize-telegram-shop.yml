name: Finalize Telegram shop

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for other generated files to settle
        run: sleep 75
      - name: Add final Telegram interaction bridge
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index-final.html')
          s=p.read_text(encoding='utf-8')
          marker='id="em-final-telegram-bridge"'
          if marker in s:
              print('Bridge already present')
              raise SystemExit(0)
          bridge=r'''<script id="em-final-telegram-bridge">
          (function(){
            const U='https://uhmgjcoyxehknkehfbbj.supabase.co',K='sb_publishable_7Bn4Azfm58BkIJS_6vSsUw_qbGS4wTH';
            let db,ps=[],cart=[]; const tg=window.Telegram?.WebApp;
            const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
            const options=p=>{if(Array.isArray(p?.price_options)&&p.price_options.length)return p.price_options.map(x=>({qty:+x.qty,price:+x.price})).filter(x=>x.qty>0&&x.price>=0);const m=String(p?.details||'').match(/<!--EM_PRICES:(.*?)-->/);if(m)try{let a=JSON.parse(m[1]);if(Array.isArray(a)&&a.length)return a.map(x=>({qty:+x.qty,price:+x.price})).filter(x=>x.qty>0&&x.price>=0)}catch(e){}return[{qty:1,price:+p?.price||0}]};
            const toast=m=>{try{window.showToast?.(m)}catch(e){}};
            const save=()=>localStorage.setItem('easymarket_cart',JSON.stringify(cart));
            const loadCart=()=>{try{let a=JSON.parse(localStorage.getItem('easymarket_cart')||'[]');cart=Array.isArray(a)?a:[]}catch(e){cart=[]}};
            function drawCart(){const b=document.getElementById('cartItems'),t=document.getElementById('cartTotal'),c=document.getElementById('checkoutButton');if(!b)return;if(!cart.length){b.innerHTML='<div class="empty" style="padding:30px 10px">Корзина пустая 🛒</div>';if(t)t.textContent='0 ₽';if(c){c.disabled=true;c.textContent='Корзина пустая'};return}let total=0;b.innerHTML=cart.map((p,i)=>{total+=+p.price||0;return `<div class="cart-item"><div><div class="cart-item-name">${esc(p.name)}</div><div class="cart-item-price">${+p.price||0} ₽ · ${+p.quantity||1} шт.</div></div><button class="remove-btn" data-em-r="${i}">✕</button></div>`}).join('');if(t)t.textContent=total+' ₽';if(c){c.disabled=false;c.textContent='⚡ Оформить заказ'}}
            function openCart(){document.getElementById('cartPanel')?.classList.add('open');drawCart()}
            function closeModal(){document.getElementById('productModal')?.classList.remove('open');document.body.style.overflow=''}
            function add(p,q){let o=options(p).find(x=>+x.qty===+q)||options(p)[0];let i=cart.findIndex(x=>+x.id===+p.id);let x={...p,quantity:+o.qty,price:+o.price};if(i<0)cart.push(x);else cart[i]=x;save();drawCart();toast('Товар добавлен в корзину 🛒');openCart()}
            function modal(p,q){let os=options(p),o=os.find(x=>+x.qty===+q)||os[0],m=document.getElementById('productModal'),b=document.getElementById('productModalContent');if(!m||!b)return;let media=p.image_url?`<img class="product-modal-image" src="${esc(p.image_url)}">`:`<div class="product-modal-icon">${esc(p.icon||'📦')}</div>`;b.innerHTML=`${media}<div class="product-modal-title">${esc(p.name)}</div><div class="product-modal-price">${+o.price||0} ₽</div>${os.length>1?`<div class="product-modal-label">Количество</div><div class="quantity-options">${os.map(x=>`<button type="button" class="quantity-option ${+x.qty===+o.qty?'active':''}" data-em-q="${+x.qty}">${+x.qty} шт.<small>${+x.price} ₽</small></button>`).join('')}</div>`:''}${p.description?`<div class="product-modal-label">Описание</div><div class="product-modal-text">${esc(p.description)}</div>`:''}<div class="product-modal-actions"><button type="button" class="buy-btn" id="emBuy">⚡ Оформить</button></div>`;m.classList.add('open');document.body.style.overflow='hidden';b.querySelectorAll('[data-em-q]').forEach(x=>x.onclick=()=>modal(p,+x.dataset.emQ));document.getElementById('emBuy').onclick=()=>{add(p,o.qty);closeModal()}}
            function render(){let box=document.getElementById('products');if(!box)return;let q=(document.getElementById('searchInput')?.value||'').toLowerCase();let a=ps.filter(p=>(!p.seller_id||String(p.approval_status||'approved')==='approved')&&(!q||String(p.name||'').toLowerCase().includes(q)||String(p.description||'').toLowerCase().includes(q)));box.innerHTML=a.length?a.map(p=>`<div class="product" data-em-p="${+p.id}">${p.image_url?`<img class="product-image" src="${esc(p.image_url)}">`:`<div class="product-icon">${esc(p.icon||'📦')}</div>`}<div class="product-name">${esc(p.name)}</div><div class="product-description">${esc(p.description||'')}</div><div class="product-bottom"><div class="product-cart-action"><div class="price">${+p.price||0} ₽</div><button class="buy-btn" data-em-b="${+p.id}">⚡ Оформить</button></div></div></div>`).join(''):'<div class="empty">Товары не найдены 📦</div>';box.querySelectorAll('[data-em-p]').forEach(x=>x.onclick=e=>{if(e.target.closest('[data-em-b]'))return;let p=ps.find(z=>+z.id===+x.dataset.emP);if(p)modal(p)});box.querySelectorAll('[data-em-b]').forEach(x=>x.onclick=e=>{e.stopPropagation();let p=ps.find(z=>+z.id===+x.dataset.emB);if(p)add(p,options(p)[0].qty)})}
            async function checkout(){if(!cart.length)return toast('Корзина пустая');let u=tg?.initDataUnsafe?.user||{},total=cart.reduce((s,p)=>s+(+p.price||0),0),r=await db.from('orders').insert({telegram_id:u.id?String(u.id):null,telegram_username:u.username?String(u.username):null,total,status:'pending',seller_id:null,seller_status:'pending',buyer_received:false}).select().single();if(r.error)return toast('Ошибка заказа: '+r.error.message);let rows=cart.map(p=>({order_id:r.data.id,product_id:p.id,product_name:p.name,price:+p.price||0,quantity:+p.quantity||1,seller_id:p.seller_id?String(p.seller_id):null})),ir=await db.from('order_items').insert(rows);if(ir.error)return toast('Ошибка товаров: '+ir.error.message);try{await db.functions.invoke('notify-order',{body:{record:r.data,items:rows,status_text:'В ожидании'}})}catch(e){}cart=[];save();drawCart();document.getElementById('cartPanel')?.classList.remove('open');toast('Заказ №'+r.data.id+' создан ✅');try{tg?.showAlert?.('Заказ №'+r.data.id+' оформлен!')}catch(e){}}
            function bind(){loadCart();document.addEventListener('click',e=>{let r=e.target.closest('[data-em-r]');if(r){cart.splice(+r.dataset.emR,1);save();drawCart()}if(e.target.id==='checkoutButton')checkout()},true);document.getElementById('searchInput')?.addEventListener('input',render);render();drawCart()}
            async function start(){if(!window.supabase)return;db=window.supabase.createClient(U,K);let r=await db.from('products').select('*').order('id',{ascending:false});if(!r.error){ps=r.data||[];render()}}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>{bind();start()});else{bind();start()}
            window.emFinal={modal,openCart,checkout};
          })();
          </script>
          '''
          pos=s.lower().rfind('</body>')
          if pos<0: raise SystemExit('no body')
          s=s[:pos]+bridge+s[pos:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit finalized file
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index-final.html
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'Finalize Telegram product and cart interactions'; git push; fi
