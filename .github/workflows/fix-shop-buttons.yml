name: Fix shop buttons

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch only product open and add-to-cart behavior
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* EM-SHOP-BUTTONS-FIX-2026-09-16 */'
          if marker not in s:
              patch = r'''
          /* EM-SHOP-BUTTONS-FIX-2026-09-16 */
          function openProductModal(productId, selectedQty) {
            const product = (products || []).find(item => Number(item.id) === Number(productId));
            const modal = document.getElementById('productModal');
            const content = document.getElementById('productModalContent');
            if (!product || !modal || !content) {
              try { showToast('Товар не найден'); } catch(e) {}
              return;
            }
            if (product.seller_id && String(product.approval_status || 'approved') !== 'approved') {
              try { showToast('Этот товар ещё не опубликован площадкой'); } catch(e) {}
              return;
            }

            let options = [];
            try { options = getPriceOptions(product) || []; } catch(e) {}
            if (!Array.isArray(options) || !options.length) {
              options = [{ qty: 1, price: Number(product.price || 0) }];
            }
            const selected = options.find(o => Number(o.qty) === Number(selectedQty)) || options[0];
            const media = product.image_url
              ? `<img class="product-modal-image" src="${escapeHtml(product.image_url)}" alt="${escapeHtml(product.name || '')}">`
              : `<div class="product-modal-icon">${escapeHtml(product.icon || '📦')}</div>`;
            const optionHtml = options.map(o => `
              <button type="button" class="quantity-option ${Number(o.qty) === Number(selected.qty) ? 'active' : ''}" onclick="selectProductQuantity(${Number(product.id)},${Number(o.qty)})">
                ${Number(o.qty)} шт.<small>${Number(o.price || 0)} ₽</small>
              </button>
            `).join('');

            content.innerHTML = `
              ${media}
              <div class="product-modal-title">${escapeHtml(product.name || '')}</div>
              <div class="product-modal-price" id="modalSelectedPrice">${Number(selected.price || 0)} ₽</div>
              ${options.length > 1 ? `<div class="product-modal-label">Количество</div><div class="quantity-options">${optionHtml}</div>` : ''}
              ${product.description ? `<div class="product-modal-label">Описание</div><div class="product-modal-text">${escapeHtml(cleanProductText(product.description))}</div>` : ''}
              ${product.details ? `<div class="product-modal-label">Детали</div><div class="product-modal-text">${escapeHtml(cleanProductText(product.details))}</div>` : ''}
              <div class="product-modal-actions">
                <button type="button" class="buy-btn product-buy-now" onclick="addToCartFromModal(${Number(product.id)},${Number(selected.qty)})">⚡ Оформить</button>
              </div>
            `;
            modal.classList.add('open');
            document.body.style.overflow = 'hidden';
          }

          function selectProductQuantity(productId, qty) {
            openProductModal(productId, Number(qty));
          }

          function addToCartFromModal(productId, qty) {
            const ok = addToCart(productId, Number(qty));
            if (ok) closeProductModal();
            return ok;
          }

          function addToCart(productId, qty) {
            const product = (products || []).find(item => Number(item.id) === Number(productId));
            if (!product) {
              try { showToast('Товар не найден'); } catch(e) {}
              return false;
            }
            let options = [];
            try { options = getPriceOptions(product) || []; } catch(e) {}
            if (!Array.isArray(options) || !options.length) {
              options = [{ qty: 1, price: Number(product.price || 0) }];
            }
            const chosen = options.find(o => Number(o.qty) === Number(qty)) || options[0];
            const existingIndex = cart.findIndex(item => Number(item.id) === Number(product.id));
            if (existingIndex === -1) {
              cart.push({ ...product, quantity: Number(chosen.qty || 1), price: Number(chosen.price || 0) });
              saveCart();
              updateCart();
              try { showToast('Товар добавлен 🛒'); } catch(e) {}
              return true;
            }
            try { showToast('Товар уже в корзине 🛒'); } catch(e) {}
            updateCart();
            return true;
          }

          window.openProductModal = openProductModal;
          window.selectProductQuantity = selectProductQuantity;
          window.addToCartFromModal = addToCartFromModal;
          window.addToCart = addToCart;
          '''
              # Put the override inside the existing main script, immediately before its closing tag.
              pos = s.rfind('</script>')
              if pos == -1:
                  raise SystemExit('No closing script tag found')
              s = s[:pos] + '\n' + patch + '\n' + s[pos:]
              p.write_text(s, encoding='utf-8')
          else:
              print('Patch already present')
          PY

      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Fix product modal and add-to-cart buttons only'
            git push
          fi
