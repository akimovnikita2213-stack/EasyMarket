name: Build final EasyMarket
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy the working page exactly
        shell: bash
        run: cp index.html index-final.html
      - name: Commit final file
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index-final.html
          git commit -m 'Sync final Telegram page with working EasyMarket page' || exit 0
          git push
