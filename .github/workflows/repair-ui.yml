name: EasyMarket functional repair
on:
  push:
    paths:
      - '.github/workflows/repair-ui.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append robust functional layer
        run: |
          cat repair.js >> index.html
      - name: Commit repaired index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Repair product opening and cart while preserving stable design'
          git push
      - name: Remove temporary files
        run: |
          git rm repair.js .github/workflows/repair-ui.yml
          git commit -m 'Remove temporary repair files'
          git push