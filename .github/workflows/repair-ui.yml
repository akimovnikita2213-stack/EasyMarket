name: EasyMarket functional repair
on:
  push:
    paths:
      - '.github/workflows/repair-ui.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair product and cart functions
        run: |
          python3 -c "import base64;from pathlib import Path;p=Path('index.html');s=p.read_text(encoding='utf-8');marker='/* EM-FUNCTIONAL-FIX-2026-09-16 */';patch=base64.b64decode('':'');\n" )
          PYTHON_UNUSED=true
      - name: Commit repaired index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Repair product opening, checkout and cart without changing design' || true
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/repair-ui.yml
          git commit -m 'Remove temporary repair workflow' || true
          git push