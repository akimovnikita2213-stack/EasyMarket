name: Restore EasyMarket index
on:
  push:
    paths:
      - '.github/workflows/restore-index-design.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore index.html from the stable design
        run: |
          cp index34.html index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/restore-index-design.yml
          git commit -m 'Restore stable EasyMarket design and UI'
          git push
