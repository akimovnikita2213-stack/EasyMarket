name: Repair EasyMarket shop handlers
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore stable index and bind shop handlers
        shell: bash
        run: |
          set -e
          git checkout 959f148b36e766b9a3842e2f390769dec37b8425 -- index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''(function(){
            const names = [
              'openProductModal','closeProductModal','addToCart','addToCartFromModal','buyNow',
              'openCart','closeCart','changeCartQuantity','removeFromCart','checkout',
              'setCategory','renderProducts','selectProductQuantity'
            ];
            names.forEach(function(name){
              try { if (typeof window[name] !== 'function' && typeof globalThis[name] === 'function') window[name] = globalThis[name]; } catch(e) {}
            });
          })();'''
          new='''window.openProductModal = openProductModal;
          window.closeProductModal = closeProductModal;
          window.addToCart = addToCart;
          window.addToCartFromModal = addToCartFromModal;
          window.buyNow = buyNow;
          window.openCart = openCart;
          window.closeCart = closeCart;
          window.changeCartQuantity = changeCartQuantity;
          window.removeFromCart = removeFromCart;
          window.checkout = checkout;
          window.setCategory = setCategory;
          window.renderProducts = renderProducts;
          window.selectProductQuantity = selectProductQuantity;'''
          if old not in s:
              raise SystemExit('handler bridge block not found')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix product modal and checkout handlers only'
          git push
