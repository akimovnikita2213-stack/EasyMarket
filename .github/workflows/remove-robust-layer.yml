name: Remove robust layer
on:
  push:
    branches: [main]
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove appended code after marker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* EM-ROBUST-FUNCTIONAL-LAYER-2026-09-16 */'
          if marker in s:
              s=s.split(marker,1)[0].rstrip()+"\n"
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Remove broken robust functional layer' || true
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/remove-robust-layer.yml
          git commit -m 'Remove temporary repair workflow' || true
          git push
