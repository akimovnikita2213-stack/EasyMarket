name: One-time quantity pricing repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject quantity helper into main page
        run: |
          if ! grep -q 'src="./telegram-fix.js"' index.html; then
            sed -i 's#</body>#<script src="./telegram-fix.js"></script></body>#' index.html
          fi
      - name: Validate helper
        run: node --check telegram-fix.js
      - name: Commit repair and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/one-time-quantity-repair.yml
          git commit -m 'Enable quantity and price options'
          git push
