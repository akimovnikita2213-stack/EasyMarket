name: Sync final copies
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync final and fixed copies
        shell: bash
        run: |
          cp index.html index-final.html
          cp index.html index-fixed.html
      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index-final.html index-fixed.html
          git commit -m 'Sync final and fixed pages with current index' || true
          git rm .github/workflows/sync-final.yml || true
          git commit -m 'Remove one-time sync workflow' || true
          git push
