name: Inject buyer price options
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject script
        run: |
          if ! grep -q 'buyer-price-options.js' index.html; then
            sed -i 's#</body>#<script src="./buyer-price-options.js"></script></body>#' index.html
          fi
      - name: Validate JavaScript
        run: node --check buyer-price-options.js
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/one-time-inject-buyer-options.yml
          git commit -m 'Show buyer quantity and price options in product modal'
          git push
