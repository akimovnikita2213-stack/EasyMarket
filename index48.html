<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>EasyMarket</title>
</head>
<body style="margin:0;background:#0b0d12;color:#fff;font-family:Arial,sans-serif">
<div style="padding:20px;text-align:center;color:#9db1cc">Загрузка EasyMarket…</div>
<script>
(async()=>{
  try{
    const r=await fetch('./index34.html?build=48_'+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    let html=await r.text();
    const patch=`
<style id="em48-variants-style">
#em48Variants{margin:14px 0;padding:14px;background:#12151c;border:1px solid #292d38;border-radius:16px}
.em48row{display:grid;grid-template-columns:1fr 1fr 1fr 40px;gap:7px;margin-bottom:8px}
.em48row input{width:100%;min-width:0;padding:11px;border-radius:10px;border:1px solid #303542;background:#191c25;color:#fff;box-sizing:border-box}
.em48del,.em48add{border:0;border-radius:10px;background:#252934;color:#fff}.em48add{width:100%;height:44px;font-weight:800}
#sellerPublishProductBtn{width:100%!important;min-height:54px!important;height:54px!important;padding:14px 16px!important;border-radius:13px!important;font-size:16px!important;font-weight:800!important;box-sizing:border-box!important}
</style>
<script>
(function(){
  function install(){
    const btn=document.getElementById('sellerPublishProductBtn');
    const photo=document.getElementById('sellerProductImage');
    if(!btn||!photo||document.getElementById('em48Variants'))return;
    const w=document.createElement('div');w.id='em48Variants';
    w.innerHTML='<b style="display:block;margin-bottom:10px">Варианты товара</b><div id="em48list"></div><button id="em48add" class="em48add" type="button">＋ Добавить вариант</button><div style="color:#8d93a2;font-size:12px;margin-top:7px">Количество • Цена ₽ • Остаток</div>';
    photo.parentNode.insertBefore(w,photo);
    const list=document.getElementById('em48list'),add=document.getElementById('em48add');
    function row(q='',p='',s='1'){
      const x=document.createElement('div');x.className='em48row';
      x.innerHTML='<input class="em48qty" type="number" min="1" step="1" placeholder="Количество" value="'+q+'"><input class="em48price" type="number" min="0" step="1" placeholder="Цена ₽" value="'+p+'"><input class="em48stock" type="number" min="0" step="1" placeholder="Остаток" value="'+s+'"><button class="em48del" type="button">×</button>';
      x.querySelector('button').onclick=()=>{if(list.children.length>1)x.remove()};list.appendChild(x);
    }
    row(1,'','1');add.onclick=()=>row();
    btn.type='button';
    btn.addEventListener('click',async function(e){
      e.preventDefault();e.stopImmediatePropagation();
      const rows=[...document.querySelectorAll('.em48row')];
      const options=rows.map(x=>({qty:Number(x.querySelector('.em48qty').value),price:Number(x.querySelector('.em48price').value),stock:Number(x.querySelector('.em48stock').value)})).filter(x=>x.qty>0&&x.price>=0&&x.stock>=0);
      if(!options.length||options.length!==rows.length){alert('Заполните варианты товара');return;}
      const name=document.getElementById('sellerProductName')?.value.trim();
      if(!name){alert('Введите название');return;}
      const me=typeof getMyUserRecord==='function'?await getMyUserRecord():null;
      if(!me?.is_seller){alert('Нет прав продавца');return;}
      const imageInput=document.getElementById('sellerProductImage');const file=imageInput?.files?.[0];
      if(!file){alert('Добавьте фото товара');return;}
      btn.disabled=true;btn.textContent='Публикуем…';
      try{
        let imageUrl=null;
        if(typeof compressSellerImage==='function') imageUrl=await compressSellerImage(file,900,.72,550*1024);
        else imageUrl=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(file)});
        const description=document.getElementById('sellerProductDescription')?.value.trim()||'';
        const details=document.getElementById('sellerProductDetails')?.value.trim()||'';
        const icon=document.getElementById('sellerProductIcon')?.value.trim()||'📦';
        const category=document.getElementById('sellerProductCategory')?.value||'other';
        const first=options[0];
        const payload={name,description,details,price:first.price,icon,category,image_url:imageUrl,seller_id:Number(me.telegram_id),seller_username:me.username?String(me.username).replace(/^@/,''):null,stock:first.stock,price_options:options.map(x=>({qty:x.qty,price:x.price,stock:x.stock})),approval_status:'pending'};
        const {data,error}=await supabaseClient.from('products').insert(payload).select('*').single();
        if(error)throw error;
        alert('Товар отправлен на проверку 🕐');
        ['sellerProductName','sellerProductDescription','sellerProductDetails','sellerProductPrice'].forEach(id=>{const el=document.getElementById(id);if(el)el.value=''});
        document.getElementById('sellerProductStock').value='1';document.getElementById('sellerProductImage').value='';document.getElementById('sellerProductImagePreview').innerHTML='';
        if(typeof loadProducts==='function')await loadProducts();if(typeof loadSellerDashboard==='function')await loadSellerDashboard();
      }catch(err){console.error(err);alert('Ошибка: '+(err?.message||err));}
      finally{btn.disabled=false;btn.textContent='Опубликовать товар';}
    },true);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install);else install();
  setTimeout(install,500);setTimeout(install,1500);
})();
<\/script>`;
    html=html.replace('</body>',patch+'</body>');
    document.open();document.write(html);document.close();
  }catch(e){document.body.innerHTML='<div style="padding:30px;color:#fff">Ошибка загрузки EasyMarket: '+String(e.message||e)+'</div>';}
})();
</script>
</body>
</html>
