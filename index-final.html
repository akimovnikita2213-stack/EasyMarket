<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>EasyMarket</title>
<meta name="easymarket-version" content="stable-clean-2026-09-16">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#0b0d12;color:#fff;font-family:Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}.container{max-width:1100px;margin:auto;padding:15px}header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}.logo{font-size:24px;font-weight:800}.logo span{color:#6c63ff}.header-buttons{display:flex;gap:8px}.icon-btn{width:42px;height:42px;border:0;border-radius:12px;background:#171a23;color:#fff;font-size:18px}.search{margin-bottom:14px}.search input{width:100%;padding:14px 16px;border:1px solid #252936;border-radius:14px;outline:0;background:#141720;color:#fff}.categories{display:flex;gap:8px;overflow-x:auto;padding-bottom:5px;margin-bottom:18px}.categories::-webkit-scrollbar{display:none}.category{flex-shrink:0;border:1px solid #282c38;background:#151821;color:#bbb;padding:10px 14px;border-radius:12px}.category.active{background:#6c63ff;border-color:#6c63ff;color:#fff}.section-title{font-size:21px;font-weight:800;margin-bottom:14px}.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(min-width:700px){.products{grid-template-columns:repeat(4,minmax(0,1fr))}}.product{background:#141720;border:1px solid #242834;border-radius:18px;padding:12px;cursor:pointer;min-width:0}.product-image,.product-icon{width:100%;aspect-ratio:16/10;border-radius:14px;background:#1b1e28;margin-bottom:12px}.product-image{object-fit:cover}.product-icon{display:flex;align-items:center;justify-content:center;font-size:42px}.product-name{font-size:16px;font-weight:700;margin-bottom:6px;line-height:1.25}.product-description{color:#8e94a4;font-size:12px;line-height:1.35;min-height:33px;margin-bottom:10px}.product-bottom{display:flex;justify-content:space-between;align-items:center;gap:8px}.price{font-weight:800;font-size:16px;white-space:nowrap}.buy-btn,.checkout-btn,.primary{border:0;background:#6c63ff;color:#fff;border-radius:10px;padding:10px 12px;font-weight:800}.buy-btn{font-size:13px}.empty,.loading{text-align:center;color:#858b99;padding:50px 20px;grid-column:1/-1}.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:1000;align-items:flex-end;justify-content:center;padding:12px}.overlay.open{display:flex}.modal{width:100%;max-width:620px;max-height:90vh;overflow:auto;background:#141720;border:1px solid #292e3b;border-radius:22px;padding:16px;position:relative}.close{position:absolute;right:12px;top:12px;width:38px;height:38px;border:0;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:24px;z-index:3}.modal-media{width:100%;max-height:330px;object-fit:cover;border-radius:16px;margin-bottom:15px;background:#1b1e28}.modal-icon{height:180px;border-radius:16px;background:#1b1e28;display:flex;align-items:center;justify-content:center;font-size:70px;margin-bottom:15px}.modal h2{font-size:23px;margin:0 45px 8px 0}.modal-price{font-size:22px;font-weight:800;margin:12px 0}.label{font-size:13px;color:#858b99;margin:14px 0 6px;font-weight:700}.text{color:#d9dce3;line-height:1.5;white-space:pre-line}.variants{display:grid;gap:8px}.variant{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px;border:1px solid #292d38;border-radius:12px;background:#181b24}.variant.active{border-color:#6c63ff;background:#201e3d}.variant button{border:0;background:transparent;color:#fff;text-align:left;flex:1}.variant-price{font-weight:800}.qty{display:flex;align-items:center;gap:10px;margin:14px 0}.qty button{width:38px;height:38px;border:0;border-radius:10px;background:#252934;color:#fff;font-size:20px}.qty span{min-width:35px;text-align:center;font-weight:800}.modal-actions{display:flex;gap:8px}.modal-actions button{flex:1}.cart-panel{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:1100;align-items:flex-end}.cart-panel.open{display:flex}.cart-box{width:100%;max-height:85vh;overflow:auto;padding:20px 20px 110px;background:#11141b;border-radius:22px 22px 0 0;border-top:1px solid #292d38;position:relative}.cart-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.cart-title{font-size:22px;font-weight:800}.cart-item{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #242833}.cart-item-name{font-weight:700}.cart-item-price{color:#aaa;font-size:13px;margin-top:4px}.remove{border:0;background:#272a34;color:#fff;border-radius:8px;padding:7px 9px}.cart-total{display:flex;justify-content:space-between;margin:20px 0;font-size:19px;font-weight:800}.cart-footer{position:absolute;left:0;right:0;bottom:0;padding:14px 20px 20px;background:#11141b;border-top:1px solid #292d38}.checkout-btn{width:100%;min-height:52px;font-size:16px}.checkout-btn:disabled{opacity:.55}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%) translateY(20px);background:#20242f;color:#fff;padding:12px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:3000;border:1px solid #303543;max-width:calc(100% - 30px);text-align:center}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.spin{display:inline-block;width:18px;height:18px;border:2px solid #777;border-top-color:#fff;border-radius:50%;animation:r .7s linear infinite;vertical-align:middle}@keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="container">
<header><div class="logo">Easy<span>Market</span></div><div class="header-buttons"><button class="icon-btn" id="cartBtn" type="button">🛒</button></div></header>
<div class="search"><input id="search" placeholder="Поиск товара..."></div>
<div class="categories" id="categories"></div>
<div class="section-title">Товары</div>
<div class="products" id="products"><div class="loading">Загрузка...</div></div>
</div>

<div class="overlay" id="productOverlay"><div class="modal" id="productModal"><button class="close" id="productClose" type="button">×</button><div id="modalContent"></div></div></div>
<div class="cart-panel" id="cartPanel"><div class="cart-box"><div class="cart-header"><div class="cart-title">Корзина</div><button class="close" id="cartClose" type="button">×</button></div><div id="cartItems"></div><div class="cart-total"><span>Итого</span><span id="cartTotal">0 ₽</span></div><div class="cart-footer"><button class="checkout-btn" id="checkoutBtn" type="button">Оформить заказ</button></div></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
const SUPABASE_URL='https://uhmgjcoyxehknkehfbbj.supabase.co';
const SUPABASE_KEY='sb_publishable_7Bn4Azfm58BkIJS_6vSsUw_qbGS4wTH';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const tg=window.Telegram?.WebApp;
if(tg){try{tg.ready();tg.expand()}catch(e){}}
let products=[];
let cart=[];
let activeCategory='all';
let selectedProduct=null;
let selectedVariant=0;
let selectedQty=1;
const $=id=>document.getElementById(id);
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.remove('show'),2200)}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function variantsOf(p){let a=Array.isArray(p.price_options)?p.price_options:[];if(!a.length){const price=Number(p.price)||0;const stock=p.stock==null?999:Number(p.stock);return [{quantity:1,price,stock}]};return a.map(x=>({quantity:Math.max(1,Number(x.quantity)||1),price:Math.max(0,Number(x.price)||0),stock:x.stock==null?999:Math.max(0,Number(x.stock)||0)}))}
function firstPrice(p){const a=variantsOf(p);return a[0]?.price||Number(p.price)||0}
function categories(){const cats=[...new Set(products.map(p=>p.category).filter(Boolean))];$('categories').innerHTML='<button class="category active" data-cat="all" type="button">Все</button>'+cats.map(c=>`<button class="category" data-cat="${esc(c)}" type="button">${esc(c)}</button>`).join('');document.querySelectorAll('.category').forEach(b=>b.onclick=()=>{activeCategory=b.dataset.cat;document.querySelectorAll('.category').forEach(x=>x.classList.toggle('active',x===b));render()})}
function render(){const q=$('search').value.trim().toLowerCase();const list=products.filter(p=>(activeCategory==='all'||p.category===activeCategory)&&(!q||`${p.name} ${p.description||''} ${p.details||''}`.toLowerCase().includes(q)));if(!list.length){$('products').innerHTML='<div class="empty">Товаров пока нет</div>';return}$('products').innerHTML=list.map(p=>{const img=p.image_url?`<img class="product-image" src="${esc(p.image_url)}" alt="" loading="lazy">`:`<div class="product-icon">${esc(p.icon||'🛍️')}</div>`;const stock=variantsOf(p).reduce((n,v)=>n+(v.stock>0?v.stock:0),0);return `<div class="product" data-id="${Number(p.id)}"><div>${img}</div><div class="product-name">${esc(p.name)}</div><div class="product-description">${esc(p.description||p.details||'')}</div><div class="product-bottom"><div class="price">от ${firstPrice(p)} ₽</div><button class="buy-btn" data-buy="${Number(p.id)}" type="button">⚡ Оформить</button></div></div>`}).join('');document.querySelectorAll('.product').forEach(el=>el.onclick=e=>{if(e.target.closest('[data-buy]'))return;openProduct(Number(el.dataset.id))});document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=e=>{e.stopPropagation();quickBuy(Number(b.dataset.buy))})}
function openProduct(id){const p=products.find(x=>Number(x.id)===Number(id));if(!p){toast('Товар не найден');return}selectedProduct=p;selectedVariant=0;selectedQty=1;renderModal();$('productOverlay').classList.add('open')}
function renderModal(){const p=selectedProduct;if(!p)return;const vs=variantsOf(p);if(selectedVariant>=vs.length)selectedVariant=0;const v=vs[selectedVariant];const media=p.image_url?`<img class="modal-media" src="${esc(p.image_url)}" alt="">`:`<div class="modal-icon">${esc(p.icon||'🛍️')}</div>`;$('modalContent').innerHTML=`${media}<h2>${esc(p.name)}</h2><div class="modal-price">${v.price} ₽</div><div class="label">Вариант</div><div class="variants">${vs.map((x,i)=>`<div class="variant ${i===selectedVariant?'active':''}"><button type="button" data-var="${i}">${x.quantity} шт. · ${x.price} ₽ · ${x.stock>0?'в наличии':'нет в наличии'}</button></div>`).join('')}</div><div class="qty"><button type="button" id="minus">−</button><span id="qty">${selectedQty}</span><button type="button" id="plus">+</button></div><div class="label">Описание</div><div class="text">${esc(p.details||p.description||'')}</div><div class="modal-actions"><button class="primary" id="addModal" type="button" ${v.stock<=0?'disabled':''}>В корзину</button><button class="primary" id="buyModal" type="button" ${v.stock<=0?'disabled':''}>⚡ Оформить</button></div>`;document.querySelectorAll('[data-var]').forEach(b=>b.onclick=()=>{selectedVariant=Number(b.dataset.var);selectedQty=1;renderModal()});$('minus').onclick=()=>{selectedQty=Math.max(1,selectedQty-1);$('qty').textContent=selectedQty};$('plus').onclick=()=>{selectedQty=Math.min(v.stock||1,selectedQty+1);$('qty').textContent=selectedQty};$('addModal').onclick=()=>{addToCart(p.id,selectedVariant,selectedQty);closeProduct()};$('buyModal').onclick=()=>{addToCart(p.id,selectedVariant,selectedQty);closeProduct();openCart()}}
function closeProduct(){$('productOverlay').classList.remove('open')}
function quickBuy(id){const p=products.find(x=>Number(x.id)===Number(id));if(!p)return;const v=variantsOf(p)[0];if(!v||v.stock<=0){toast('Товар закончился');return}addToCart(id,0,1);openCart()}
function addToCart(id,vi,qty){const p=products.find(x=>Number(x.id)===Number(id));if(!p)return;const v=variantsOf(p)[vi];if(!v||v.stock<=0){toast('Товар закончился');return}const max=v.stock||999999;qty=Math.min(Math.max(1,Number(qty)||1),max);const key=`${id}:${vi}`;const old=cart.find(x=>x.key===key);if(old)old.quantity=Math.min(old.quantity+qty,max);else cart.push({key,productId:Number(id),variantIndex:vi,quantity:qty,name:p.name,price:v.price,variantQty:v.quantity});saveCart();renderCart();toast('Добавлено в корзину')}
function saveCart(){try{localStorage.setItem('easymarket_cart',JSON.stringify(cart))}catch(e){}}
function loadCart(){try{const x=JSON.parse(localStorage.getItem('easymarket_cart')||'[]');if(Array.isArray(x))cart=x}catch(e){cart=[]}}
function renderCart(){if(!cart.length){$('cartItems').innerHTML='<div class="empty">Корзина пуста</div>'}else{$('cartItems').innerHTML=cart.map((x,i)=>`<div class="cart-item"><div><div class="cart-item-name">${esc(x.name)}</div><div class="cart-item-price">${x.variantQty} шт. · ${x.price} ₽ × ${x.quantity}</div></div><button class="remove" data-remove="${i}" type="button">Удалить</button></div>`).join('');document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{cart.splice(Number(b.dataset.remove),1);saveCart();renderCart()})}const total=cart.reduce((s,x)=>s+x.price*x.quantity,0);$('cartTotal').textContent=`${total} ₽`;$('checkoutBtn').disabled=!cart.length}
function openCart(){renderCart();$('cartPanel').classList.add('open')}
function closeCart(){$('cartPanel').classList.remove('open')}
function telegramUser(){const u=tg?.initDataUnsafe?.user;return {id:u?.id?String(u.id):'',username:u?.username||'',first_name:u?.first_name||''}}
async function checkout(){if(!cart.length)return;const btn=$('checkoutBtn');btn.disabled=true;btn.textContent='Оформляем…';try{const user=telegramUser();if(!user.id){toast('Откройте магазин через Telegram');return}const total=cart.reduce((s,x)=>s+x.price*x.quantity,0);const {data:order,error:oe}=await db.from('orders').insert({telegram_id:user.id,telegram_username:user.username,total,status:'pending',seller_id:null,seller_status:'pending'}).select('id').single();if(oe)throw oe;const rows=cart.map(x=>({order_id:order.id,product_id:x.productId,product_name:x.name,price:x.price,quantity:x.quantity,seller_id:String(products.find(p=>Number(p.id)===x.productId)?.seller_id||'')}));const {error:ie}=await db.from('order_items').insert(rows);if(ie)throw ie;try{await db.functions.invoke('notify-order',{body:{order_id:order.id,telegram_id:user.id,telegram_username:user.username,total,items:cart.map(x=>({product_id:x.productId,product_name:x.name,price:x.price,quantity:x.quantity}))}})}catch(e){}cart=[];saveCart();renderCart();toast(`Заказ №${order.id} оформлен`);setTimeout(closeCart,900)}catch(e){console.error(e);toast('Не удалось оформить заказ')}finally{btn.disabled=!cart.length;btn.textContent='Оформить заказ'}}
$('search').addEventListener('input',render);$('cartBtn').onclick=openCart;$('cartClose').onclick=closeCart;$('productClose').onclick=closeProduct;$('checkoutBtn').onclick=checkout;$('productOverlay').onclick=e=>{if(e.target===$('productOverlay'))closeProduct()};$('cartPanel').onclick=e=>{if(e.target===$('cartPanel'))closeCart()};loadCart();renderCart();
async function loadProducts(){const box=$('products');box.innerHTML='<div class="loading"><span class="spin"></span> Загрузка...</div>';const {data,error}=await db.from('products').select('*').order('id',{ascending:false});if(error){console.error(error);box.innerHTML='<div class="empty">Не удалось загрузить товары</div>';return}products=(data||[]).filter(p=>p.approval_status===undefined||p.approval_status==='approved');categories();render()}
loadProducts();
</script>
</body>
</html>
