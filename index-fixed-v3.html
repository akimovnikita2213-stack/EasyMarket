<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>EasyMarket</title>
<style>html,body{margin:0;min-height:100%;background:#0b0d12;color:#fff;font-family:Arial,sans-serif}#boot{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}</style>
</head>
<body>
<div id="boot">Открываем EasyMarket…</div>
<script>
(async function(){
  'use strict';
  var boot=document.getElementById('boot');
  var source='./index.html?telegram=1&fixed=20260917';
  var fix='./supabase-global-fix.js?v=20260917';
  try{
    var r=await fetch(source,{cache:'no-store'});
    if(!r.ok)throw new Error('index.html HTTP '+r.status);
    var html=await r.text();
    var parsed=new DOMParser().parseFromString(html,'text/html');
    if(!parsed||!parsed.documentElement)throw new Error('Invalid index.html');

    document.documentElement.replaceWith(document.importNode(parsed.documentElement,true));

    var fixScript=document.createElement('script');
    fixScript.src=fix;
    fixScript.async=false;
    document.head.insertBefore(fixScript,document.head.firstChild);
    await new Promise(function(resolve,reject){fixScript.onload=resolve;fixScript.onerror=reject;});

    var scripts=Array.from(document.querySelectorAll('script'));
    for(var i=0;i<scripts.length;i++){
      var old=scripts[i];
      if(old===fixScript)continue;
      var s=document.createElement('script');
      for(var j=0;j<old.attributes.length;j++){
        var a=old.attributes[j];
        if(a.name!=='src')s.setAttribute(a.name,a.value);
      }
      if(old.src){
        s.src=old.src;
        s.async=false;
        await new Promise(function(resolve,reject){s.onload=resolve;s.onerror=function(){reject(new Error('Script failed: '+s.src));};});
      }else{
        s.textContent=old.textContent;
        old.replaceWith(s);
      }
    }
  }catch(e){
    console.error('[EasyMarket fixed loader]',e);
    document.body.innerHTML='<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:#fff;font-family:Arial,sans-serif"><div>Не удалось загрузить EasyMarket.<br><br><button onclick="location.reload()" style="padding:12px 18px;border:0;border-radius:12px;background:#6c63ff;color:#fff;font-weight:700">Повторить</button></div></div>';
  }
})();
</script>
</body>
</html>
